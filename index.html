<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Job Logger</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }
        body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        #root {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SITES = {
            NX: { label: 'NX', hex: '#FFD60A', bg: 'rgba(255, 214, 10, 0.1)' },
            WS: { label: 'WS', hex: '#FF006E', bg: 'rgba(255, 0, 110, 0.1)' },
            RH: { label: 'RH', hex: '#00F5FF', bg: 'rgba(0, 245, 255, 0.1)' },
            MMUH: { label: 'MMUH', hex: '#FF5D00', bg: 'rgba(255, 93, 0, 0.1)' }
        };

        function JobLogger() {
            const [jobs, setJobs] = useState([]);
            const [showNewCard, setShowNewCard] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                ticketNumber: '',
                startDateTime: '',
                finishDateTime: '',
                workDone: '',
                parts: [{ partNumber: '', partDescription: '' }],
                site: ''
            });
            const [expandedMonth, setExpandedMonth] = useState(null);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('jobsData');
                    if (saved) {
                        setJobs(JSON.parse(saved));
                    }
                } catch (error) {
                    console.log('No saved jobs');
                }
            }, []);

            const exportToCSV = (jobsToExport) => {
                let csv = 'Ticket Number,Date,Site,Start Time,Finish Time,Work Done,Parts Used\n';
                
                jobsToExport.forEach(job => {
                    const startDate = new Date(job.startDateTime);
                    const finishDate = new Date(job.finishDateTime);
                    
                    const partsText = job.parts && job.parts.length > 0
                        ? job.parts
                            .filter(p => p.partNumber || p.partDescription)
                            .map(p => `${p.partNumber} - ${p.partDescription}`)
                            .join('; ')
                        : '';

                    const dateStr = startDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const startTimeStr = startDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    const finishTimeStr = finishDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    const siteLabel = SITES[job.site] ? SITES[job.site].label : '';

                    const workDoneEscaped = `"${job.workDone.replace(/"/g, '""')}"`;
                    const partsEscaped = `"${partsText.replace(/"/g, '""')}"`;

                    csv += `${job.ticketNumber},${dateStr},${siteLabel},${startTimeStr},${finishTimeStr},${workDoneEscaped},${partsEscaped}\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Job-Logger-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const initializeForm = () => {
                const now = new Date();
                const isoDateTime = now.toISOString().slice(0, 16);
                setFormData({
                    ticketNumber: '',
                    startDateTime: isoDateTime,
                    finishDateTime: isoDateTime,
                    workDone: '',
                    parts: [{ partNumber: '', partDescription: '' }],
                    site: ''
                });
            };

            const handleNewJob = () => {
                initializeForm();
                setEditingId(null);
                setShowNewCard(true);
            };

            const handleEditJob = (job) => {
                setFormData({
                    ...job,
                    parts: job.parts || [{ partNumber: '', partDescription: '' }]
                });
                setEditingId(job.id);
                setShowNewCard(true);
            };

            const handleSave = () => {
                if (!formData.ticketNumber.trim()) {
                    alert('Please enter a ticket number');
                    return;
                }

                let updatedJobs;
                if (editingId) {
                    updatedJobs = jobs.map(job => 
                        job.id === editingId ? { ...formData, id: editingId } : job
                    );
                } else {
                    updatedJobs = [{ ...formData, id: Date.now() }, ...jobs];
                }

                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
                exportToCSV(updatedJobs);
                
                setShowNewCard(false);
                initializeForm();
            };

            const handleDelete = (id) => {
                const updatedJobs = jobs.filter(job => job.id !== id);
                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
                
                if (updatedJobs.length > 0) {
                    exportToCSV(updatedJobs);
                }
            };

            const handleDownload = () => {
                if (jobs.length === 0) {
                    alert('No jobs to download');
                    return;
                }
                exportToCSV(jobs);
            };

            const handlePartChange = (index, field, value) => {
                const newParts = [...formData.parts];
                newParts[index][field] = value;
                
                if (field === 'partDescription' && value.trim() && index === newParts.length - 1) {
                    newParts.push({ partNumber: '', partDescription: '' });
                }
                
                setFormData({ ...formData, parts: newParts });
            };

            const handlePartKeyPress = (index, field, e) => {
                if (e.key === 'Enter' && field === 'partDescription') {
                    const newParts = [...formData.parts];
                    if (formData.parts[index].partNumber.trim() && formData.parts[index].partDescription.trim()) {
                        if (index === newParts.length - 1) {
                            newParts.push({ partNumber: '', partDescription: '' });
                            setFormData({ ...formData, parts: newParts });
                        }
                    }
                }
            };

            const formatDateTime = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                }) + ' ' + date.toLocaleTimeString('en-GB', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            };

            const formatDateOnly = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            };

            const groupJobsByMonth = () => {
                const grouped = {};
                jobs.forEach(job => {
                    const date = new Date(job.startDateTime);
                    const monthKey = date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                    if (!grouped[monthKey]) {
                        grouped[monthKey] = [];
                    }
                    grouped[monthKey].push(job);
                });
                return grouped;
            };

            const groupedJobs = groupJobsByMonth();
            const monthKeys = Object.keys(groupedJobs).sort((a, b) => {
                const dateA = new Date(groupedJobs[a][0].startDateTime);
                const dateB = new Date(groupedJobs[b][0].startDateTime);
                return dateB - dateA;
            });

            return React.createElement('div', { style: { width: '100%', height: '100%', display: 'flex', flexDirection: 'column' } },
                // Header
                React.createElement('div', { style: { padding: '1.5rem 1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0 } },
                    React.createElement('h1', { style: { fontSize: '2.5rem', fontWeight: '800', margin: 0, color: '#FFFFFF', letterSpacing: '-0.5px' } }, 'Logger'),
                    React.createElement('div', { style: { display: 'flex', gap: '0.75rem' } },
                        !showNewCard && React.createElement('button', {
                            onClick: handleDownload,
                            style: { 
                                background: 'rgba(255, 255, 255, 0.15)',
                                backdropFilter: 'blur(10px)',
                                WebkitBackdropFilter: 'blur(10px)',
                                border: '1px solid rgba(255, 255, 255, 0.2)',
                                color: 'white', 
                                padding: '0.75rem 1rem', 
                                borderRadius: '16px', 
                                fontWeight: '700', 
                                fontSize: '1rem',
                                cursor: 'pointer',
                                transition: 'all 0.3s ease'
                            },
                            onMouseOver: (e) => {
                                e.target.style.background = 'rgba(255, 255, 255, 0.25)';
                            },
                            onMouseOut: (e) => {
                                e.target.style.background = 'rgba(255, 255, 255, 0.15)';
                            },
                            title: 'Download CSV'
                        }, '📊 Export'),
                        !showNewCard && React.createElement('button', {
                            onClick: handleNewJob,
                            style: { 
                                background: 'linear-gradient(135deg, #00F5FF 0%, #0099FF 100%)',
                                color: '#000', 
                                padding: '0.75rem 1.25rem', 
                                borderRadius: '16px', 
                                fontWeight: '700', 
                                fontSize: '1rem',
                                border: 'none',
                                cursor: 'pointer',
                                boxShadow: '0 8px 24px rgba(0, 245, 255, 0.4)',
                                transition: 'all 0.3s ease'
                            },
                            onMouseOver: (e) => {
                                e.target.style.boxShadow = '0 12px 32px rgba(0, 245, 255, 0.6)';
                                e.target.style.transform = 'translateY(-2px)';
                            },
                            onMouseOut: (e) => {
                                e.target.style.boxShadow = '0 8px 24px rgba(0, 245, 255, 0.4)';
                                e.target.style.transform = 'translateY(0)';
                            }
                        }, '+ Add')
                    )
                ),

                // Content
                React.createElement('div', { style: { flex: 1, overflowY: 'auto', padding: '0 1rem 1rem' } },
                    showNewCard && React.createElement('div', { style: { paddingBottom: '2rem' } },
                        React.createElement('div', { 
                            className: 'glass',
                            style: { 
                                borderRadius: '28px', 
                                padding: '2rem', 
                                display: 'flex', 
                                flexDirection: 'column', 
                                gap: '1.5rem',
                                minHeight: '90vh',
                                justifyContent: 'space-between'
                            } 
                        },
                            React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '1.5rem' } },
                                React.createElement('div', null,
                                    React.createElement('label', { style: { display: 'block', fontSize: '0.85rem', fontWeight: '700', color: 'rgba(255, 255, 255, 0.9)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '0.75rem' } }, 'Ticket'),
                                    React.createElement('input', {
                                        type: 'text',
                                        value: formData.ticketNumber,
                                        onChange: (e) => setFormData({ ...formData, ticketNumber: e.target.value }),
                                        className: 'glass-input',
                                        style: { width: '100%', padding: '1rem', borderRadius: '14px', outline: 'none', color: '#FFFFFF', fontSize: '1rem' },
                                        placeholder: 'ABC123'
                                    })
                                ),
                                React.createElement('div', null,
                                    React.createElement('label', { style: { display: 'block', fontSize: '0.85rem', fontWeight: '700', color: 'rgba(255, 255, 255, 0.9)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '0.75rem' } }, 'Start'),
                                    React.createElement('input', {
                                        type: 'datetime-local',
                                        value: formData.startDateTime,
                                        onChange: (e) => setFormData({ ...formData, startDateTime: e.target.value }),
                                        className: 'glass-input',
                                        style: { width: '100%', padding: '1rem', borderRadius: '14px', outline: 'none', color: '#FFFFFF', fontSize: '1rem' }
                                    })
                                ),
                                React.createElement('div', null,
                                    React.createElement('label', { style: { display: 'block', fontSize: '0.85rem', fontWeight: '700', color: 'rgba(255, 255, 255, 0.9)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '0.75rem' } }, 'Finish'),
                                    React.createElement('input', {
                                        type: 'datetime-local',
                                        value: formData.finishDateTime,
                                        onChange: (e) => setFormData({ ...formData, finishDateTime: e.target.value }),
                                        className: 'glass-input',
                                        style: { width: '100%', padding: '1rem', borderRadius: '14px', outline: 'none', color: '#FFFFFF', fontSize: '1rem' }
                                    })
                                ),
                                React.createElement('div', null,
                                    React.createElement('label', { style: { display: 'block', fontSize: '0.85rem', fontWeight: '700', color: 'rgba(255, 255, 255, 0.9)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '0.75rem' } }, 'Work Done'),
                                    React.createElement('textarea', {
                                        value: formData.workDone,
                                        onChange: (e) => setFormData({ ...formData, workDone: e.target.value }),
                                        className: 'glass-input',
                                        style: { width: '100%', padding: '1rem', borderRadius: '14px', outline: 'none', minHeight: '10rem', resize: 'none', color: '#FFFFFF', fontSize: '1rem', fontFamily: 'inherit' },
                                        placeholder: 'Detailed notes...'
                                    })
                                ),
                                React.createElement('div', null,
                                    React.createElement('label', { style: { display: 'block', fontSize: '0.85rem', fontWeight: '700', color: 'rgba(255, 255, 255, 0.9)', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '0.75rem' } }, 'Parts Used'),
                                    React.createElement('div', { 
                                        className: 'glass-input',
                                        style: { borderRadius: '14px', overflow: 'hidden' } 
                                    },
                                        React.createElement('div', { style: { background: 'rgba(255, 255, 255, 0.05)', display: 'grid', gridTemplateColumns: '1fr 1fr', fontWeight: '600', fontSize: '0.8rem', color: 'rgba(255, 255, 255, 0.7)' } },
                                            React.createElement('div', { style: { padding: '0.75rem', borderRight: '1px solid rgba(255, 255, 255, 0.1)' } }, 'Part #'),
                                            React.createElement('div', { style: { padding: '0.75rem' } }, 'Description')
                                        ),
                                        formData.parts.map((part, index) =>
                                            React.createElement('div', { key: index, style: { display: 'grid', gridTemplateColumns: '1fr 1fr', borderTop: '1px solid rgba(255, 255, 255, 0.1)' } },
                                                React.createElement('input', {
                                                    type: 'text',
                                                    value: part.partNumber,
                                                    onChange: (e) => handlePartChange(index, 'partNumber', e.target.value),
                                                    style: { padding: '0.75rem', borderRight: '1px solid rgba(255, 255, 255, 0.1)', fontSize: '0.95rem', outline: 'none', background: 'transparent', color: '#FFFFFF' },
                                                    placeholder: 'AB123'
                                                }),
                                                React.createElement('input', {
                                                    type: 'text',
                                                    value: part.partDescription,
                                                    onChange: (e) => handlePartChange(index, 'partDescription', e.target.value),
                                                    onKeyPress: (e) => handlePartKeyPress(index, 'partDescription', e),
                                                    style: { padding: '0.75rem', fontSize: '0.95rem', outline: 'none', background: 'transparent', color: '#FFFFFF' },
                                                    placeholder: 'Seal'
                                                })
                                            )
                                        )
                                    )
                                )
                            ),

                            React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '1rem' } },
                                React.createElement('div', { 
                                    style: { 
                                        background: 'rgba(255, 255, 255, 0.05)',
                                        borderRadius: '16px', 
                                        padding: '1.25rem', 
                                        display: 'flex', 
                                        flexDirection: 'column', 
                                        gap: '1rem' 
                                    } 
                                },
                                    React.createElement('p', { style: { fontSize: '0.8rem', fontWeight: '700', color: 'rgba(255, 255, 255, 0.7)', textTransform: 'uppercase', letterSpacing: '1px', margin: '0' } }, 'Site'),
                                    React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' } },
                                        Object.entries(SITES).map(([key, site]) =>
                                            React.createElement('button', {
                                                key: key,
                                                onClick: () => setFormData({ ...formData, site: key }),
                                                style: {
                                                    backgroundColor: formData.site === key ? site.hex : 'rgba(255, 255, 255, 0.1)',
                                                    color: formData.site === key ? '#000' : '#FFFFFF',
                                                    padding: '0.875rem',
                                                    borderRadius: '12px',
                                                    fontWeight: '700',
                                                    border: formData.site === key ? 'none' : '1px solid rgba(255, 255, 255, 0.2)',
                                                    cursor: 'pointer',
                                                    transition: 'all 0.3s ease',
                                                    fontSize: '0.9rem'
                                                }
                                            }, site.label)
                                        )
                                    )
                                ),

                                React.createElement('div', { style: { display: 'flex', gap: '1rem' } },
                                    React.createElement('button', {
                                        onClick: handleSave,
                                        style: { 
                                            flex: 1, 
                                            background: 'linear-gradient(135deg, #00F5FF 0%, #0099FF 100%)',
                                            color: '#000',
                                            padding: '1rem', 
                                            borderRadius: '14px', 
                                            fontWeight: '700', 
                                            border: 'none',
                                            cursor: 'pointer',
                                            boxShadow: '0 8px 24px rgba(0, 245, 255, 0.4)',
                                            transition: 'all 0.3s ease',
                                            fontSize: '1rem'
                                        }
                                    }, 'Save'),
                                    React.createElement('button', {
                                        onClick: () => setShowNewCard(false),
                                        style: { 
                                            flex: 1, 
                                            background: 'rgba(255, 255, 255, 0.1)',
                                            backdropFilter: 'blur(10px)',
                                            WebkitBackdropFilter: 'blur(10px)',
                                            color: '#FFFFFF',
                                            padding: '1rem', 
                                            borderRadius: '14px', 
                                            fontWeight: '700', 
                                            border: '1px solid rgba(255, 255, 255, 0.2)',
                                            cursor: 'pointer',
                                            transition: 'all 0.3s ease',
                                            fontSize: '1rem'
                                        }
                                    }, 'Cancel')
                                )
                            )
                        )
                    ),

                    !showNewCard && React.createElement('div', {},
                        monthKeys.length === 0 ? 
                            React.createElement('div', { style: { textAlign: 'center', paddingTop: '6rem', paddingBottom: '4rem' } },
                                React.createElement('p', { style: { color: 'rgba(255, 255, 255, 0.6)', fontSize: '1.25rem', marginBottom: '2rem', fontWeight: '500' } }, 'No jobs yet'),
                                React.createElement('button', {
                                    onClick: handleNewJob,
                                    style: { 
                                        background: 'linear-gradient(135deg, #00F5FF 0%, #0099FF 100%)',
                                        color: '#000',
                                        padding: '1rem 2rem', 
                                        borderRadius: '16px', 
                                        fontWeight: '700', 
                                        border: 'none',
                                        cursor: 'pointer',
                                        boxShadow: '0 8px 24px rgba(0, 245, 255, 0.4)',
                                        fontSize: '1rem'
                                    }
                                }, 'Log Your First Job')
                            )
                        :
                            React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '1rem' } },
                                monthKeys.map(monthKey =>
                                    React.createElement('div', { key: monthKey },
                                        React.createElement('button', {
                                            onClick: () => setExpandedMonth(expandedMonth === monthKey ? null : monthKey),
                                            style: { 
                                                width: '100%', 
                                                display: 'flex', 
                                                justifyContent: 'space-between', 
                                                alignItems: 'center', 
                                                padding: '1rem',
                                                background: 'rgba(255, 255, 255, 0.08)',
                                                backdropFilter: 'blur(10px)',
                                                WebkitBackdropFilter: 'blur(10px)',
                                                borderRadius: '12px', 
                                                fontWeight: '700', 
                                                color: '#FFFFFF', 
                                                border: '1px solid rgba(255, 255, 255, 0.15)',
                                                cursor: 'pointer',
                                                fontSize: '1rem'
                                            }
                                        },
                                            monthKey,
                                            React.createElement('span', { style: { transform: expandedMonth === monthKey ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.3s', fontSize: '1.25rem' } }, '▼')
                                        ),
                                        expandedMonth === monthKey && React.createElement('div', { style: { marginTop: '0.75rem', display: 'flex', flexDirection: 'column', gap: '0.75rem' } },
                                            groupedJobs[monthKey].map(job =>
                                                React.createElement('div', {
                                                    key: job.id,
                                                    onClick: () => handleEditJob(job),
                                                    className: 'glass',
                                                    style: { 
                                                        padding: '1.25rem', 
                                                        borderRadius: '18px', 
                                                        cursor: 'pointer',
                                                        transition: 'all 0.3s ease'
                                                    }
                                                },
                                                    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '0.75rem' } },
                                                        React.createElement('div', { style: { flex: 1 } },
                                                            React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '0.5rem' } },
                                                                React.createElement('p', { style: { fontWeight: '800', color: '#00F5FF', fontSize: '1.25rem', margin: 0 } }, job.ticketNumber),
                                                                job.site && React.createElement('span', { style: { backgroundColor: SITES[job.site].hex, color: '#000', padding: '0.35rem 0.75rem', borderRadius: '8px', fontSize: '0.75rem', fontWeight: '700' } }, SITES[job.site].label)
                                                            ),
                                                            React.createElement('p', { style: { fontSize: '0.85rem', color: 'rgba(255, 255, 255, 0.6)', margin: 0 } }, formatDateTime(job.startDateTime) + ' → ' + formatDateTime(job.finishDateTime))
                                                        ),
                                                        React.createElement('button', {
                                                            onClick: (e) => {
                                                                e.stopPropagation();
                                                                if (window.confirm('Delete?')) {
                                                                    handleDelete(job.id);
                                                                }
                                                            },
                                                            style: { marginLeft: '0.75rem', padding: '0.5rem', color: '#FF006E', backgroundColor: 'transparent', border: 'none', cursor: 'pointer', fontSize: '1.25rem' }
                                                        }, '✕')
                                                    ),
                                                    job.workDone && React.createElement('p', { style: { fontSize: '0.95rem', color: 'rgba(255, 255, 255, 0.8)', marginBottom: '0.75rem', margin: 0, display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' } }, job.workDone),
                                                    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                                                        job.parts && job.parts.some(p => p.partNumber || p.partDescription) && React.createElement('p', { style: { fontSize: '0.8rem', color: 'rgba(255, 255, 255, 0.5)', margin: 0 } }, job.parts.filter(p => p.partNumber || p.partDescription).length + ' part' + (job.parts.filter(p => p.partNumber || p.partDescription).length !== 1 ? 's' : '')),
                                                        React.createElement('p', { style: { fontSize: '0.8rem', color: 'rgba(255, 255, 255, 0.4)', margin: 0, marginLeft: 'auto' } }, formatDateOnly(job.startDateTime))
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(JobLogger));
    </script>
