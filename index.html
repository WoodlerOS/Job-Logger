<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Logger</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SITES = {
            NX: { label: 'NX', color: 'bg-blue-500', textColor: 'text-blue-600' },
            WS: { label: 'WS', color: 'bg-green-500', textColor: 'text-green-600' },
            RH: { label: 'RH', color: 'bg-red-500', textColor: 'text-red-600' },
            MMUH: { label: 'MMUH', color: 'bg-purple-500', textColor: 'text-purple-600' }
        };

        function JobLogger() {
            const [jobs, setJobs] = useState([]);
            const [showNewCard, setShowNewCard] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                ticketNumber: '',
                startDateTime: '',
                finishDateTime: '',
                workDone: '',
                parts: [{ partNumber: '', partDescription: '' }],
                site: ''
            });
            const [expandedMonth, setExpandedMonth] = useState(null);
            const [showSiteSelector, setShowSiteSelector] = useState(false);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('jobsData');
                    if (saved) {
                        setJobs(JSON.parse(saved));
                    }
                } catch (error) {
                    console.log('No saved jobs');
                }
            }, []);

            const initializeForm = () => {
                const now = new Date();
                const isoDateTime = now.toISOString().slice(0, 16);
                setFormData({
                    ticketNumber: '',
                    startDateTime: isoDateTime,
                    finishDateTime: isoDateTime,
                    workDone: '',
                    parts: [{ partNumber: '', partDescription: '' }],
                    site: ''
                });
                setShowSiteSelector(false);
            };

            const handleNewJob = () => {
                initializeForm();
                setEditingId(null);
                setShowNewCard(true);
            };

            const handleEditJob = (job) => {
                setFormData({
                    ...job,
                    parts: job.parts || [{ partNumber: '', partDescription: '' }]
                });
                setEditingId(job.id);
                setShowNewCard(true);
                setShowSiteSelector(false);
            };

            const handleSave = () => {
                if (!formData.ticketNumber.trim()) {
                    alert('Please enter a ticket number');
                    return;
                }

                let updatedJobs;
                if (editingId) {
                    updatedJobs = jobs.map(job => 
                        job.id === editingId ? { ...formData, id: editingId } : job
                    );
                } else {
                    updatedJobs = [{ ...formData, id: Date.now() }, ...jobs];
                }

                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
                setShowNewCard(false);
                initializeForm();
            };

            const handleDelete = (id) => {
                const updatedJobs = jobs.filter(job => job.id !== id);
                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
            };

            const handlePartChange = (index, field, value) => {
                const newParts = [...formData.parts];
                newParts[index][field] = value;
                
                // Auto-add new row if current row is filled and it's the last row
                if (field === 'partDescription' && value.trim() && index === newParts.length - 1) {
                    newParts.push({ partNumber: '', partDescription: '' });
                }
                
                setFormData({ ...formData, parts: newParts });
            };

            const handlePartKeyPress = (index, field, e) => {
                if (e.key === 'Enter' && field === 'partDescription') {
                    const newParts = [...formData.parts];
                    if (formData.parts[index].partNumber.trim() && formData.parts[index].partDescription.trim()) {
                        if (index === newParts.length - 1) {
                            newParts.push({ partNumber: '', partDescription: '' });
                            setFormData({ ...formData, parts: newParts });
                        }
                    }
                }
            };

            const handleBackupData = () => {
                const backupData = {
                    exportDate: new Date().toISOString(),
                    jobs: jobs,
                    totalJobs: jobs.length
                };
                
                const dataStr = JSON.stringify(backupData, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `job-logger-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                alert(`Backup created! ${jobs.length} jobs saved.`);
            };

            const formatDate = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                });
            };

            const formatDateTime = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                }) + ' ' + date.toLocaleTimeString('en-GB', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            };

            const groupJobsByMonth = () => {
                const grouped = {};
                jobs.forEach(job => {
                    const date = new Date(job.startDateTime);
                    const monthKey = date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                    if (!grouped[monthKey]) {
                        grouped[monthKey] = [];
                    }
                    grouped[monthKey].push(job);
                });
                return grouped;
            };

            const groupedJobs = groupJobsByMonth();
            const monthKeys = Object.keys(groupedJobs).sort((a, b) => {
                const dateA = new Date(groupedJobs[a][0].startDateTime);
                const dateB = new Date(groupedJobs[b][0].startDateTime);
                return dateB - dateA;
            });

            return (
                <div className="min-h-screen bg-gradient-to-b from-slate-50 to-slate-100">
                    {/* Header */}
                    <div className="sticky top-0 bg-white border-b border-slate-200 px-4 py-4 shadow-sm z-10">
                        <div className="flex items-center justify-between">
                            <h1 className="text-2xl font-bold text-slate-900">Job Log</h1>
                            <div className="flex gap-2">
                                {!showNewCard && (
                                    <button
                                        onClick={handleBackupData}
                                        className="bg-green-600 text-white px-3 py-2 rounded-lg font-medium text-sm hover:bg-green-700"
                                        title="Backup all jobs to your Files"
                                    >
                                        💾 Sync
                                    </button>
                                )}
                                {!showNewCard && (
                                    <button
                                        onClick={handleNewJob}
                                        className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700"
                                    >
                                        + New Job
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* New Job Card */}
                    {showNewCard && (
                        <div className="mx-4 mt-6 p-6 bg-white rounded-xl shadow-lg border-2 border-blue-200 pb-20">
                            <div className="mb-5">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Ticket Number</label>
                                <input
                                    type="text"
                                    value={formData.ticketNumber}
                                    onChange={(e) => setFormData({ ...formData, ticketNumber: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="Enter ticket number"
                                />
                            </div>

                            <div className="mb-5">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Start Date & Time</label>
                                <input
                                    type="datetime-local"
                                    value={formData.startDateTime}
                                    onChange={(e) => setFormData({ ...formData, startDateTime: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                            </div>

                            <div className="mb-5">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Finish Date & Time</label>
                                <input
                                    type="datetime-local"
                                    value={formData.finishDateTime}
                                    onChange={(e) => setFormData({ ...formData, finishDateTime: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                            </div>

                            <div className="mb-5">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Work Done</label>
                                <textarea
                                    value={formData.workDone}
                                    onChange={(e) => setFormData({ ...formData, workDone: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none min-h-32 resize-none"
                                    placeholder="Detailed notes about work completed..."
                                />
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Parts Used</label>
                                <div className="border border-slate-300 rounded-lg overflow-hidden">
                                    <div className="bg-slate-100 grid grid-cols-2 font-semibold text-sm">
                                        <div className="p-3 border-r border-slate-300">Part Number</div>
                                        <div className="p-3">Part Description</div>
                                    </div>
                                    {formData.parts.map((part, index) => (
                                        <div key={index} className="grid grid-cols-2 border-t border-slate-300">
                                            <input
                                                type="text"
                                                value={part.partNumber}
                                                onChange={(e) => handlePartChange(index, 'partNumber', e.target.value)}
                                                className="p-3 border-r border-slate-300 text-sm outline-none focus:bg-blue-50"
                                                placeholder="e.g. AB123"
                                            />
                                            <input
                                                type="text"
                                                value={part.partDescription}
                                                onChange={(e) => handlePartChange(index, 'partDescription', e.target.value)}
                                                onKeyPress={(e) => handlePartKeyPress(index, 'partDescription', e)}
                                                className="p-3 text-sm outline-none focus:bg-blue-50"
                                                placeholder="e.g. Pump seal"
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex gap-3 mb-6">
                                <button
                                    onClick={handleSave}
                                    className="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700"
                                >
                                    Save Job
                                </button>
                                <button
                                    onClick={() => {
                                        setShowNewCard(false);
                                        setEditingId(null);
                                    }}
                                    className="flex-1 bg-slate-200 text-slate-700 py-3 rounded-lg font-semibold hover:bg-slate-300"
                                >
                                    Cancel
                                </button>
                            </div>

                            {/* Site Selector at bottom */}
                            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 z-50">
                                <div className="flex justify-around gap-2">
                                    {Object.entries(SITES).map(([key, site]) => (
                                        <button
                                            key={key}
                                            onClick={() => {
                                                setFormData({ ...formData, site: key });
                                                setShowSiteSelector(false);
                                            }}
                                            className={`flex-1 py-3 rounded-lg font-semibold transition ${
                                                formData.site === key
                                                    ? `${site.color} text-white`
                                                    : `bg-slate-200 text-slate-700 hover:bg-slate-300`
                                            }`}
                                        >
                                            {site.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Jobs List */}
                    {!showNewCard && (
                        <div className="pb-8">
                            {monthKeys.length === 0 ? (
                                <div className="text-center py-16 px-4">
                                    <p className="text-slate-500 text-lg mb-4">No jobs logged yet</p>
                                    <button
                                        onClick={handleNewJob}
                                        className="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700"
                                    >
                                        Log Your First Job
                                    </button>
                                </div>
                            ) : (
                                monthKeys.map(monthKey => (
                                    <div key={monthKey} className="mb-6">
                                        <button
                                            onClick={() => setExpandedMonth(expandedMonth === monthKey ? null : monthKey)}
                                            className="w-full mx-4 flex items-center justify-between px-4 py-3 bg-slate-200 rounded-lg font-semibold text-slate-700 hover:bg-slate-300"
                                        >
                                            <span>{monthKey}</span>
                                            <span>{expandedMonth === monthKey ? '▼' : '▶'}</span>
                                        </button>

                                        {expandedMonth === monthKey && (
                                            <div className="mt-3 mx-4 space-y-2">
                                                {groupedJobs[monthKey].map(job => (
                                                    <div
                                                        key={job.id}
                                                        onClick={() => handleEditJob(job)}
                                                        className="p-4 bg-white rounded-lg border border-slate-200 shadow-sm hover:shadow-md cursor-pointer"
                                                    >
                                                        <div className="flex justify-between items-start mb-2">
                                                            <div className="flex-1">
                                                                <div className="flex items-center gap-2 mb-1">
                                                                    <p className="font-semibold text-slate-900">
                                                                        {formatDate(job.startDateTime)}
                                                                    </p>
                                                                    {job.site && (
                                                                        <span className={`${SITES[job.site].color} text-white px-2 py-1 rounded text-xs font-bold`}>
                                                                            {SITES[job.site].label}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                <p className="text-sm font-semibold text-blue-600 mb-1">
                                                                    Ticket: {job.ticketNumber}
                                                                </p>
                                                                <p className="text-xs text-slate-500">
                                                                    {formatDateTime(job.startDateTime)} to {formatDateTime(job.finishDateTime)}
                                                                </p>
                                                            </div>
                                                            <button
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    if (window.confirm('Delete this job?')) {
                                                                        handleDelete(job.id);
                                                                    }
                                                                }}
                                                                className="ml-3 p-2 text-red-500 hover:bg-red-50 rounded-lg"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </div>
                                                        {job.workDone && (
                                                            <p className="text-sm text-slate-600 mb-2 line-clamp-2">{job.workDone}</p>
                                                        )}
                                                        {job.parts && job.parts.some(p => p.partNumber || p.partDescription) && (
                                                            <p className="text-xs text-slate-500">
                                                                Parts: {job.parts.filter(p => p.partNumber || p.partDescription).length}
                                                            </p>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<JobLogger />);
    </script>
</body>
</html>
