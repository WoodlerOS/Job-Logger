<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="true">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Job Logger</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/xlsx@latest/dist/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a14;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      max-width: 100vw;
      padding: max(0px, env(safe-area-inset-top)) max(0px, env(safe-area-inset-right)) max(0px, env(safe-area-inset-bottom)) max(0px, env(safe-area-inset-left));
    }

    html, body, #root {
      height: 100%;
      width: 100%;
    }

    /* Ultra Violet: #6A00F4 | Soft Apricot: #FFD6A5 */
    
    /* Site Colors - Violet Tonal Variations */
    .site-1 { background: #6A00F4; }
    .site-2 { background: #8B33E6; }
    .site-3 { background: #4D00C4; }
    .site-4 { background: #5500D9; }

    .gradient-site-1-2 { background: linear-gradient(90deg, #6A00F4, #8B33E6); }
    .gradient-site-2-3 { background: linear-gradient(90deg, #8B33E6, #4D00C4); }

    .app-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0a0a14;
      position: relative;
    }

    /* Header */
    .header {
      background: linear-gradient(180deg, #1a1a2e 0%, #0a0a14 100%);
      padding: 16px 20px;
      border-bottom: 1px solid rgba(106, 0, 244, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: rgba(106, 0, 244, 0.1);
      color: #FFD6A5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      background: rgba(106, 0, 244, 0.25);
      transform: scale(0.95);
    }

    /* Main Content Area */
    .content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /* Calendar Section */
    .calendar-hero {
      padding: 24px 16px 32px;
      background: linear-gradient(135deg, rgba(106, 0, 244, 0.15) 0%, rgba(75, 0, 196, 0.1) 100%);
    }

    .calendar-title {
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #FFD6A5;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .calendar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-nav {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(106, 0, 244, 0.3);
      background: rgba(106, 0, 244, 0.05);
      color: #FFD6A5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .nav-btn:active {
      background: rgba(106, 0, 244, 0.2);
      border-color: rgba(106, 0, 244, 0.5);
    }

    .month-label {
      font-size: 16px;
      font-weight: 600;
      min-width: 100px;
      text-align: center;
      background: rgba(255, 214, 165, 0.08);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 214, 165, 0.15);
    }

    .view-toggle {
      display: flex;
      gap: 6px;
    }

    .view-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(106, 0, 244, 0.2);
      background: rgba(106, 0, 244, 0.05);
      color: #999;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: #6A00F4;
      border-color: #6A00F4;
      color: #fff;
    }

    /* Month Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .weekday-header {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #FFD6A5;
      padding: 8px 0;
      letter-spacing: 0.5px;
    }

    .calendar-day {
      aspect-ratio: 1;
      border-radius: 10px;
      background: rgba(106, 0, 244, 0.08);
      border: 1.5px solid rgba(106, 0, 244, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .calendar-day.other-month {
      opacity: 0.3;
      background: transparent;
      border: none;
    }

    .calendar-day.has-tickets {
      background: rgba(106, 0, 244, 0.15);
      border-color: rgba(106, 0, 244, 0.3);
    }

    .calendar-day.today {
      border: 2px solid #FFD6A5;
      background: rgba(106, 0, 244, 0.25);
      box-shadow: 0 0 12px rgba(255, 214, 165, 0.3);
    }

    .calendar-day:active:not(.other-month) {
      background: rgba(106, 0, 244, 0.3);
      transform: scale(0.96);
    }

    .day-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #FFD6A5;
    }

    /* Tickets List */
    .tickets-section {
      padding: 0 16px 24px;
    }

    .section-header {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #FFD6A5;
      margin: 24px 0 12px;
      opacity: 0.85;
    }

    .tickets-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ticket-card {
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      touch-action: pan-y;
    }

    .ticket-card.locked {
      border-color: #FFD6A5;
      box-shadow: 0 0 16px rgba(255, 214, 165, 0.25);
    }

    .ticket-card:active {
      transform: scale(0.98);
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .ticket-number {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }

    .ticket-time {
      font-size: 11px;
      opacity: 0.8;
    }

    .ticket-summary {
      font-size: 12px;
      opacity: 0.9;
      line-height: 1.4;
    }

    /* Menu & Sheets */
    .menu-button {
      background: none;
      border: none;
      color: #FFD6A5;
      cursor: pointer;
      font-size: 20px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a2e;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(106, 0, 244, 0.2);
      max-height: 85vh;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(106, 0, 244, 0.3);
      border-radius: 2px;
      align-self: center;
      margin-top: 12px;
      cursor: grab;
    }

    .sheet-handle:active {
      cursor: grabbing;
      background: rgba(255, 214, 165, 0.4);
    }

    .sheet-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(106, 0, 244, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .sheet-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #FFD6A5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(106, 0, 244, 0.2);
      background: rgba(106, 0, 244, 0.05);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: #FFD6A5;
      background: rgba(106, 0, 244, 0.1);
      box-shadow: 0 0 0 3px rgba(106, 0, 244, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Buttons */
    .btn {
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6A00F4 0%, #8B33E6 100%);
      color: #fff;
    }

    .btn-primary:active {
      opacity: 0.9;
      transform: scale(0.98);
    }

    .btn-secondary {
      background: rgba(106, 0, 244, 0.1);
      color: #FFD6A5;
      border: 1px solid rgba(255, 214, 165, 0.3);
    }

    .btn-secondary:active {
      background: rgba(106, 0, 244, 0.2);
    }

    .btn-danger {
      background: rgba(200, 50, 50, 0.1);
      color: #ff6b6b;
      border: 1px solid rgba(200, 50, 50, 0.3);
    }

    .btn-danger:active {
      background: rgba(200, 50, 50, 0.2);
    }

    .sheet-actions {
      display: flex;
      gap: 8px;
      padding: 0 20px 20px;
      padding-bottom: max(20px, calc(20px + env(safe-area-inset-bottom)));
    }

    .sheet-actions .btn {
      flex: 1;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(106, 0, 244, 0.95);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 2000;
      border: 1px solid rgba(255, 214, 165, 0.2);
      animation: slideUp 0.3s ease-out;
    }

    /* Backdrop */
    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }

    /* Responsive */
    @media (max-height: 600px) {
      .calendar-hero {
        padding: 16px;
      }
      .tickets-section {
        padding: 0 16px 16px;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Color mapping for sites (tonal violet variations)
    const SITES = [
      { id: 1, name: 'Site 1', color: '#6A00F4' },
      { id: 2, name: 'Site 2', color: '#8B33E6' },
      { id: 3, name: 'Site 3', color: '#4D00C4' },
      { id: 4, name: 'Site 4', color: '#5500D9' },
    ];

    const SITE_COLORS = {
      1: 'site-1',
      2: 'site-2',
      3: 'site-3',
      4: 'site-4',
    };

    function JobLogger() {
      const [tickets, setTickets] = useState([]);
      const [currentView, setCurrentView] = useState('month'); // 'month', 'week', 'day'
      const [selectedDate, setSelectedDate] = useState(new Date());
      const [showAddSheet, setShowAddSheet] = useState(false);
      const [showMenu, setShowMenu] = useState(false);
      const [toast, setToast] = useState(null);
      const [newTicket, setNewTicket] = useState({
        number: '',
        startTime: '',
        finishTime: '',
        travelTime: '',
        notes: '',
        siteId: 1,
        locked: false,
      });

      useEffect(() => {
        loadData();
      }, []);

      const loadData = () => {
        const stored = localStorage.getItem('jobLoggerTickets');
        if (stored) {
          setTickets(JSON.parse(stored));
        }
      };

      const saveData = (newTickets) => {
        localStorage.setItem('jobLoggerTickets', JSON.stringify(newTickets));
      };

      const showToastMessage = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 2000);
      };

      const handleAddTicket = () => {
        if (!newTicket.number || !newTicket.startTime) {
          showToastMessage('Ticket number and start time required');
          return;
        }

        const ticket = {
          id: Date.now().toString(),
          date: new Date(selectedDate).toISOString().split('T')[0],
          ...newTicket,
        };

        const updated = [...tickets, ticket];
        setTickets(updated);
        saveData(updated);
        setShowAddSheet(false);
        setNewTicket({
          number: '',
          startTime: '',
          finishTime: '',
          travelTime: '',
          notes: '',
          siteId: 1,
          locked: false,
        });
        showToastMessage('Ticket added');
      };

      const handleDeleteTicket = (id) => {
        const updated = tickets.filter(t => t.id !== id);
        setTickets(updated);
        saveData(updated);
        showToastMessage('Ticket deleted');
      };

      const handleToggleLock = (id) => {
        const updated = tickets.map(t =>
          t.id === id ? { ...t, locked: !t.locked } : t
        );
        setTickets(updated);
        saveData(updated);
      };

      const handleExport = () => {
        const ws = XLSX.utils.json_to_sheet(tickets);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Tickets');
        XLSX.writeFile(wb, `tickets-${new Date().toISOString().split('T')[0]}.xlsx`);
        showToastMessage('Exported to Excel');
        setShowMenu(false);
      };

      const handleBackup = () => {
        const backup = {
          timestamp: new Date().toISOString(),
          tickets: tickets,
        };
        const dataStr = JSON.stringify(backup, null, 2);
        const link = document.createElement('a');
        link.href = `data:application/json,${encodeURIComponent(dataStr)}`;
        link.download = `backup-${new Date().toISOString().split('T')[0]}.json`;
        link.click();
        showToastMessage('Backup created');
        setShowMenu(false);
      };

      const handleClear = () => {
        if (confirm('Clear all tickets? This cannot be undone.')) {
          setTickets([]);
          localStorage.removeItem('jobLoggerTickets');
          showToastMessage('All tickets cleared');
          setShowMenu(false);
        }
      };

      const daysInMonth = (date) => {
        return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      };

      const firstDayOfMonth = (date) => {
        return new Date(date.getFullYear(), date.getMonth(), 1).getDay();
      };

      const monthDays = () => {
        const days = [];
        const firstDay = firstDayOfMonth(selectedDate);
        const daysCount = daysInMonth(selectedDate);
        const prevMonthDays = daysInMonth(new Date(selectedDate.getFullYear(), selectedDate.getMonth() - 1));

        // Previous month days
        for (let i = firstDay - 1; i >= 0; i--) {
          days.push({
            day: prevMonthDays - i,
            isOtherMonth: true,
            date: new Date(selectedDate.getFullYear(), selectedDate.getMonth() - 1, prevMonthDays - i),
          });
        }

        // Current month days
        for (let i = 1; i <= daysCount; i++) {
          days.push({
            day: i,
            isOtherMonth: false,
            date: new Date(selectedDate.getFullYear(), selectedDate.getMonth(), i),
          });
        }

        // Next month days
        const remaining = 42 - days.length;
        for (let i = 1; i <= remaining; i++) {
          days.push({
            day: i,
            isOtherMonth: true,
            date: new Date(selectedDate.getFullYear(), selectedDate.getMonth() + 1, i),
          });
        }

        return days;
      };

      const dayTickets = (date) => {
        const dateStr = new Date(date).toISOString().split('T')[0];
        return tickets.filter(t => t.date === dateStr);
      };

      const isToday = (date) => {
        const today = new Date();
        return date.getDate() === today.getDate() &&
               date.getMonth() === today.getMonth() &&
               date.getFullYear() === today.getFullYear();
      };

      const monthDisplay = selectedDate.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
      const days = monthDays();

      return (
        <div className="app-container">
          {/* Header */}
          <div className="header">
            <h1>Job Logger</h1>
            <div className="header-buttons">
              <button className="icon-btn" onClick={() => setShowAddSheet(true)}>+</button>
              <button className="icon-btn menu-button" onClick={() => setShowMenu(!showMenu)}>⋮</button>
            </div>
          </div>

          {/* Content */}
          <div className="content">
            {/* Calendar Hero */}
            <div className="calendar-hero">
              <div className="calendar-title">Calendar</div>

              <div className="calendar-controls">
                <div className="month-nav">
                  <button 
                    className="nav-btn"
                    onClick={() => setSelectedDate(new Date(selectedDate.getFullYear(), selectedDate.getMonth() - 1))}
                  >
                    ←
                  </button>
                </div>
                <div className="month-label">{monthDisplay}</div>
                <div className="month-nav">
                  <button 
                    className="nav-btn"
                    onClick={() => setSelectedDate(new Date(selectedDate.getFullYear(), selectedDate.getMonth() + 1))}
                  >
                    →
                  </button>
                </div>
              </div>

              <div className="view-toggle">
                <button 
                  className={`view-btn ${currentView === 'month' ? 'active' : ''}`}
                  onClick={() => setCurrentView('month')}
                >
                  Month
                </button>
                <button 
                  className={`view-btn ${currentView === 'week' ? 'active' : ''}`}
                  onClick={() => setCurrentView('week')}
                >
                  Week
                </button>
                <button 
                  className={`view-btn ${currentView === 'day' ? 'active' : ''}`}
                  onClick={() => setCurrentView('day')}
                >
                  Day
                </button>
              </div>

              {/* Month Grid */}
              <div style={{ marginTop: '16px' }}>
                <div className="calendar-grid">
                  {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                    <div key={day} className="weekday-header">{day}</div>
                  ))}
                  {days.map((day, idx) => {
                    const dayTicketList = dayTickets(day.date);
                    const hasTickets = dayTicketList.length > 0;
                    const today = isToday(day.date);

                    return (
                      <div
                        key={idx}
                        className={`calendar-day ${day.isOtherMonth ? 'other-month' : ''} ${hasTickets ? 'has-tickets' : ''} ${today ? 'today' : ''}`}
                        onClick={() => !day.isOtherMonth && setSelectedDate(day.date)}
                      >
                        {day.day}
                        {hasTickets && <div className="day-badge"></div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Tickets for selected day */}
            <div className="tickets-section">
              <div className="section-header">
                {selectedDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })}
              </div>

              <div className="tickets-list">
                {dayTickets(selectedDate).map(ticket => {
                  const site = SITES.find(s => s.id === ticket.siteId);
                  return (
                    <div
                      key={ticket.id}
                      className={`ticket-card ${SITE_COLORS[ticket.siteId]} ${ticket.locked ? 'locked' : ''}`}
                      onClick={() => {/* Would open edit sheet */}}
                    >
                      <div className="ticket-header">
                        <div className="ticket-number"># {ticket.number}</div>
                        <div className="ticket-time">{ticket.startTime}</div>
                      </div>
                      <div className="ticket-summary">{site.name}</div>
                      {ticket.notes && <div className="ticket-summary" style={{ marginTop: '4px', fontSize: '11px', opacity: 0.7 }}>{ticket.notes.substring(0, 50)}</div>}
                    </div>
                  );
                })}
                {dayTickets(selectedDate).length === 0 && (
                  <div style={{ textAlign: 'center', color: '#666', padding: '20px', fontSize: '13px' }}>
                    No tickets for this day
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Menu Sheet */}
          {showMenu && (
            <>
              <div className="backdrop" onClick={() => setShowMenu(false)}></div>
              <div className="bottom-sheet" style={{ height: 'auto', maxHeight: 'auto' }}>
                <div className="sheet-handle"></div>
                <div style={{ padding: '16px 20px' }}>
                  <button 
                    className="btn btn-secondary"
                    onClick={handleBackup}
                    style={{ width: '100%', marginBottom: '8px' }}
                  >
                    Create Backup
                  </button>
                  <button 
                    className="btn btn-secondary"
                    onClick={handleExport}
                    style={{ width: '100%', marginBottom: '8px' }}
                  >
                    Export to Excel
                  </button>
                  <button 
                    className="btn btn-danger"
                    onClick={handleClear}
                    style={{ width: '100%' }}
                  >
                    Clear All
                  </button>
                </div>
                <div style={{ paddingBottom: 'max(16px, env(safe-area-inset-bottom))' }}></div>
              </div>
            </>
          )}

          {/* Add Ticket Sheet */}
          {showAddSheet && (
            <>
              <div className="backdrop" onClick={() => setShowAddSheet(false)}></div>
              <div className="bottom-sheet">
                <div className="sheet-handle"></div>
                <div className="sheet-header">
                  <h2>New Ticket</h2>
                  <button 
                    className="icon-btn"
                    onClick={() => setShowAddSheet(false)}
                    style={{ background: 'transparent', marginRight: '-8px' }}
                  >
                    ✕
                  </button>
                </div>
                <div className="sheet-content">
                  <div className="form-group">
                    <label className="form-label">Ticket Number</label>
                    <input
                      type="text"
                      className="form-input"
                      value={newTicket.number}
                      onChange={(e) => setNewTicket({ ...newTicket, number: e.target.value })}
                      placeholder="e.g., 12345"
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Site</label>
                    <select
                      className="form-select"
                      value={newTicket.siteId}
                      onChange={(e) => setNewTicket({ ...newTicket, siteId: parseInt(e.target.value) })}
                    >
                      {SITES.map(site => (
                        <option key={site.id} value={site.id}>{site.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Start Time</label>
                    <input
                      type="time"
                      className="form-input"
                      value={newTicket.startTime}
                      onChange={(e) => setNewTicket({ ...newTicket, startTime: e.target.value })}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Finish Time</label>
                    <input
                      type="time"
                      className="form-input"
                      value={newTicket.finishTime}
                      onChange={(e) => setNewTicket({ ...newTicket, finishTime: e.target.value })}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Travel Time (optional)</label>
                    <input
                      type="time"
                      className="form-input"
                      value={newTicket.travelTime}
                      onChange={(e) => setNewTicket({ ...newTicket, travelTime: e.target.value })}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Notes</label>
                    <textarea
                      className="form-textarea"
                      value={newTicket.notes}
                      onChange={(e) => setNewTicket({ ...newTicket, notes: e.target.value })}
                      placeholder="Work done, parts used, etc."
                    ></textarea>
                  </div>
                </div>

                <div className="sheet-actions">
                  <button className="btn btn-secondary" onClick={() => setShowAddSheet(false)}>Cancel</button>
                  <button className="btn btn-primary" onClick={handleAddTicket}>Add Ticket</button>
                </div>
              </div>
            </>
          )}

          {/* Toast */}
          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    ReactDOM.render(<JobLogger />, document.getElementById('root'));
  </script>
</body>
</html>
