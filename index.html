<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Job Logger</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }
        body {
            margin: 0;
            padding: 0;
            background: #F2F2F7;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #root {
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SITES = {
            NX: { label: 'NX', hex: '#FFBE0B' },
            WS: { label: 'WS', hex: '#FF006E' },
            RH: { label: 'RH', hex: '#06D6A0' },
            MMUH: { label: 'MMUH', hex: '#F97316' }
        };

        function JobLogger() {
            const [jobs, setJobs] = useState([]);
            const [showNewCard, setShowNewCard] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                ticketNumber: '',
                startDateTime: '',
                finishDateTime: '',
                workDone: '',
                parts: [{ partNumber: '', partDescription: '' }],
                site: ''
            });
            const [expandedMonth, setExpandedMonth] = useState(null);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('jobsData');
                    if (saved) setJobs(JSON.parse(saved));
                } catch (e) {}
            }, []);

            const exportToCSV = (jobsToExport) => {
                let csv = 'Ticket Number,Date,Site,Start Time,Finish Time,Work Done,Parts Used\n';
                
                jobsToExport.forEach(job => {
                    const startDate = new Date(job.startDateTime);
                    const finishDate = new Date(job.finishDateTime);
                    const partsText = job.parts?.filter(p => p.partNumber || p.partDescription)
                        .map(p => `${p.partNumber} - ${p.partDescription}`).join('; ') || '';
                    const dateStr = startDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const startTimeStr = startDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    const finishTimeStr = finishDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    const siteLabel = SITES[job.site]?.label || '';

                    csv += `${job.ticketNumber},${dateStr},${siteLabel},${startTimeStr},${finishTimeStr},"${job.workDone.replace(/"/g, '""')}","${partsText.replace(/"/g, '""')}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Job-Logger-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const handleNewJob = () => {
                const now = new Date();
                const isoDateTime = now.toISOString().slice(0, 16);
                setFormData({
                    ticketNumber: '',
                    startDateTime: isoDateTime,
                    finishDateTime: isoDateTime,
                    workDone: '',
                    parts: [{ partNumber: '', partDescription: '' }],
                    site: ''
                });
                setEditingId(null);
                setShowNewCard(true);
            };

            const handleEditJob = (job) => {
                setFormData({ ...job, parts: job.parts || [{ partNumber: '', partDescription: '' }] });
                setEditingId(job.id);
                setShowNewCard(true);
            };

            const handleSave = () => {
                if (!formData.ticketNumber.trim()) {
                    alert('Please enter a ticket number');
                    return;
                }

                let updatedJobs;
                if (editingId) {
                    updatedJobs = jobs.map(job => job.id === editingId ? { ...formData, id: editingId } : job);
                } else {
                    updatedJobs = [{ ...formData, id: Date.now() }, ...jobs];
                }

                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
                exportToCSV(updatedJobs);
                setShowNewCard(false);
            };

            const handleDelete = (id) => {
                const updatedJobs = jobs.filter(job => job.id !== id);
                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
                if (updatedJobs.length > 0) exportToCSV(updatedJobs);
            };

            const handlePartChange = (index, field, value) => {
                const newParts = [...formData.parts];
                newParts[index][field] = value;
                if (field === 'partDescription' && value.trim() && index === newParts.length - 1) {
                    newParts.push({ partNumber: '', partDescription: '' });
                }
                setFormData({ ...formData, parts: newParts });
            };

            const formatDateTime = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { weekday: 'short', year: '2-digit', month: '2-digit', day: '2-digit' }) + ' ' + date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            };

            const formatDateOnly = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
            };

            const groupJobsByMonth = () => {
                const grouped = {};
                jobs.forEach(job => {
                    const date = new Date(job.startDateTime);
                    const monthKey = date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                    if (!grouped[monthKey]) grouped[monthKey] = [];
                    grouped[monthKey].push(job);
                });
                return grouped;
            };

            const groupedJobs = groupJobsByMonth();
            const monthKeys = Object.keys(groupedJobs).sort((a, b) => new Date(groupedJobs[b][0].startDateTime) - new Date(groupedJobs[a][0].startDateTime));

            return React.createElement('div', { style: { paddingBottom: '2rem' } },
                React.createElement('div', { style: { background: '#FFFFFF', padding: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottomWidth: 1, borderBottomColor: '#E5E5EA', borderBottomStyle: 'solid' } },
                    React.createElement('h1', { style: { fontSize: '1.875rem', fontWeight: '700', margin: 0, color: '#000' } }, 'Logger'),
                    React.createElement('div', { style: { display: 'flex', gap: '0.5rem' } },
                        !showNewCard && React.createElement('button', {
                            onClick: () => jobs.length > 0 && exportToCSV(jobs),
                            style: { padding: '0.6rem 0.9rem', background: '#E8E8ED', color: '#000', border: 'none', borderRadius: '8px', fontWeight: '600', fontSize: '0.875rem', cursor: 'pointer' }
                        }, '📊'),
                        !showNewCard && React.createElement('button', {
                            onClick: handleNewJob,
                            style: { padding: '0.6rem 1rem', background: '#007AFF', color: '#FFF', border: 'none', borderRadius: '8px', fontWeight: '600', fontSize: '0.875rem', cursor: 'pointer' }
                        }, '+ Add')
                    )
                ),

                showNewCard && React.createElement('div', { style: { padding: '1rem' } },
                    React.createElement('div', { style: { background: '#FFFFFF', borderRadius: '12px', padding: '1.5rem', display: 'flex', flexDirection: 'column', gap: '1rem' } },
                        React.createElement('div', null,
                            React.createElement('label', { style: { display: 'block', fontSize: '0.75rem', fontWeight: '600', color: '#666', marginBottom: '0.5rem', textTransform: 'uppercase' } }, 'Ticket Number'),
                            React.createElement('input', { type: 'text', value: formData.ticketNumber, onChange: (e) => setFormData({ ...formData, ticketNumber: e.target.value }), style: { width: '100%', boxSizing: 'border-box', padding: '0.75rem', border: '1px solid #E5E5EA', borderRadius: '8px', outline: 'none', fontSize: '1rem' } })
                        ),
                        React.createElement('div', null,
                            React.createElement('label', { style: { display: 'block', fontSize: '0.75rem', fontWeight: '600', color: '#666', marginBottom: '0.5rem', textTransform: 'uppercase' } }, 'Start'),
                            React.createElement('input', { type: 'datetime-local', value: formData.startDateTime, onChange: (e) => setFormData({ ...formData, startDateTime: e.target.value }), style: { width: '100%', boxSizing: 'border-box', padding: '0.75rem', border: '1px solid #E5E5EA', borderRadius: '8px', outline: 'none', fontSize: '1rem' } })
                        ),
                        React.createElement('div', null,
                            React.createElement('label', { style: { display: 'block', fontSize: '0.75rem', fontWeight: '600', color: '#666', marginBottom: '0.5rem', textTransform: 'uppercase' } }, 'Finish'),
                            React.createElement('input', { type: 'datetime-local', value: formData.finishDateTime, onChange: (e) => setFormData({ ...formData, finishDateTime: e.target.value }), style: { width: '100%', boxSizing: 'border-box', padding: '0.75rem', border: '1px solid #E5E5EA', borderRadius: '8px', outline: 'none', fontSize: '1rem' } })
                        ),
                        React.createElement('div', null,
                            React.createElement('label', { style: { display: 'block', fontSize: '0.75rem', fontWeight: '600', color: '#666', marginBottom: '0.5rem', textTransform: 'uppercase' } }, 'Work Done'),
                            React.createElement('textarea', { value: formData.workDone, onChange: (e) => setFormData({ ...formData, workDone: e.target.value }), style: { width: '100%', boxSizing: 'border-box', padding: '0.75rem', border: '1px solid #E5E5EA', borderRadius: '8px', outline: 'none', minHeight: '8rem', resize: 'none', fontSize: '1rem' } })
                        ),
                        React.createElement('div', null,
                            React.createElement('label', { style: { display: 'block', fontSize: '0.75rem', fontWeight: '600', color: '#666', marginBottom: '0.5rem', textTransform: 'uppercase' } }, 'Parts Used'),
                            React.createElement('div', { style: { border: '1px solid #E5E5EA', borderRadius: '8px', overflow: 'hidden' } },
                                React.createElement('div', { style: { background: '#F2F2F7', display: 'grid', gridTemplateColumns: '1fr 1fr', padding: '0.75rem', fontWeight: '600', fontSize: '0.75rem', borderBottomWidth: 1, borderBottomColor: '#E5E5EA', borderBottomStyle: 'solid' } },
                                    React.createElement('div', null, 'Part #'),
                                    React.createElement('div', null, 'Description')
                                ),
                                formData.parts.map((part, index) => React.createElement('div', { key: index, style: { display: 'grid', gridTemplateColumns: '1fr 1fr', borderTopWidth: 1, borderTopColor: '#E5E5EA', borderTopStyle: 'solid' } },
                                    React.createElement('input', { type: 'text', value: part.partNumber, onChange: (e) => handlePartChange(index, 'partNumber', e.target.value), style: { padding: '0.75rem', border: 'none', outline: 'none', fontSize: '1rem', borderRightWidth: 1, borderRightColor: '#E5E5EA', borderRightStyle: 'solid' } }),
                                    React.createElement('input', { type: 'text', value: part.partDescription, onChange: (e) => handlePartChange(index, 'partDescription', e.target.value), style: { padding: '0.75rem', border: 'none', outline: 'none', fontSize: '1rem' } })
                                ))
                            )
                        ),
                        React.createElement('div', null,
                            React.createElement('label', { style: { display: 'block', fontSize: '0.75rem', fontWeight: '600', color: '#666', marginBottom: '0.75rem', textTransform: 'uppercase' } }, 'Site'),
                            React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem' } },
                                Object.entries(SITES).map(([key, site]) => React.createElement('button', { key, onClick: () => setFormData({ ...formData, site: key }), style: { backgroundColor: formData.site === key ? site.hex : '#E8E8ED', color: formData.site === key ? '#FFF' : '#000', padding: '0.75rem', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: 'pointer' } }, site.label))
                            )
                        ),
                        React.createElement('div', { style: { display: 'flex', gap: '0.75rem' } },
                            React.createElement('button', { onClick: handleSave, style: { flex: 1, padding: '0.9rem', background: '#007AFF', color: '#FFF', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: 'pointer', fontSize: '1rem' } }, 'Save'),
                            React.createElement('button', { onClick: () => setShowNewCard(false), style: { flex: 1, padding: '0.9rem', background: '#E8E8ED', color: '#000', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: 'pointer', fontSize: '1rem' } }, 'Cancel')
                        )
                    )
                ),

                !showNewCard && React.createElement('div', { style: { padding: '1rem' } },
                    monthKeys.length === 0 ? React.createElement('div', { style: { textAlign: 'center', paddingTop: '4rem' } },
                        React.createElement('p', { style: { color: '#999', marginBottom: '1.5rem' } }, 'No jobs yet'),
                        React.createElement('button', { onClick: handleNewJob, style: { background: '#007AFF', color: '#FFF', padding: '0.75rem 1.5rem', border: 'none', borderRadius: '8px', fontWeight: '600', cursor: 'pointer' } }, 'Log First Job')
                    ) : React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '1rem' } },
                        monthKeys.map(monthKey => React.createElement('div', { key: monthKey },
                            React.createElement('button', { onClick: () => setExpandedMonth(expandedMonth === monthKey ? null : monthKey), style: { width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.75rem', background: '#FFFFFF', border: '1px solid #E5E5EA', borderRadius: '8px', fontWeight: '600', cursor: 'pointer' } },
                                monthKey,
                                React.createElement('span', { style: { transform: expandedMonth === monthKey ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.3s' } }, '▼')
                            ),
                            expandedMonth === monthKey && React.createElement('div', { style: { marginTop: '0.5rem', display: 'flex', flexDirection: 'column', gap: '0.5rem' } },
                                groupedJobs[monthKey].map(job => React.createElement('div', { key: job.id, onClick: () => handleEditJob(job), style: { padding: '1rem', background: '#FFFFFF', border: '1px solid #E5E5EA', borderRadius: '8px', cursor: 'pointer' } },
                                    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '0.5rem' } },
                                        React.createElement('div', null,
                                            React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.25rem' } },
                                                React.createElement('p', { style: { fontWeight: '700', fontSize: '1.1rem', margin: 0 } }, job.ticketNumber),
                                                job.site && React.createElement('span', { style: { backgroundColor: SITES[job.site].hex, color: '#FFF', padding: '0.25rem 0.5rem', borderRadius: '6px', fontSize: '0.7rem', fontWeight: '600' } }, SITES[job.site].label)
                                            ),
                                            React.createElement('p', { style: { fontSize: '0.85rem', color: '#999', margin: 0 } }, formatDateTime(job.startDateTime))
                                        ),
                                        React.createElement('button', { onClick: (e) => { e.stopPropagation(); if (window.confirm('Delete?')) handleDelete(job.id); }, style: { background: 'none', border: 'none', color: '#FF3B30', cursor: 'pointer', fontSize: '1.2rem' } }, '✕')
                                    ),
                                    job.workDone && React.createElement('p', { style: { fontSize: '0.9rem', color: '#333', margin: '0.5rem 0 0 0', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' } }, job.workDone),
                                    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: '0.5rem', fontSize: '0.75rem', color: '#999' } },
                                        job.parts && job.parts.some(p => p.partNumber || p.partDescription) && React.createElement('span', null, job.parts.filter(p => p.partNumber || p.partDescription).length + ' parts'),
                                        React.createElement('span', null, formatDateOnly(job.startDateTime))
                                    )
                                ))
                            )
                        ))
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(JobLogger));
    </script>
</body>
</html>
