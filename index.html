<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Job Logger</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }
        body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100vh;
        }
        #root {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SITES = {
            NX: { label: 'NX', hex: '#FFBE0B', rgb: 'rgb(255, 190, 11)' },
            WS: { label: 'WS', hex: '#FF006E', rgb: 'rgb(255, 0, 110)' },
            RH: { label: 'RH', hex: '#06D6A0', rgb: 'rgb(6, 214, 160)' },
            MMUH: { label: 'MMUH', hex: '#F97316', rgb: 'rgb(249, 115, 22)' }
        };

        function JobLogger() {
            const [jobs, setJobs] = useState([]);
            const [showNewCard, setShowNewCard] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                ticketNumber: '',
                startDateTime: '',
                finishDateTime: '',
                workDone: '',
                parts: [{ partNumber: '', partDescription: '' }],
                site: ''
            });
            const [expandedMonth, setExpandedMonth] = useState(null);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('jobsData');
                    if (saved) {
                        setJobs(JSON.parse(saved));
                    }
                } catch (error) {
                    console.log('No saved jobs');
                }
            }, []);

            const initializeForm = () => {
                const now = new Date();
                const isoDateTime = now.toISOString().slice(0, 16);
                setFormData({
                    ticketNumber: '',
                    startDateTime: isoDateTime,
                    finishDateTime: isoDateTime,
                    workDone: '',
                    parts: [{ partNumber: '', partDescription: '' }],
                    site: ''
                });
            };

            const handleNewJob = () => {
                initializeForm();
                setEditingId(null);
                setShowNewCard(true);
            };

            const handleEditJob = (job) => {
                setFormData({
                    ...job,
                    parts: job.parts || [{ partNumber: '', partDescription: '' }]
                });
                setEditingId(job.id);
                setShowNewCard(true);
            };

            const handleSave = () => {
                if (!formData.ticketNumber.trim()) {
                    alert('Please enter a ticket number');
                    return;
                }

                let updatedJobs;
                if (editingId) {
                    updatedJobs = jobs.map(job => 
                        job.id === editingId ? { ...formData, id: editingId } : job
                    );
                } else {
                    updatedJobs = [{ ...formData, id: Date.now() }, ...jobs];
                }

                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
                setShowNewCard(false);
                initializeForm();
            };

            const handleDelete = (id) => {
                const updatedJobs = jobs.filter(job => job.id !== id);
                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
            };

            const handlePartChange = (index, field, value) => {
                const newParts = [...formData.parts];
                newParts[index][field] = value;
                
                if (field === 'partDescription' && value.trim() && index === newParts.length - 1) {
                    newParts.push({ partNumber: '', partDescription: '' });
                }
                
                setFormData({ ...formData, parts: newParts });
            };

            const handlePartKeyPress = (index, field, e) => {
                if (e.key === 'Enter' && field === 'partDescription') {
                    const newParts = [...formData.parts];
                    if (formData.parts[index].partNumber.trim() && formData.parts[index].partDescription.trim()) {
                        if (index === newParts.length - 1) {
                            newParts.push({ partNumber: '', partDescription: '' });
                            setFormData({ ...formData, parts: newParts });
                        }
                    }
                }
            };

            const handleBackupData = () => {
                const backupData = {
                    exportDate: new Date().toISOString(),
                    jobs: jobs,
                    totalJobs: jobs.length
                };
                
                const dataStr = JSON.stringify(backupData, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `job-logger-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                alert(`Backup created! ${jobs.length} jobs saved.`);
            };

            const formatDate = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                });
            };

            const formatDateOnly = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            };

            const formatDateTime = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                }) + ' ' + date.toLocaleTimeString('en-GB', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            };

            const groupJobsByMonth = () => {
                const grouped = {};
                jobs.forEach(job => {
                    const date = new Date(job.startDateTime);
                    const monthKey = date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                    if (!grouped[monthKey]) {
                        grouped[monthKey] = [];
                    }
                    grouped[monthKey].push(job);
                });
                return grouped;
            };

            const groupedJobs = groupJobsByMonth();
            const monthKeys = Object.keys(groupedJobs).sort((a, b) => {
                const dateA = new Date(groupedJobs[a][0].startDateTime);
                const dateB = new Date(groupedJobs[b][0].startDateTime);
                return dateB - dateA;
            });

            const getCardBackground = (siteKey) => {
                if (!siteKey || !SITES[siteKey]) return '#FFFFFF';
                const site = SITES[siteKey];
                // Return softer version with very light opacity
                return `rgba(${site.rgb.match(/\d+/g).join(',')}, 0.08)`;
            };

            return (
                <div className="w-full h-full bg-gradient-to-br from-slate-50 via-white to-slate-100 flex flex-col">
                    {/* Header */}
                    <div className="bg-white border-b border-slate-100 px-4 py-5 shadow-sm flex-shrink-0">
                        <div className="flex items-center justify-between gap-3">
                            <h1 className="text-3xl font-bold text-slate-900">Logger</h1>
                            <div className="flex gap-2">
                                {!showNewCard && (
                                    <button
                                        onClick={handleBackupData}
                                        className="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-4 py-2.5 rounded-full font-semibold text-sm hover:from-emerald-600 hover:to-teal-600 shadow-md active:shadow-lg transition-all"
                                        title="Backup all jobs"
                                    >
                                        💾
                                    </button>
                                )}
                                {!showNewCard && (
                                    <button
                                        onClick={handleNewJob}
                                        className="bg-gradient-to-r from-blue-500 to-blue-600 text-white px-5 py-2.5 rounded-full font-semibold text-sm hover:from-blue-600 hover:to-blue-700 shadow-md active:shadow-lg transition-all"
                                    >
                                        + Add
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Content Area */}
                    <div className="flex-1 overflow-y-auto">
                        {/* New Job Card */}
                        {showNewCard && (
                            <div className="p-4 pb-32">
                                <div className="bg-white rounded-3xl shadow-lg p-6 space-y-5">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2.5">Ticket Number</label>
                                        <input
                                            type="text"
                                            value={formData.ticketNumber}
                                            onChange={(e) => setFormData({ ...formData, ticketNumber: e.target.value })}
                                            className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-slate-900"
                                            placeholder="Enter ticket number"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2.5">Start Date & Time</label>
                                        <input
                                            type="datetime-local"
                                            value={formData.startDateTime}
                                            onChange={(e) => setFormData({ ...formData, startDateTime: e.target.value })}
                                            className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-slate-900"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2.5">Finish Date & Time</label>
                                        <input
                                            type="datetime-local"
                                            value={formData.finishDateTime}
                                            onChange={(e) => setFormData({ ...formData, finishDateTime: e.target.value })}
                                            className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-slate-900"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2.5">Work Done</label>
                                        <textarea
                                            value={formData.workDone}
                                            onChange={(e) => setFormData({ ...formData, workDone: e.target.value })}
                                            className="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none min-h-32 resize-none text-slate-900"
                                            placeholder="Detailed notes about work completed..."
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2.5">Parts Used</label>
                                        <div className="border border-slate-200 rounded-2xl overflow-hidden">
                                            <div className="bg-slate-50 grid grid-cols-2 font-semibold text-xs text-slate-600">
                                                <div className="p-3 border-r border-slate-200">Part Number</div>
                                                <div className="p-3">Part Description</div>
                                            </div>
                                            {formData.parts.map((part, index) => (
                                                <div key={index} className="grid grid-cols-2 border-t border-slate-200">
                                                    <input
                                                        type="text"
                                                        value={part.partNumber}
                                                        onChange={(e) => handlePartChange(index, 'partNumber', e.target.value)}
                                                        className="p-3 border-r border-slate-200 text-sm outline-none focus:bg-blue-50 text-slate-900"
                                                        placeholder="e.g. AB123"
                                                    />
                                                    <input
                                                        type="text"
                                                        value={part.partDescription}
                                                        onChange={(e) => handlePartChange(index, 'partDescription', e.target.value)}
                                                        onKeyPress={(e) => handlePartKeyPress(index, 'partDescription', e)}
                                                        className="p-3 text-sm outline-none focus:bg-blue-50 text-slate-900"
                                                        placeholder="e.g. Pump seal"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex gap-3 pt-4">
                                        <button
                                            onClick={handleSave}
                                            className="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3 rounded-full font-semibold hover:from-blue-600 hover:to-blue-700 shadow-md active:shadow-lg transition-all"
                                        >
                                            Save Job
                                        </button>
                                        <button
                                            onClick={() => setShowNewCard(false)}
                                            className="flex-1 bg-slate-100 text-slate-700 py-3 rounded-full font-semibold hover:bg-slate-200 transition-all"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>

                                {/* Site Selector */}
                                <div className="mt-4 bg-white rounded-3xl shadow-lg p-4 space-y-3">
                                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wide px-2">Select Site</p>
                                    <div className="grid grid-cols-2 gap-2">
                                        {Object.entries(SITES).map(([key, site]) => (
                                            <button
                                                key={key}
                                                onClick={() => setFormData({ ...formData, site: key })}
                                                style={{
                                                    backgroundColor: formData.site === key ? site.hex : '#F3F4F6',
                                                    color: formData.site === key ? '#FFFFFF' : '#374151'
                                                }}
                                                className="py-3 rounded-full font-semibold transition-all"
                                            >
                                                {site.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Jobs List */}
                        {!showNewCard && (
                            <div className="p-4">
                                {monthKeys.length === 0 ? (
                                    <div className="text-center py-16 px-4">
                                        <p className="text-slate-500 text-lg mb-6 font-medium">No jobs logged yet</p>
                                        <button
                                            onClick={handleNewJob}
                                            className="inline-block bg-gradient-to-r from-blue-500 to-blue-600 text-white px-8 py-3 rounded-full font-semibold hover:from-blue-600 hover:to-blue-700 shadow-md transition-all"
                                        >
                                            Log Your First Job
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {monthKeys.map(monthKey => (
                                            <div key={monthKey}>
                                                <button
                                                    onClick={() => setExpandedMonth(expandedMonth === monthKey ? null : monthKey)}
                                                    className="w-full flex items-center justify-between px-4 py-3 bg-gradient-to-r from-slate-200 to-slate-100 rounded-2xl font-semibold text-slate-700 hover:from-slate-300 hover:to-slate-200 transition-all"
                                                >
                                                    <span>{monthKey}</span>
                                                    <span className="text-xl transition-transform" style={{ transform: expandedMonth === monthKey ? 'rotate(180deg)' : 'rotate(0deg)' }}>
                                                        ▼
                                                    </span>
                                                </button>

                                                {expandedMonth === monthKey && (
                                                    <div className="mt-2 space-y-2 pl-1">
                                                        {groupedJobs[monthKey].map(job => (
                                                            <div
                                                                key={job.id}
                                                                onClick={() => handleEditJob(job)}
                                                                style={{ backgroundColor: getCardBackground(job.site) }}
                                                                className="p-4 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md hover:border-slate-200 cursor-pointer transition-all"
                                                            >
                                                                <div className="flex justify-between items-start mb-2">
                                                                    <div className="flex-1">
                                                                        <div className="flex items-center gap-2 mb-1">
                                                                            <p className="font-bold text-slate-900 text-lg">
                                                                                {job.ticketNumber}
                                                                            </p>
                                                                            {job.site && (
                                                                                <span style={{ backgroundColor: SITES[job.site].hex }} className="text-white px-2.5 py-1 rounded-full text-xs font-bold">
                                                                                    {SITES[job.site].label}
                                                                                </span>
                                                            )}
                                                                        </div>
                                                                        <p className="text-xs text-slate-500">
                                                                            {formatDateTime(job.startDateTime)} to {formatDateTime(job.finishDateTime)}
                                                                        </p>
                                                                    </div>
                                                                    <button
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            if (window.confirm('Delete this job?')) {
                                                                                handleDelete(job.id);
                                                                            }
                                                                        }}
                                                                        className="ml-3 p-2 text-red-400 hover:bg-red-50 rounded-full transition-all"
                                                                    >
                                                                        🗑️
                                                                    </button>
                                                                </div>
                                                                {job.workDone && (
                                                                    <p className="text-sm text-slate-600 mb-2 line-clamp-2">{job.workDone}</p>
                                                                )}
                                                                <div className="flex justify-between items-center">
                                                                    {job.parts && job.parts.some(p => p.partNumber || p.partDescription) && (
                                                                        <p className="text-xs text-slate-500">
                                                                            {job.parts.filter(p => p.partNumber || p.partDescription).length} part{job.parts.filter(p => p.partNumber || p.partDescription).length !== 1 ? 's' : ''}
                                                                        </p>
                                                                    )}
                                                                    <p className="text-xs text-slate-400 ml-auto">
                                                                        {formatDateOnly(job.startDateTime)}
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<JobLogger />);
    </script>
</body>
</html>
