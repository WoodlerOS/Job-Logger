<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Logger</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module">
      import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18';
      import ReactDOM from 'https://esm.sh/react-dom@18/client';
      
      const Plus = ({ size = 24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      );

      const Trash2 = ({ size = 24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      );

      const ChevronDown = ({ size = 24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      );

      function JobLogger() {
        const [jobs, setJobs] = useState([]);
        const [showNewCard, setShowNewCard] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [formData, setFormData] = useState({
          ticketNumber: '',
          startDateTime: '',
          finishDateTime: '',
          workDone: '',
          partsUsed: ''
        });
        const [expandedMonth, setExpandedMonth] = useState(null);
        const [touchStart, setTouchStart] = useState(0);
        const cardRef = useRef(null);

        useEffect(() => {
          const loadJobs = () => {
            try {
              const saved = localStorage.getItem('jobs');
              if (saved) {
                setJobs(JSON.parse(saved));
              }
            } catch (error) {
              console.log('No saved jobs yet');
            }
          };
          loadJobs();
        }, []);

        const initializeForm = () => {
          const now = new Date();
          const isoDateTime = now.toISOString().slice(0, 16);
          setFormData({
            ticketNumber: '',
            startDateTime: isoDateTime,
            finishDateTime: isoDateTime,
            workDone: '',
            partsUsed: ''
          });
        };

        const handleNewJob = () => {
          initializeForm();
          setEditingId(null);
          setShowNewCard(true);
        };

        const handleEditJob = (job) => {
          setFormData(job);
          setEditingId(job.id);
          setShowNewCard(true);
        };

        const handleSave = () => {
          if (!formData.ticketNumber.trim()) {
            alert('Please enter a ticket number');
            return;
          }

          let updatedJobs;
          if (editingId) {
            updatedJobs = jobs.map(job => 
              job.id === editingId ? { ...formData, id: editingId } : job
            );
          } else {
            const newJob = {
              ...formData,
              id: Date.now()
            };
            updatedJobs = [newJob, ...jobs];
          }

          setJobs(updatedJobs);
          localStorage.setItem('jobs', JSON.stringify(updatedJobs));

          setShowNewCard(false);
          setFormData({
            ticketNumber: '',
            startDateTime: '',
            finishDateTime: '',
            workDone: '',
            partsUsed: ''
          });
        };

        const handleDelete = (id) => {
          const updatedJobs = jobs.filter(job => job.id !== id);
          setJobs(updatedJobs);
          localStorage.setItem('jobs', JSON.stringify(updatedJobs));
        };

        const handleTouchStart = (e) => {
          setTouchStart(e.touches[0].clientX);
        };

        const handleTouchEnd = (e) => {
          if (!touchStart) return;
          
          const touchEnd = e.changedTouches[0].clientX;
          const diff = touchStart - touchEnd;

          if (diff > 50) {
            handleSave();
          }
        };

        const formatDate = (dateTimeString) => {
          if (!dateTimeString) return '';
          const date = new Date(dateTimeString);
          return date.toLocaleDateString('en-GB', { 
            weekday: 'short', 
            year: '2-digit', 
            month: '2-digit', 
            day: '2-digit' 
          });
        };

        const formatDateTime = (dateTimeString) => {
          if (!dateTimeString) return '';
          const date = new Date(dateTimeString);
          return date.toLocaleDateString('en-GB', { 
            weekday: 'short', 
            year: '2-digit', 
            month: '2-digit', 
            day: '2-digit' 
          }) + ' ' + date.toLocaleTimeString('en-GB', { 
            hour: '2-digit', 
            minute: '2-digit' 
          });
        };

        const groupJobsByMonth = () => {
          const grouped = {};
          
          jobs.forEach(job => {
            const date = new Date(job.startDateTime);
            const monthKey = date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
            
            if (!grouped[monthKey]) {
              grouped[monthKey] = [];
            }
            grouped[monthKey].push(job);
          });

          return grouped;
        };

        const groupedJobs = groupJobsByMonth();
        const monthKeys = Object.keys(groupedJobs).sort((a, b) => {
          const dateA = new Date(groupedJobs[a][0].startDateTime);
          const dateB = new Date(groupedJobs[b][0].startDateTime);
          return dateB - dateA;
        });

        return React.createElement('div', { className: 'min-h-screen bg-gradient-to-b from-slate-50 to-slate-100' },
          React.createElement('div', { className: 'sticky top-0 bg-white border-b border-slate-200 px-4 py-4 shadow-sm z-10' },
            React.createElement('div', { className: 'flex items-center justify-between' },
              React.createElement('h1', { className: 'text-2xl font-bold text-slate-900' }, 'Job Log'),
              !showNewCard && React.createElement('button', {
                onClick: handleNewJob,
                className: 'flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 active:bg-blue-800 transition'
              },
                React.createElement(Plus, { size: 20 }),
                'New Job'
              )
            )
          ),

          showNewCard && React.createElement('div', {
            ref: cardRef,
            onTouchStart: handleTouchStart,
            onTouchEnd: handleTouchEnd,
            className: 'mx-4 mt-6 p-6 bg-white rounded-xl shadow-lg border-2 border-blue-200'
          },
            React.createElement('p', { className: 'text-xs text-slate-500 mb-4 text-center font-medium' }, 'Swipe left to save or use Save button'),
            
            React.createElement('div', { className: 'mb-5' },
              React.createElement('label', { className: 'block text-sm font-semibold text-slate-700 mb-2' }, 'Ticket Number'),
              React.createElement('input', {
                type: 'text',
                value: formData.ticketNumber,
                onChange: (e) => setFormData({ ...formData, ticketNumber: e.target.value }),
                className: 'w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none',
                placeholder: 'Enter ticket number'
              })
            ),

            React.createElement('div', { className: 'mb-5' },
              React.createElement('label', { className: 'block text-sm font-semibold text-slate-700 mb-2' }, 'Start Date & Time'),
              React.createElement('input', {
                type: 'datetime-local',
                value: formData.startDateTime,
                onChange: (e) => setFormData({ ...formData, startDateTime: e.target.value }),
                className: 'w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none'
              })
            ),

            React.createElement('div', { className: 'mb-5' },
              React.createElement('label', { className: 'block text-sm font-semibold text-slate-700 mb-2' }, 'Finish Date & Time'),
              React.createElement('input', {
                type: 'datetime-local',
                value: formData.finishDateTime,
                onChange: (e) => setFormData({ ...formData, finishDateTime: e.target.value }),
                className: 'w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none'
              })
            ),

            React.createElement('div', { className: 'mb-5' },
              React.createElement('label', { className: 'block text-sm font-semibold text-slate-700 mb-2' }, 'Work Done'),
              React.createElement('textarea', {
                value: formData.workDone,
                onChange: (e) => setFormData({ ...formData, workDone: e.target.value }),
                className: 'w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none min-h-32 resize-none',
                placeholder: 'Detailed notes about work completed...'
              })
            ),

            React.createElement('div', { className: 'mb-6' },
              React.createElement('label', { className: 'block text-sm font-semibold text-slate-700 mb-2' }, 'Parts Used'),
              React.createElement('textarea', {
                value: formData.partsUsed,
                onChange: (e) => setFormData({ ...formData, partsUsed: e.target.value }),
                className: 'w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none min-h-24 resize-none',
                placeholder: 'List of parts used...'
              })
            ),

            React.createElement('div', { className: 'flex gap-3' },
              React.createElement('button', {
                onClick: handleSave,
                className: 'flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 active:bg-blue-800 transition'
              }, 'Save Job'),
              React.createElement('button', {
                onClick: () => {
                  setShowNewCard(false);
                  setEditingId(null);
                },
                className: 'flex-1 bg-slate-200 text-slate-700 py-3 rounded-lg font-semibold hover:bg-slate-300 active:bg-slate-400 transition'
              }, 'Cancel')
            )
          ),

          !showNewCard && React.createElement('div', { className: 'pb-8' },
            monthKeys.length === 0 ? React.createElement('div', { className: 'text-center py-16 px-4' },
              React.createElement('p', { className: 'text-slate-500 text-lg mb-4' }, 'No jobs logged yet'),
              React.createElement('button', {
                onClick: handleNewJob,
                className: 'inline-flex items-center gap-2 bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 active:bg-blue-800 transition'
              },
                React.createElement(Plus, { size: 20 }),
                'Log Your First Job'
              )
            ) : monthKeys.map(monthKey =>
              React.createElement('div', { key: monthKey, className: 'mb-6' },
                React.createElement('button', {
                  onClick: () => setExpandedMonth(expandedMonth === monthKey ? null : monthKey),
                  className: 'w-full mx-4 flex items-center justify-between px-4 py-3 bg-slate-200 rounded-lg font-semibold text-slate-700 hover:bg-slate-300 active:bg-slate-400 transition'
                },
                  React.createElement('span', null, monthKey),
                  React.createElement(ChevronDown, { 
                    size: 20,
                    style: { transform: expandedMonth === monthKey ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }
                  })
                ),

                expandedMonth === monthKey && React.createElement('div', { className: 'mt-3 mx-4 space-y-2' },
                  groupedJobs[monthKey].map(job =>
                    React.createElement('div', {
                      key: job.id,
                      onClick: () => handleEditJob(job),
                      className: 'p-4 bg-white rounded-lg border border-slate-200 shadow-sm hover:shadow-md active:bg-slate-50 transition cursor-pointer'
                    },
                      React.createElement('div', { className: 'flex justify-between items-start mb-2' },
                        React.createElement('div', { className: 'flex-1' },
                          React.createElement('p', { className: 'font-semibold text-slate-900' },
                            formatDate(job.startDateTime), ' - ', job.ticketNumber
                          ),
                          React.createElement('p', { className: 'text-xs text-slate-500 mt-1' },
                            formatDateTime(job.startDateTime), ' to ', formatDateTime(job.finishDateTime)
                          )
                        ),
                        React.createElement('button', {
                          onClick: (e) => {
                            e.stopPropagation();
                            if (window.confirm('Delete this job?')) {
                              handleDelete(job.id);
                            }
                          },
                          className: 'ml-3 p-2 text-red-500 hover:bg-red-50 rounded-lg transition'
                        },
                          React.createElement(Trash2, { size: 18 })
                        )
                      ),
                      job.workDone && React.createElement('p', { className: 'text-sm text-slate-600 line-clamp-2 mb-2' }, job.workDone),
                      job.partsUsed && React.createElement('p', { className: 'text-xs text-slate-500' }, 'Parts: ', job.partsUsed.split('\n')[0])
                    )
                  )
                )
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(JobLogger));
    </script>
</body>
</html>
