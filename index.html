<script>
(function(){
  try {
    var s = document.getElementById('splash');
    if (!s) return;
    var standalone = window.navigator && window.navigator.standalone === true;
    if (!standalone) { s.remove(); return; }
    var removeIt = function(){ if (s && s.parentNode) s.parentNode.removeChild(s); };
    s.addEventListener('animationend', function(ev){ if (ev.animationName === 'splashHide') removeIt(); });
    setTimeout(removeIt, 3000);
    s.classList.add('standalone-play');
  } catch (err) {
    var el = document.getElementById('splash');
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }
})();
</script>

const shade = (hex, amt) => { const h=hex.replace('#',''); let r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  const t = amt<0 ? 0 : 255, p = Math.abs(amt);
  r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); };

function nextAutoColour(existingHexes) {
  const used = new Set(existingHexes.map(h => h.toUpperCase()));
  const found = EXTRA_SITE_HUES.find(h => !used.has(h.toUpperCase()));
  return found || EXTRA_SITE_HUES[existingHexes.length % EXTRA_SITE_HUES.length];
}
function slugKey(label, existingKeys) {
  let base = (label||'SITE').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5) || 'SITE';
  let key = base, n = 1;
  while (existingKeys.includes(key)) { n++; key = base + n; }
  return key;
}

let CARD_BG='#FFFFFF';
let BG_DIM = 0;
let CARD_DIM = 0;

function mixHex(a, b, t) {
  const p = (h) => [1,3,5].map(i => parseInt(h.slice(i,i+2), 16));
  const A = p(a), B = p(b);
  const c = A.map((v,i) => Math.round(v + (B[i]-v)*t));
  return '#' + c.map(v => v.toString(16).padStart(2,'0')).join('');
}
function applySurfaceLightness(bgDim, cardDim, dark) {
  BG_DIM = Math.max(0, Math.min(40, Number(bgDim)||0));
  CARD_DIM = Math.max(0, Math.min(40, Number(cardDim)||0));
  if (dark) {
    PAGE_BG = '#101014';
    CARD_BG = '#1C1C22';
  } else {
    PAGE_BG = mixHex('#FAFAFC', '#B8BBC6', BG_DIM / 40);
    CARD_BG = mixHex('#FFFFFF', '#C5C8D2', CARD_DIM / 40);
    SURF = CARD_BG;
  }
  try {
    document.documentElement.style.setProperty('--page-bg', PAGE_BG);
    document.documentElement.style.setProperty('--card-bg', CARD_BG);
    document.documentElement.style.setProperty('--line', dark ? 'rgba(255,255,255,0.14)' : 'rgba(10,10,12,0.13)');
    document.body.style.background = PAGE_BG;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', PAGE_BG);
  } catch (err) {}
}

const multiSiteBg = (siteKeys) => {
  const keys = (siteKeys || []).filter(k => SITES[k]);
  if (keys.length === 0) return null;
  if (keys.length === 1) return SITES[keys[0]].hex;

  const colors = keys.map(k => SITES[k].hex);

  if (colors.length === 2) {
    return 'linear-gradient(145deg in oklab, ' +
      colors[0] + ' 0%, ' +
      colors[0] + ' 18%, ' +
      colors[1] + ' 100%)';
  }

  if (colors.length === 3) {
    return 'linear-gradient(145deg in oklab, ' +
      colors[0] + ' 0%, ' +
      colors[1] + ' 50%, ' +
      colors[2] + ' 100%)';
  }

  const stops = colors.map((c, i) => {
    const pos = Math.round((i / (colors.length - 1)) * 100);
    return c + ' ' + pos + '%';
  });
  return 'linear-gradient(145deg in oklab, ' + stops.join(', ') + ')';
};

const hashStr = (str) => { let h=0; const s=String(str==null?'x':str); for (let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); };
const luminance = (hex) => { const h=hex.replace('#',''); const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16); return (0.299*r+0.587*g+0.114*b)/255; };

const glowBg = (hex, seed) => {
  const hsh = hashStr(seed);
  const x1 = 10 + (hsh % 50), y1 = 6 + ((hsh >> 3) % 42);
  const x2 = 48 + ((hsh >> 6) % 48), y2 = 40 + ((hsh >> 9) % 52);
  const hi1 = shade(hex, 0.30 + ((hsh >> 12) % 18) / 100);
  const hi2 = shade(hex, 0.12 + ((hsh >> 15) % 16) / 100);
  const lo  = shade(hex, -0.22 - ((hsh >> 18) % 16) / 100);
  return 'radial-gradient(58% 58% at '+x1+'% '+y1+'%, '+hi1+' 0%, '+hex+' 60%, transparent 100%), '
    + 'radial-gradient(62% 62% at '+x2+'% '+y2+'%, '+hi2+' 0%, '+hex+' 60%, transparent 100%), '
    + 'linear-gradient(135deg, '+hex+' 0%, '+lo+' 100%)';
};

const DB_NAME='ticketsDB', STORE='kv', KEY='jobs', SETTINGS_KEY='settings';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function dbGet(k){try{const db=await openDB();return await new Promise((res,rej)=>{
  const r=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
  r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error);});}catch(err){return null;}}
async function dbSet(k,v){try{const db=await openDB();await new Promise((res,rej)=>{
  const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(v,k);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});return true;}catch(err){return false;}}

const pad = (n) => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const ukDate = (iso) => { const p=(iso||'').split('-'); return p.length===3 ? p[2]+'-'+p[1]+'-'+p[0] : ''; };
const addDayISO = (iso, n) => { const d=new Date(iso+'T00:00'); d.setDate(d.getDate()+(n||1));
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
let TIME_ROUNDING = 5;
const roundNow = () => { const d=new Date(); const step = TIME_ROUNDING || 1; d.setMinutes(Math.floor(d.getMinutes()/step)*step);
  return pad(d.getHours())+':'+pad(d.getMinutes()); };
const shiftTime = (t, h) => { if (!t) return ''; const p=t.split(':');
  return pad((Number(p[0])+h+24)%24)+':'+p[1]; };

function SwipeCard({ locked, onLock, onDelete, onTap, radius, entryDelay, glow, children }) {
  const [pressed, setPressed] = useState(false);
  const [holding, setHolding] = useState(false);
  const timerRef = useRef(null);
  const autoHideRef = useRef(null);
  const startRef = useRef({ x:0, y:0 });
  const movedRef = useRef(false);
  const suppressClickRef = useRef(false);

  const clearTimers = () => {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
    if (autoHideRef.current) { clearTimeout(autoHideRef.current); autoHideRef.current = null; }
  };

  const beginHold = (x, y) => {
    if (pressed) return;
    movedRef.current = false;
    startRef.current = { x, y };
    setHolding(true);
    timerRef.current = setTimeout(() => {
      timerRef.current = null;
      setHolding(false);
      suppressClickRef.current = true;
      setPressed(true);
      autoHideRef.current = setTimeout(() => setPressed(false), 4000);
    }, 450);
  };
  const moveHold = (x, y) => {
    if (!timerRef.current) return;
    if (Math.abs(x - startRef.current.x) > 10 || Math.abs(y - startRef.current.y) > 10) {
      clearTimeout(timerRef.current); timerRef.current = null;
      setHolding(false);
      movedRef.current = true;
    }
  };
  const endHold = () => {
    if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
    setHolding(false);
  };

  const onStart = (ev) => { const t = ev.touches[0]; beginHold(t.clientX, t.clientY); };
  const onMove = (ev) => { const t = ev.touches[0]; moveHold(t.clientX, t.clientY); };
  const onEnd = () => endHold();

  const onMouseDown = (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    beginHold(ev.clientX, ev.clientY);
    const onMoveWin = (e) => moveHold(e.clientX, e.clientY);
    const onUpWin = () => {
      endHold();
      window.removeEventListener('mousemove', onMoveWin);
      window.removeEventListener('mouseup', onUpWin);
    };
    window.addEventListener('mousemove', onMoveWin);
    window.addEventListener('mouseup', onUpWin);
  };

  const handleTap = (ev) => {
    if (suppressClickRef.current) {
      suppressClickRef.current = false;
      if (ev && ev.preventDefault) ev.preventDefault();
      return;
    }
    if (pressed) { setPressed(false); clearTimers(); return; }
    if (movedRef.current) return;
    if (onTap) onTap();
  };

  useEffect(() => () => clearTimers(), []);

  return e('div', { style:{ position:'relative', borderRadius:radius,
      boxShadow: glow || 'none', transition:'box-shadow .4s ease',
      animation: entryDelay != null ? 'fadeInUp .42s cubic-bezier(.22,.9,.3,1) both' : 'none',
      animationDelay: entryDelay != null ? entryDelay+'ms' : undefined } },
    pressed && e('div', { key:'bub', style:{ position:'absolute', top:'-58px', right:'6px', display:'flex', gap:'10px', zIndex:5 } },
      e('button', { key:'lk', onClick:(ev)=>{ ev.stopPropagation(); setPressed(false); clearTimers(); onLock(); }, className:'bubble-pop',
        style:{ height:'50px', minWidth:'76px', padding:'0 14px', borderRadius:'16px', border:'none', cursor:'pointer', animationDelay:'0s',
          background: locked ? GREY : INK, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'2px',
          boxShadow:'0 8px 20px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.14)' } },
        TickIcon(true, 18, APRICOT),
        e('span', { style:{ fontSize:'0.62rem', fontWeight:800, color:APRICOT, letterSpacing:'0.2px', lineHeight:1 } }, locked ? 'Unlock' : 'Ready')),
      e('button', { key:'del', onClick:(ev)=>{ ev.stopPropagation(); setPressed(false); clearTimers(); onDelete(); }, className:'bubble-pop',
        style:{ height:'50px', minWidth:'76px', padding:'0 14px', borderRadius:'16px', border:'none', cursor:'pointer', animationDelay:'.07s',
          background:RED, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'2px',
          boxShadow:'0 8px 20px rgba(179,38,30,0.35), 0 2px 6px rgba(179,38,30,0.2)' } },
        TrashIcon(17, '#FFF'),
        e('span', { style:{ fontSize:'0.62rem', fontWeight:800, color:'#FFF', letterSpacing:'0.2px', lineHeight:1 } }, 'Delete'))),
    e('div', {
      onTouchStart:onStart, onTouchMove:onMove, onTouchEnd:onEnd, onTouchCancel:onEnd,
      onMouseDown:onMouseDown, onClick:handleTap,
      onContextMenu:(ev)=>{ ev.preventDefault(); clearTimers(); suppressClickRef.current = true; setPressed(true);
        if (autoHideRef.current) clearTimeout(autoHideRef.current);
        autoHideRef.current = setTimeout(() => setPressed(false), 4000); },
      style:{ transform: (holding || pressed) ? 'scale(0.965)' : 'scale(1)', transition:'transform .2s cubic-bezier(.22,.9,.3,1)', position:'relative', userSelect:'none' } },
      children));
}

  const [themeTick, setThemeTick] = useState(0);
  const [siteEdits, setSiteEdits] = useState([]);

  const [query, setQuery] = useState('');
  const [siteFilter, setSiteFilter] = useState([]);

  const [showFilters, setShowFilters] = useState(false);

  const [anchorDate, setAnchorDate] = useState(() => new Date());
  const [calMode, setCalMode] = useState('day');
  const [dayDetail, setDayDetail] = useState(null);
  const [showWeekends, setShowWeekends] = useState(false);

  const [swipeX, setSwipeX] = useState(0);
  const [burst, setBurst] = useState(0);
  const [swiping, setSwiping] = useState(false);
  const touch = useRef({ x:0, y:0, live:false });
  const SWIPE_TRIGGER = 95;

  const [calDX, setCalDX] = useState(0);
  const [calDragging, setCalDragging] = useState(false);
  const calTouch = useRef({ x:0, y:0, live:false });
  const CAL_TRIGGER = 26;

  const jobsRef = useRef(jobs);
  useEffect(() => { jobsRef.current = jobs; }, [jobs]);

  function blank(date) {
    const s = roundNow();
    const d = date || todayISO();
    return { ticketNumber:'', site:'', equipment:[], date:d,
      t1:'', start:s, finish:shiftTime(s,1), t2:'', extra:[],
      workDone: ukDate(d) + '\n', parts:[], locked:false };
  }

  useEffect(() => {
    if (PREVIEW_MODE) return;
    const unsub = auth.onAuthStateChanged(u => setUser(u));
    return unsub;
  }, []);

  useEffect(() => {
    if (PREVIEW_MODE) return;
    if (!user) { setReady(false); return; }
    const ref = dbFS.collection('users').doc(user.uid);
    let unsub = null;
    (async () => {
      try {
        const snap = await ref.get();
        if (!snap.exists) {
          let localJobs = await dbGet(KEY);
          if (!Array.isArray(localJobs)) localJobs = [];
          const localSettings = await dbGet(SETTINGS_KEY);
          await ref.set({ jobs:localJobs, settings: localSettings || {} });
        }
      } catch (err) {}

      unsub = ref.onSnapshot(doc => {
        const data = doc.data() || {};
        const jobsData = Array.isArray(data.jobs) ? data.jobs : [];
        setJobs(jobsData.map(j => ({ equipment:[], parts:[], extraDays:[], locked:false, ...j })));

        const merged = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
        setSettings(merged);
        BG_DIM = merged.bgDim || 0;
        CARD_DIM = merged.cardDim || 0;
        applyDarkMode(!!merged.darkMode);
        if (!merged.darkMode) applySurfaceLightness(BG_DIM, CARD_DIM, false);
        if (merged.sites && merged.sites.length) applySites(merged.sites);
        if (merged.equipment && merged.equipment.length) applyEquip(merged.equipment);
        TIME_ROUNDING = merged.timeRounding || 5;
        if (!appliedDefaultsRef.current) {
          setCalMode(merged.defaultCalMode || 'day');
          setShowWeekends(!(merged.hideWeekendsDefault !== false));
          appliedDefaultsRef.current = true;
        }
        setThemeTick(t => t+1);
        setReady(true);
      }, () => setReady(true));
    })();
    return () => { if (unsub) unsub(); };
  }, [user]);

  const saveSettings = async (patch) => {
    const next = { ...settings, ...patch };
    setSettings(next);
    if (PREVIEW_MODE || !user) return;
    try { await dbFS.collection('users').doc(user.uid).set({ settings: next }, { merge:true }); } catch (err) {}
  };

  const persist = async (next) => {
    setJobs(next);
    if (PREVIEW_MODE || !user) return;
    try { await dbFS.collection('users').doc(user.uid).set({ jobs: next }, { merge:true }); } catch (err) {}
  };

  /* ---------- cloud snapshots: a safety net independent of the live document ----------
     persist() above always overwrites the one live jobs document — nothing else keeps a
     copy if a bad save or a clashing edit from another device ever wiped something out.
     This writes a dated, untouched copy into its own collection instead, so there's
     always somewhere to recover from beyond just "the current state". One snapshot per
     calendar day (today's snapshot is simply replaced if taken more than once), keeping
     the most recent BACKUP_RETENTION days and quietly pruning anything older. */
  const CLOUD_BACKUP_KEY = 'cloudBackupDate';
  const BACKUP_RETENTION = 14;

  const snapshotToCloud = async () => {
    if (PREVIEW_MODE || !user || !jobsRef.current.length) return false;
    try {
      await dbFS.collection('users').doc(user.uid).collection('backups').doc(todayISO())
        .set({ jobs: jobsRef.current, savedAt: new Date().toISOString(), count: jobsRef.current.length });
      return true;
    } catch (err) { return false; }
  };

  const pruneOldBackups = async () => {
    if (PREVIEW_MODE || !user) return;
    try {
      const snap = await dbFS.collection('users').doc(user.uid).collection('backups').orderBy('savedAt', 'desc').get();
      const extra = snap.docs.slice(BACKUP_RETENTION);
      await Promise.all(extra.map(d => d.ref.delete()));
    } catch (err) {}
  };

  useEffect(() => {
    if (PREVIEW_MODE || !ready || !user) return;
    (async () => {
      const t = todayISO();
      let last = null;
      try { last = localStorage.getItem(CLOUD_BACKUP_KEY); } catch (err) {}
      if (last !== t) {
        const ok = await snapshotToCloud();
        if (ok) {
          try { localStorage.setItem(CLOUD_BACKUP_KEY, t); } catch (err) {}
          pruneOldBackups();
        }
      }
    })();
  }, [ready, user]);

  const backupNow = async () => {
    if (PREVIEW_MODE) { alert('Cloud backup is disabled in preview mode.'); return; }
    const ok = await snapshotToCloud();
    alert(ok ? 'Backup saved to the cloud.' : 'Could not save a backup — check your connection.');
  };

  const [backupsOpen, setBackupsOpen] = useState(false);
  const [backupsList, setBackupsList] = useState([]);
  const [backupsLoading, setBackupsLoading] = useState(false);

  const openBackups = async () => {
    setMenuOpen(false); setBackupsOpen(true); setBackupsLoading(true);
    if (PREVIEW_MODE) {
      setBackupsList([]);
      setBackupsLoading(false);
      return;
    }
    try {
      const snap = await dbFS.collection('users').doc(user.uid).collection('backups').orderBy('savedAt', 'desc').get();
      setBackupsList(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    } catch (err) { setBackupsList([]); }
    setBackupsLoading(false);
  };

  const restoreBackup = async (b) => {
    if (!window.confirm('Replace your current tickets with the backup from '+fmtDate(b.savedAt)+'? This will overwrite what\'s currently synced, on every device.')) return;
    await persist(b.jobs || []);
    setBackupsOpen(false);
    alert('Restored '+(b.jobs||[]).length+' ticket(s) from '+fmtDate(b.savedAt)+'.');
  };

  const signIn = async (email, password) => {
    setAuthError(''); setAuthBusy(true);
    try { await auth.signInWithEmailAndPassword(email, password); }
    catch (err) { setAuthError(err && err.message ? err.message : 'Could not sign in.'); }
    setAuthBusy(false);
  };
  const signOutUser = () => { if (!PREVIEW_MODE) auth.signOut(); };

  const fmtDate  = (s) => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
  const fmtDay   = (s) => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : '';
  const fmtTime  = (s) => s ? new Date(s).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  const stamp = () => { const d=new Date();
    return pad(d.getFullYear()%100)+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };

  const [copiedKey, setCopiedKey] = useState(null);
  const copyText = async (text, key) => {
    const t = (text || '').trim();
    if (!t) { alert('Nothing to copy.'); return; }

      await navigator.clipboard.writeText(t);
      setCopiedKey(key);
      setTimeout(() => setCopiedKey(k => k === key ? null : k), 1600);

  const CopyBtn = (text, key, light) => {

      style: {
        border: 'none',

        display: 'flex', alignItems: 'center', justifyContent: 'center',

        opacity: done ? 1 : 0.55,
        transition: 'opacity .15s ease, transform .12s ease'

      ? e('svg', { width:16, height:16, viewBox:'0 0 24 24', style:{ display:'block' } },

      : CopyIcon(16, light ? 'rgba(255,255,255,0.85)' : MID));
  };

  const mins = (a,b) => { if (!a||!b) return 0; const m = Math.round((new Date(b)-new Date(a))/60000); return (isNaN(m)||m<0)?0:m; };
  const hm = (m) => m >= 60 ? Math.floor(m/60)+'h '+(m%60?pad(m%60)+'m':'') : m+'m';
  const eqOf = (j) => Array.isArray(j.equipment) ? j.equipment : [];
  const exOf = (j) => Array.isArray(j.extraDays) ? j.extraDays : [];

  const composeTimes = (date, arr) => {
    let d = date, last = null;
    return arr.map(t => {
      if (!t) return null;
      if (last && t < last) d = addDayISO(d,1);
      last = t;
      return d + 'T' + t;
    });
  };

  const buildXlsxBlob = async (rowsSrc) => {
    const cols = [
      { header:'Ticket', key:'ticket', width:16 }, { header:'Site', key:'site', width:9 },
      { header:'Machine', key:'machine', width:15 }, { header:'Date', key:'date', width:12 },
      { header:'Travel 1', key:'t1', width:9 }, { header:'Start', key:'start', width:8 },
      { header:'Finish', key:'finish', width:8 }, { header:'Travel 2', key:'t2', width:9 },
      { header:'On site', key:'onsite', width:10 }, { header:'Travel mins', key:'travelmins', width:11 },
      { header:'Extra days', key:'extra', width:30 }, { header:'Signed off', key:'signed', width:11 },
      { header:'Work Done', key:'workdone', width:52 }, { header:'Parts Used', key:'parts', width:36 } ];

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Tickets', { views:[{ state:'frozen', ySplit:1 }] });
    ws.columns = cols;

    let rowIndex = 0;
    [...rowsSrc].sort((a,b)=>new Date(a.startDateTime)-new Date(b.startDateTime)).forEach(j => {
      const parts = (j.parts||[]).filter(p=>p.partNumber||p.partDescription)
        .map(p => (p.partNumber||'').trim() + (p.partDescription ? ' — '+p.partDescription.trim() : '')).join(' | ');
      let on = mins(j.startDateTime, j.finishDateTime);
      let tr = (j.hasTravel ? mins(j.travelDateTime, j.startDateTime) : 0)
             + (j.hasTravel2 ? mins(j.finishDateTime, j.travel2DateTime) : 0);
      const ex = exOf(j).map(d => {
        on += mins(d.startDateTime, d.finishDateTime);
        tr += (d.hasTravel ? mins(d.travelDateTime, d.startDateTime) : 0)
            + (d.hasTravel2 ? mins(d.finishDateTime, d.travel2DateTime) : 0);
        return fmtDay(d.startDateTime)+' '+fmtTime(d.startDateTime)+'–'+fmtTime(d.finishDateTime);
      }).join(' | ');
      const workdone = (j.workDone||'').trim();
      const row = ws.addRow({
        ticket:j.ticketNumber, site: SITES[j.site]?SITES[j.site].label:'', machine: eqOf(j).map(x=>EQUIP[x]||x).join(', '),
        date: fmtDate(j.startDateTime), t1: j.hasTravel?fmtTime(j.travelDateTime):'', start: fmtTime(j.startDateTime),
        finish: fmtTime(j.finishDateTime), t2: j.hasTravel2?fmtTime(j.travel2DateTime):'', onsite: on?hm(on):'',
        travelmins: tr||'', extra: ex, signed: j.locked ? 'Ready' : '', workdone, parts });

      const banded = rowIndex % 2 === 1;
      const thin = { style:'thin', color:{ argb:'FFD8E4E0' } };
      row.eachCell({ includeEmpty:true }, cell => {
        cell.alignment = { wrapText:true, vertical:'top' };
        cell.border = { top:thin, bottom:thin, left:thin, right:thin };
        if (banded) cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFDCEEF9' } };
      });
      const longest = Math.max(workdone.length / 58, parts.length / 42, ex.length / 45, 1);
      row.height = Math.max(16, Math.ceil(longest) * 14 + 4);
      rowIndex++;
    });

    const header = ws.getRow(1);
    header.height = 22;
    header.eachCell(cell => {
      cell.font = { bold:true, color:{ argb:'FFF7F1E2' } };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF41436A' } };
      cell.alignment = { vertical:'middle' };
      cell.border = { top:{style:'thin',color:{argb:'FF41436A'}}, bottom:{style:'thin',color:{argb:'FF41436A'}},
        left:{style:'thin',color:{argb:'FF41436A'}}, right:{style:'thin',color:{argb:'FF41436A'}} };
    });
    ws.autoFilter = { from:{ row:1, column:1 }, to:{ row:1, column:cols.length } };

    const buf = await wb.xlsx.writeBuffer();
    return new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  };

  const download = (blob, name) => {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  };
  const shareFiles = async (files) => {
    try { if (navigator.canShare && navigator.canShare({files})) { await navigator.share({files,title:'Tickets'}); return true; } }
    catch (err) { if (err && err.name==='AbortError') return true; }
    return false;
  };

  const doAutoBackup = (label) => {
    if (!jobsRef.current.length) return;
    const blob = new Blob([JSON.stringify({ app:'tickets', version:9, exported:new Date().toISOString(), auto:true, jobs:jobsRef.current }, null, 2)], { type:'application/json' });
    download(blob, label+' Auto backup.json');
  };
  useEffect(() => {
    if (!ready || !settings.autoBackupEnabled) return;
    const check = () => {
      const t = todayISO();
      let last = null;
      try { last = localStorage.getItem(AUTO_BACKUP_KEY); } catch (err) {}
      if (last !== t) {
        doAutoBackup(last || t);
        try { localStorage.setItem(AUTO_BACKUP_KEY, t); } catch (err) {}
      }
    };
    check();
    const iv = setInterval(check, 5*60*1000);
    return () => clearInterval(iv);
  }, [ready, settings.autoBackupEnabled]);

  const scopeTickets = (scope) => {
    if (scope === 'day') return dv.list;
    if (scope === 'week') {
      const set = [];
      wk.dates.forEach(dt => {
        const iso = dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
        (wk.byDate[iso]||[]).forEach(j => set.push(j));
      });
      return set;
    }
    if (scope === 'month') return ms.src;
    return jobs;
  };
  const scopeSuffix = (scope) => {
    if (scope === 'day') return ' ' + anchorDate.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    if (scope === 'week') return ' week of ' + wk.dates[0].toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
    if (scope === 'month') return ' ' + anchorDate.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
    return ' all';
  };

  const doSpreadsheet = async (scope) => {
    const src = scopeTickets(scope);
    if (!src.length) { alert('Nothing to export.'); return; }
    if (typeof ExcelJS === 'undefined') { alert('Still loading — try again in a moment.'); return; }
    const name = stamp()+' App tickets'+scopeSuffix(scope)+'.xlsx';
    const blob = await buildXlsxBlob(src);
    if (!(await shareFiles([new File([blob],name,{type:blob.type})]))) download(blob,name);
    setMenuOpen(false); setChooser(null);
  };

  const doBackup = async () => {
    if (!jobs.length) { alert('Nothing to back up.'); return; }
    const name = stamp()+' App tickets backup.json';
    const blob = new Blob([JSON.stringify({ app:'tickets', version:9, exported:new Date().toISOString(), jobs }, null, 2)], { type:'application/json' });
    if (!(await shareFiles([new File([blob],name,{type:'application/json'})]))) download(blob,name);
    setMenuOpen(false);
  };

  const doRestore = () => {
    const input = document.getElementById('restoreInput'); input.value='';
    input.onchange = () => {
      const file = input.files && input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const parsed = JSON.parse(reader.result);
          const list = Array.isArray(parsed) ? parsed : parsed.jobs;
          if (!Array.isArray(list)) throw new Error('bad');
          const merged = list.map(j => ({ equipment:[], parts:[], extraDays:[], locked:false, ...j }));
          const seen = new Set(merged.map(j=>j.id));
          jobs.forEach(j => { if (!seen.has(j.id)) merged.push(j); });
          merged.sort((a,b)=>new Date(b.startDateTime)-new Date(a.startDateTime));
          await persist(merged); setMenuOpen(false);
          alert('Restored. Total now '+merged.length+' tickets.');
        } catch (err) { alert('That file could not be read.'); }
      };
      reader.readAsText(file);
    };
    input.click();
  };

  const doCopyText = async (scope) => {
    const src = scopeTickets(scope);
    if (!src.length) { alert('Nothing to copy.'); return; }
    const byDate = {};
    src.forEach(j => { const iso = (j.startDateTime||'').slice(0,10); (byDate[iso] = byDate[iso] || []).push(j); });
    const dates = Object.keys(byDate).sort();
    const text = dates.map(iso => {
      const list = byDate[iso].slice().sort((a,b)=>new Date(a.startDateTime)-new Date(b.startDateTime));
      const head = new Date(iso+'T00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
      const body = list.map(j => {
        const p = (j.parts||[]).filter(x=>x.partNumber||x.partDescription)
          .map(x => (x.partNumber||'')+(x.partDescription?' — '+x.partDescription:'')).join(', ');
        const ex = exOf(j).map(x => fmtDay(x.startDateTime)+' '+fmtTime(x.startDateTime)+'–'+fmtTime(x.finishDateTime)).join(', ');
        const lines = [
          'Ticket: ' + j.ticketNumber,
          SITES[j.site] ? 'Site: ' + SITES[j.site].label : null,
          eqOf(j).length ? 'Machine: ' + eqOf(j).join(', ') : null,
          'Date: ' + fmtDate(j.startDateTime),
          j.hasTravel ? 'Travel 1: ' + fmtTime(j.travelDateTime) : null,
          'Time: ' + fmtTime(j.startDateTime) + '–' + fmtTime(j.finishDateTime),
          j.hasTravel2 ? 'Travel 2: ' + fmtTime(j.travel2DateTime) : null,
          ex ? 'Also: ' + ex : null,
          j.workDone ? 'Work done: ' + j.workDone.replace(/\n/g,' ') : null,
          p ? 'Parts: ' + p : null
        ].filter(Boolean);
        return lines.join('\n');
      }).join('\n\n');
      return head + '\n\n' + body;
    }).join('\n\n\n');
    try { await navigator.clipboard.writeText(text); alert('Copied '+src.length+' ticket(s).'); }
    catch (err) { alert('Copy failed — clipboard access blocked.'); }
    setMenuOpen(false); setChooser(null);
  };

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return jobs.filter(j => {
      if (siteFilter.length && !siteFilter.includes(j.site)) return false;
      if (equipFilter.length && !eqOf(j).some(x => equipFilter.includes(x))) return false;
      if (!q) return true;
      const hay = [ j.ticketNumber, j.workDone, SITES[j.site]?SITES[j.site].label:'',
        ...eqOf(j).map(x => EQUIP[x] ? EQUIP[x]+' '+x : x),
        ...(j.parts||[]).map(p => (p.partNumber||'')+' '+(p.partDescription||'')) ].join(' ').toLowerCase();
      return hay.includes(q);
    }).sort((a,b) => new Date(b.startDateTime) - new Date(a.startDateTime));
  }, [jobs, query, siteFilter, equipFilter]);

  const menuSearchResults = useMemo(() => {
    const q = menuSearch.trim().toLowerCase();
    if (!q) return [];
    return jobs.filter(j => {
      const hay = [ j.ticketNumber, j.workDone, SITES[j.site]?SITES[j.site].label:'',
        ...eqOf(j).map(x => EQUIP[x] ? EQUIP[x]+' '+x : x),
        ...(j.parts||[]).map(p => (p.partNumber||'')+' '+(p.partDescription||'')) ].join(' ').toLowerCase();
      return hay.includes(q);
    }).sort((a,b) => new Date(b.startDateTime) - new Date(a.startDateTime)).slice(0,6);
  }, [jobs, menuSearch]);

  const partHistory = useMemo(() => {
    const set = new Map();
    jobs.forEach(j => (j.parts||[]).forEach(p => {
      if (p.partNumber && p.partNumber.trim()) set.set(p.partNumber.trim(), p.partDescription||'');
    }));
    return [...set.entries()];
  }, [jobs]);

  const ms = useMemo(() => {
    const y = anchorDate.getFullYear(), m = anchorDate.getMonth();
    const src = jobs.filter(j => {
      const d = new Date(j.startDateTime);
      return d.getFullYear() === y && d.getMonth() === m;
    });
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = {};
    src.forEach(j => {
      const dnum = new Date(j.startDateTime).getDate();
      (days[dnum] = days[dnum] || { tickets:[] }).tickets.push(j);
    });
    Object.keys(days).forEach(d => {
      const day = days[d];
      day.tickets.sort((a,b) => new Date(a.startDateTime) - new Date(b.startDateTime));
      const seq = [];
      day.tickets.forEach(j => { if (j.site && seq[seq.length-1] !== j.site) seq.push(j.site); });
      day.siteSequence = seq;
      day.sites = [...new Set(day.tickets.map(j=>j.site).filter(Boolean))];
      day.equip = [...new Set(day.tickets.flatMap(eqOf))];
      day.allLocked = day.tickets.every(j => j.locked);
      day.first = day.tickets[0].hasTravel && day.tickets[0].travelDateTime ? day.tickets[0].travelDateTime : day.tickets[0].startDateTime;
      const lastJob = day.tickets[day.tickets.length-1];
      day.last = lastJob.hasTravel2 && lastJob.travel2DateTime ? lastJob.travel2DateTime : lastJob.finishDateTime;
    });
    return { y, m, src, days, daysInMonth, firstDow };
  }, [jobs, anchorDate]);

  const wk = useMemo(() => {
    const dow = (anchorDate.getDay() + 6) % 7;
    const monday = new Date(anchorDate); monday.setDate(anchorDate.getDate() - dow);
    const dates = [...Array(7)].map((_,i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });
    const byDate = {};
    jobs.forEach(j => { const k = (j.startDateTime||'').slice(0,10); (byDate[k] = byDate[k] || []).push(j); });
    Object.keys(byDate).forEach(k => byDate[k].sort((a,b)=>new Date(a.startDateTime)-new Date(b.startDateTime)));
    return { monday, dates, byDate };
  }, [jobs, anchorDate]);

  const dv = useMemo(() => {
    const iso = anchorDate.getFullYear()+'-'+pad(anchorDate.getMonth()+1)+'-'+pad(anchorDate.getDate());
    const list = jobs.filter(j => (j.startDateTime||'').slice(0,10) === iso)
      .sort((a,b)=>new Date(a.startDateTime)-new Date(b.startDateTime));
    const seq = [];
    list.forEach(j => { if (j.site && seq[seq.length-1] !== j.site) seq.push(j.site); });
    return { iso, list, siteSequence:seq };
  }, [jobs, anchorDate]);

  const goBack = () => {
    const r = returnTo;
    setSwipeX(0); setSwiping(false); setFormMenu(false);
    setEditingId(null); setForm(blank());
    if (r && r.view === 'list') { setView('list'); setDayDetail(null); }
    else { setView('month'); setDayDetail(r && r.day != null ? r.day : null); }
    setReturnTo(null);
  };

  const openNew = (date, ret) => {
    setForm(blank(date)); setEditingId(null); setReturnTo(ret || null);
    setDayDetail(null); setSwipeX(0); setView('form'); window.scrollTo(0,0);
  };

  const openEdit = (j, ret) => {
    setForm({
      ticketNumber: j.ticketNumber || '',
      site: j.site || '',
      equipment: eqOf(j),
      date: (j.startDateTime||'').slice(0,10) || todayISO(),
      t1: j.hasTravel && j.travelDateTime ? j.travelDateTime.slice(11,16) : '',
      start: (j.startDateTime||'').slice(11,16),
      finish: (j.finishDateTime||'').slice(11,16),
      t2: j.hasTravel2 && j.travel2DateTime ? j.travel2DateTime.slice(11,16) : '',
      extra: exOf(j).map(d => ({
        date: (d.startDateTime||'').slice(0,10),
        t1: d.hasTravel && d.travelDateTime ? d.travelDateTime.slice(11,16) : '',
        start: (d.startDateTime||'').slice(11,16),
        finish: (d.finishDateTime||'').slice(11,16),
        t2: d.hasTravel2 && d.travel2DateTime ? d.travel2DateTime.slice(11,16) : ''
      })),
      workDone: j.workDone || '',
      parts: (j.parts||[]).filter(p => p.partNumber || p.partDescription),
      locked: !!j.locked
    });
    setEditingId(j.id); setReturnTo(ret || null);
    setDayDetail(null); setSwipeX(0); setView('form'); window.scrollTo(0,0);
  };

  const duplicate = () => {
    setForm({ ...form, ticketNumber:'', date: todayISO(), extra:[], locked:false });
    setEditingId(null); setFormMenu(false); window.scrollTo(0,0);
  };

  const packRec = () => {
    const pack = (d) => {
      const c = composeTimes(d.date, [d.t1, d.start, d.finish || d.start, d.t2]);
      return { startDateTime:c[1], finishDateTime:c[2],
        hasTravel: !!d.t1, travelDateTime: c[0] || c[1],
        hasTravel2: !!d.t2, travel2DateTime: c[3] || c[2] };
    };
    return {
      id: editingId || Date.now(),
      ticketNumber: form.ticketNumber.trim(),
      site: form.site,
      equipment: form.equipment,
      ...pack(form),
      extraDays: (form.extra||[]).filter(d => d.date && d.start).map(pack),
      workDone: form.workDone,
      parts: form.parts.filter(p => p.partNumber || p.partDescription),
      locked: !!form.locked
    };
  };

  const commit = async () => {
    const rec = packRec();
    await persist(editingId ? jobs.map(j => j.id===editingId ? rec : j) : [rec, ...jobs]);
  };

  const saveAndClose = async () => {
    if (!form.ticketNumber.trim()) { alert('Enter a ticket number to save.'); return; }
    if (!form.start) { alert('Set a start time to save.'); return; }
    const dupe = jobs.find(j => j.id !== editingId && String(j.ticketNumber).trim().toLowerCase() === form.ticketNumber.trim().toLowerCase());
    if (dupe && !window.confirm('Ticket "'+form.ticketNumber+'" already exists ('+fmtDate(dupe.startDateTime)+'). Save anyway?')) return;
    await commit();
    goBack();
  };

  const backOut = async () => {
    if (form.ticketNumber.trim() && form.start) await commit();
    goBack();
  };

  const remove = (id) => { persist(jobs.filter(j => j.id !== id)); setDayDetail(null); };
  const toggleLock = (id) => persist(jobs.map(j => j.id === id ? { ...j, locked: !j.locked } : j));

  const setPart = (i, field, val) => {
    const parts = form.parts.map((p,idx) => idx===i ? { ...p, [field]:val } : p);
    if (field === 'partNumber') {
      const known = partHistory.find(([n]) => n.toLowerCase() === val.trim().toLowerCase());
      if (known && !parts[i].partDescription) parts[i].partDescription = known[1];
    }
    setForm({ ...form, parts });
  };

  const onTouchStart = (ev) => {
    const tag = ((ev.target && ev.target.tagName) || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { touch.current.live = false; return; }
    const t = ev.touches[0];
    touch.current = { x:t.clientX, y:t.clientY, live:true };
    setSwiping(true);
  };
  const onTouchMove = (ev) => {
    if (!touch.current.live) return;
    const t = ev.touches[0];
    const dx = t.clientX - touch.current.x;
    const dy = t.clientY - touch.current.y;
    if (Math.abs(dy) > Math.abs(dx) + 8) { touch.current.live = false; setSwiping(false); setSwipeX(0); return; }
    setSwipeX(dx > 0 ? Math.min(dx * 0.85, 170) : 0);
  };
  const onTouchEnd = () => {
    if (!touch.current.live) { setSwiping(false); setSwipeX(0); return; }
    touch.current.live = false;
    setSwiping(false);
    if (swipeX >= SWIPE_TRIGGER) backOut(); else setSwipeX(0);
  };

  const progress = Math.min(swipeX / SWIPE_TRIGGER, 1);
  const armed = swipeX >= SWIPE_TRIGGER;

  const swipeHint = view === 'form' && swipeX > 4 && e('div', { className:'swipe-hint',
    style:{ position:'fixed', left:'10px', top:'50%', transform:'translateY(-50%) scale('+(0.7+progress*0.5)+')',
      zIndex:40, width:'44px', height:'44px', borderRadius:'12px',
      background: armed ? INK : SURF2, boxShadow:SHADOW,
      display:'flex', alignItems:'center', justifyContent:'center',
      opacity: 0.3 + progress*0.7, transition:'background .12s ease' } },
    ChevronLeft(24, armed ? APRICOT : GREY));

  const shift = (n) => {
    if (calMode === 'month') {
      const y = anchorDate.getFullYear(), targetM = anchorDate.getMonth() + n;
      const daysInTarget = new Date(y, targetM+1, 0).getDate();
      setAnchorDate(new Date(y, targetM, Math.min(anchorDate.getDate(), daysInTarget)));
    } else if (calMode === 'week') {
      const d = new Date(anchorDate); d.setDate(d.getDate() + n*7); setAnchorDate(d);
    } else {
      const d = new Date(anchorDate); d.setDate(d.getDate() + n); setAnchorDate(d);
    }
    setDayDetail(null);
  };
  const goToday = () => setAnchorDate(new Date());

  const onCalTouchStart = (ev) => {
    const t = ev.touches[0];
    calTouch.current = { x:t.clientX, y:t.clientY, live:true };
    setCalDragging(true);
  };
  const onCalTouchMove = (ev) => {
    if (!calTouch.current.live) return;
    const t = ev.touches[0];
    const dx = t.clientX - calTouch.current.x;
    const dy = t.clientY - calTouch.current.y;
    if (Math.abs(dy) > Math.abs(dx) + 8) { calTouch.current.live = false; setCalDragging(false); setCalDX(0); return; }
    setCalDX(Math.max(-80, Math.min(80, dx)));
  };
  const onCalTouchEnd = () => {
    if (!calTouch.current.live) { setCalDragging(false); setCalDX(0); return; }
    calTouch.current.live = false;
    setCalDragging(false);
    if (calDX <= -CAL_TRIGGER) shift(1);
    else if (calDX >= CAL_TRIGGER) shift(-1);
    setCalDX(0);
  };

  const [sheetDY, setSheetDY] = useState(0);
  const [sheetDragging, setSheetDragging] = useState(false);
  const sheetTouch = useRef({ x:0, y:0, live:false, active:false });
  const sheetPanelRef = useRef(null);
  const SHEET_TRIGGER = 90;

  const sheet = (children, onClose) => {
    const handleStart = (ev) => {
      const t = ev.touches[0];
      sheetTouch.current = { x:t.clientX, y:t.clientY, live:true, active:false };
    };
    const handleMove = (ev) => {
      if (!sheetTouch.current.live) return;
      const t = ev.touches[0];
      const dy = t.clientY - sheetTouch.current.y;
      const dx = t.clientX - sheetTouch.current.x;
      if (!sheetTouch.current.active) {
        const atTop = !sheetPanelRef.current || sheetPanelRef.current.scrollTop <= 0;
        if (!atTop || dy <= 8 || Math.abs(dx) > dy) return;
        sheetTouch.current.active = true;
        setSheetDragging(true);
      }
      ev.preventDefault();
      setSheetDY(Math.max(0, dy));
    };
    const handleEnd = () => {
      const wasActive = sheetTouch.current.active;
      sheetTouch.current.live = false;
      sheetTouch.current.active = false;
      if (!wasActive) return;
      setSheetDragging(false);
      if (sheetDY >= SHEET_TRIGGER) { setSheetDY(0); onClose(); } else setSheetDY(0);
    };
    return e('div', { onClick:onClose, className:'sheet-overlay',
      style:{ position:'fixed', inset:0, background:'rgba(6,45,34,0.34)', zIndex:60, display:'flex', alignItems:'flex-end',
        animation:'fadeIn .18s ease' } },
      e('div', { ref:sheetPanelRef, onClick:(ev)=>ev.stopPropagation(), className:'sheet-panel',

          background: DARK_MODE ? '#F2F2F5' : '#FFFFFF', boxShadow:SHADOW_SM, transition:'left .2s cubic-bezier(.22,.9,.3,1)' } })));

  const chipSelect = (label, options, value, onChange) =>
    e('div', { key:label, style:{ display:'flex', flexDirection:'column', gap:'0.5rem', background:SURF, border:'1px solid '+LINE,
      borderRadius:'16px', padding:'0.75rem 0.9rem' } },
      e('span', { style:{ ...LBL } }, label),
      e('div', { style:{ display:'flex', gap:'0.4rem', flexWrap:'wrap' } },
        options.map(opt => e('button', { key:opt.key, className:'d-hover-btn', onClick:()=>onChange(opt.key),
          style:{ padding:'0.4rem 0.75rem', borderRadius:'9px', border: value===opt.key?'none':'1px solid '+LINE,
            background: value===opt.key?VIOLET:SURF2, color: value===opt.key?(DARK_MODE?'#0A0A0C':'#FFFFFF'):INK,
            fontSize:'0.75rem', fontWeight:800, cursor:'pointer' } }, opt.label))));

  const settingsSection = (title) => e('div', { key:'h-'+title, className:'settings-span-2', style:{ ...LBL, marginTop:'0.5rem' } }, title);

  const settingsView = e('div', { style:{ padding:'0.8rem 0.85rem 2.5rem', display:'flex', flexDirection:'column', gap:'0.7rem' } },
    e('div', { className:'settings-span-2', style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'0.1rem 0.15rem 0.3rem' } },
      e('button', { className:'d-hover-btn', onClick:()=>setSettingsOpen(false), style:{ background:'none', border:'none', width:'36px', height:'36px',
        display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' } }, ChevronLeft(18, INK)),
      e('span', { style:{ fontSize:'0.9rem', fontWeight:900, letterSpacing:'-0.2px', color:INK } }, 'Settings'),
      e('span', { style:{ width:'36px' } })),

    e('div', { className:'settings-desktop-grid', style:{ display:'flex', flexDirection:'column', gap:'0.7rem' } },
      settingsSection('Theme'),
      e('button', { key:'themesRow', className:'d-hover settings-span-2', onClick:()=>setThemesOpen(true), style:{ width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
        background:SURF, border:'1px solid '+LINE, borderRadius:'16px', padding:'0.75rem 0.9rem', cursor:'pointer', textAlign:'left' } },
        e('div', null,
          e('div', { style:{ fontSize:'0.85rem', fontWeight:800, color:INK } }, 'Browse themes'),
          e('div', { style:{ fontSize:'0.68rem', color:GREY, marginTop:'1px' } }, THEME_PRESETS.length+' preset palettes')),
        e('div', { style:{ display:'flex', alignItems:'center', gap:'0.6rem' } },
          e('div', { style:{ display:'flex', gap:'3px' } },
            sitesToList().slice(0,4).map((s,hi) =>
              e('span', { key:hi, style:{ width:'16px', height:'16px', borderRadius:'4px', background:s.hex || '#888', display:'block', flexShrink:0 } }))),
          e('span', { style:{ display:'inline-flex', transform:'rotate(180deg)' } }, ChevronLeft(15, GREY)))),

      settingsSection('Equipment'),
      e('div', { className:'settings-span-2', style:{ display:'flex', flexDirection:'column', gap:'0.5rem' } },
        equipEdits.map((x,idx) => e('div', { key:x.key, className:'d-hover', style:{ display:'flex', alignItems:'center', gap:'0.5rem',
          background:SURF, border:'1px solid '+LINE, borderRadius:'14px', padding:'0.5rem 0.6rem' } },
          e('input', { type:'text', value:x.label, onChange:(ev)=>updateEquipLabel(idx, ev.target.value),
            onBlur:()=>commitEquip(equipEdits),
            style:{ flex:1, minWidth:0, border:'none', outline:'none', background:'transparent', fontSize:'0.84rem', fontWeight:800, color:INK } }),
          e('button', { onClick:()=>removeEquip(idx), style:{ border:'none', background:'none', cursor:'pointer', padding:'4px', flexShrink:0 } },
            TrashIcon(16, GREY)))),
        e('button', { className:'d-hover-btn', onClick:addEquip, style:{ width:'100%', border:'1.5px dashed '+LINE, background:'transparent', color:MID,
          borderRadius:'14px', padding:'0.65rem', fontSize:'0.76rem', fontWeight:800, cursor:'pointer' } }, '+ Add equipment')),

      settingsSection('Behaviour'),
      toggleRow('Dark mode', 'Switches the app to a dark colour scheme',
        settings.darkMode, ()=>{ const next = !settings.darkMode; applyDarkMode(next); setThemeTick(t=>t+1); saveSettings({ darkMode: next }); }),
      !settings.darkMode && e('div', { key:'bgdim', className:'d-hover', style:{ background:SURF, border:'1px solid '+LINE, borderRadius:'16px', padding:'0.75rem 0.9rem' } },
        e('div', { style:{ fontSize:'0.84rem', fontWeight:800, color:INK } }, 'Background brightness'),
        e('div', { style:{ fontSize:'0.68rem', color:GREY, margin:'2px 0 0.55rem' } }, 'Lower to tone down the page white'),
        e('input', { type:'range', min:0, max:40, value:settings.bgDim||0,
          onChange:(ev)=>{ const v = Number(ev.target.value); applySurfaceLightness(v, settings.cardDim||0, false); setThemeTick(t=>t+1); saveSettings({ bgDim:v }); },
          style:{ width:'100%', accentColor:INK } })),
      !settings.darkMode && e('div', { key:'carddim', className:'d-hover', style:{ background:SURF, border:'1px solid '+LINE, borderRadius:'16px', padding:'0.75rem 0.9rem' } },
        e('div', { style:{ fontSize:'0.84rem', fontWeight:800, color:INK } }, 'Card brightness'),
        e('div', { style:{ fontSize:'0.68rem', color:GREY, margin:'2px 0 0.55rem' } }, 'Lower to tone down white cards and panels'),
        e('input', { type:'range', min:0, max:40, value:settings.cardDim||0,
          onChange:(ev)=>{ const v = Number(ev.target.value); applySurfaceLightness(settings.bgDim||0, v, false); setThemeTick(t=>t+1); saveSettings({ cardDim:v }); },
          style:{ width:'100%', accentColor:INK } })),
      toggleRow('Lock tickets when complete', 'Marking a ticket ready stops it being edited until unlocked',
        settings.lockReadOnly, ()=>saveSettings({ lockReadOnly: !settings.lockReadOnly })),
      toggleRow('Hide weekends by default', 'Weekend columns start collapsed on the calendar',
        settings.hideWeekendsDefault, ()=>saveSettings({ hideWeekendsDefault: !settings.hideWeekendsDefault })),

      chipSelect('Calendar opens to', [{key:'day',label:'Day'},{key:'week',label:'Week'},{key:'month',label:'Month'}],
        settings.defaultCalMode, (v)=>saveSettings({ defaultCalMode:v })),
      chipSelect('Default export scope', [{key:'day',label:'Day'},{key:'week',label:'Week'},{key:'month',label:'Month'},{key:'all',label:'Everything'}],
        settings.defaultExportScope, (v)=>saveSettings({ defaultExportScope:v })),
      chipSelect('Round new ticket times to', [{key:1,label:'1 min'},{key:5,label:'5 min'},{key:10,label:'10 min'},{key:15,label:'15 min'},{key:30,label:'30 min'}],
        settings.timeRounding, (v)=>{ TIME_ROUNDING = v; saveSettings({ timeRounding:v }); }),

      settingsSection('Account'),
      e('div', { key:'acct', className:'settings-span-2 d-hover', style:{ background:SURF, border:'1px solid '+LINE, borderRadius:'16px', padding:'0.75rem 0.9rem',
        display:'flex', alignItems:'center', gap:'0.7rem' } },
        e('div', { style:{ flex:1, minWidth:0 } },
          e('div', { style:{ fontSize:'0.85rem', fontWeight:800, color:INK } }, 'Signed in'),
          e('div', { style:{ fontSize:'0.68rem', color:GREY, marginTop:'1px', overflow:'hidden', textOverflow:'ellipsis' } }, user && user.email)),
        e('button', { className:'d-hover-btn', onClick:signOutUser, style:{ padding:'0.5rem 0.9rem', borderRadius:'10px', border:'1px solid '+LINE,
          background:SURF2, color:INK, fontWeight:800, fontSize:'0.75rem', cursor:'pointer' } }, 'Sign out'))
    )
  );

  const themesView = e('div', { style:{ padding:'0.8rem 0.85rem 2.5rem', display:'flex', flexDirection:'column', gap:'0.9rem' } },
    e('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'0.1rem 0.15rem 0.3rem' } },
      e('button', { className:'d-hover-btn', onClick:()=>setThemesOpen(false), style:{ background:'none', border:'none', width:'36px', height:'36px',
        display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' } }, ChevronLeft(18, INK)),
      e('span', { style:{ fontSize:'0.9rem', fontWeight:900, letterSpacing:'-0.2px', color:INK } }, 'Themes'),
      e('span', { style:{ width:'36px' } })),
    ...THEME_GROUPS.map(group => e('div', { key:group.name, style:{ display:'flex', flexDirection:'column', gap:'0.55rem' } },
      e('div', { style:{ ...LBL, marginBottom:'0.1rem' } }, group.name),
      e('div', { className:'themes-desktop-grid', style:{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:'0.5rem' } },
        group.themes.map(theme => e('button', { key:theme.name, className:'d-hover', onClick:()=>{ applyTheme(theme); setThemesOpen(false); },
          style:{ display:'flex', flexDirection:'column', gap:'0.5rem', padding:'0.7rem', borderRadius:'14px',
            border: '1px solid '+LINE,
            background:SURF, cursor:'pointer', textAlign:'left' } },
          e('div', { style:{ display:'flex', gap:'4px', width:'100%' } },
            (theme.sites || []).map((hex,hi) => e('span', { key:hi, style:{
              flex:1, height:'22px', minWidth:0, borderRadius:'5px',
              background: hex, display:'block'
            } }))),
          e('span', { style:{ fontSize:'0.72rem', fontWeight:800, color:INK } }, theme.name)))
      )
    )));

  const backupsView = e('div', { style:{ padding:'0.8rem 0.85rem 2.5rem', display:'flex', flexDirection:'column', gap:'0.7rem' } },
    e('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'0.1rem 0.15rem 0.3rem' } },
      e('button', { onClick:()=>setBackupsOpen(false), style:{ background:'none', border:'none', width:'36px', height:'36px',
        display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' } }, ChevronLeft(18, INK)),
      e('span', { style:{ fontSize:'0.9rem', fontWeight:900, letterSpacing:'-0.2px' } }, 'Backups'),
      e('span', { style:{ width:'36px' } })),
    e('div', { style:{ fontSize:'0.72rem', color:GREY, fontWeight:600, padding:'0 0.15rem' } },
      'A dated snapshot is kept automatically once a day, for the last '+BACKUP_RETENTION+' days.'),
    backupsLoading
      ? e('div', { style:{ textAlign:'center', padding:'2rem 0', color:GREY, fontSize:'0.85rem' } }, 'Loading…')
      : backupsList.length === 0
        ? e('div', { style:{ textAlign:'center', padding:'2rem 0', color:GREY, fontSize:'0.85rem' } }, 'No backups yet')
        : e('div', { style:{ display:'flex', flexDirection:'column', gap:'0.5rem' } },
            backupsList.map(b => e('button', { key:b.id, onClick:()=>restoreBackup(b),
              style:{ width:'100%', textAlign:'left', display:'flex', alignItems:'center', justifyContent:'space-between',
                background:SURF, border:'1px solid '+LINE, borderRadius:'14px', padding:'0.75rem 0.9rem', cursor:'pointer' } },
              e('div', null,
                e('div', { style:{ fontSize:'0.85rem', fontWeight:800, color:INK } },
                  new Date(b.savedAt).toLocaleDateString('en-GB',{ weekday:'long', day:'numeric', month:'long' })),
                e('div', { style:{ fontSize:'0.68rem', color:GREY, marginTop:'1px' } }, (b.count||0)+' ticket(s)')),
              e('span', { style:{ fontSize:'0.72rem', color:MID, fontWeight:800 } }, 'Restore')))));


  if (user === undefined) return e('div', { style:{ padding:'4rem', textAlign:'center', color:GREY } }, 'Loading…');

  if (user === null) {
    return e(SignInScreen, { onSignIn:signIn, busy:authBusy, error:authError });
  }

  if (!ready) return e('div', { style:{ padding:'4rem', textAlign:'center', color:GREY } }, 'Loading…');

  if (backupsOpen) return e('div', { key:'backups', style:{ animation:'fadeInUp .42s cubic-bezier(.22,.9,.3,1) both' } }, backupsView);

  const navTo = (target) => {
    setSettingsOpen(false); setThemesOpen(false); setMenuOpen(false);
    if (target === 'settings') { setSettingsOpen(true); return; }
    if (target === 'list') { setView('list'); return; }
    setView('month');
    if (window.matchMedia && window.matchMedia('(min-width: 900px)').matches) setCalMode('month');
  };

  const desktopSidebar = e('div', { className: 'desktop-only desktop-sidebar' },
    e('div', { style:{ display:'flex', alignItems:'center', gap:'0.55rem', padding:'0.35rem 0.85rem 1.25rem' } },
      e('img', { src:'icon-180.png', alt:'', width:32, height:32,
        style:{ width:'32px', height:'32px', borderRadius:'9px', display:'block' } }),
      e('span', { style:{ fontWeight:900, fontSize:'1.05rem', letterSpacing:'-0.3px' } }, 'Tickets')),
    e('button', { className: 'nav-item' + (view !== 'list' && view !== 'form' && !settingsOpen ? ' active' : ''),
      onClick: () => navTo('calendar') },
      e('span', null, '📅'), 'Calendar'),
    e('button', { className: 'nav-item' + (view === 'list' && !settingsOpen ? ' active' : ''),
      onClick: () => navTo('list') },
      e('span', null, '☰'), 'All tickets'),
    e('button', { className: 'nav-item' + (settingsOpen ? ' active' : ''),
      onClick: () => navTo('settings') },
      e('span', null, '⚙'), 'Settings'),
    e('div', { style:{ flex:1 } }),
    e('div', { style:{ padding:'0.5rem 0.85rem', fontSize:'0.72rem', color:'rgba(255,255,255,0.45)', overflow:'hidden', textOverflow:'ellipsis' } },
      user && user.email ? user.email : ''),
    e('button', { className: 'nav-item', onClick: signOutUser, style:{ color:'rgba(255,255,255,0.55)' } },
      e('span', null, '↪'), 'Sign out')
  );

  const desktopTopbar = e('div', { className: 'desktop-only desktop-topbar' },
    e('input', {
      type: 'search',
      value: view === 'list' ? query : menuSearch,
      placeholder: 'Search tickets…',
      onChange: (ev) => {
        const v = ev.target.value;
        if (view === 'list') setQuery(v);
        else { setMenuSearch(v); if (v.trim()) { setView('list'); setQuery(v); } }
      },
      style: {
        flex: 1, maxWidth: '420px', padding: '0.65rem 1rem', borderRadius: '12px',
        border: '1px solid ' + LINE, background: FIELDBG, color: INK, fontSize: '0.9rem', outline: 'none'
      }
    }),
    e('div', { style:{ flex:1 } }),
    e('button', {
      className: 'd-hover-btn',
      onClick: () => openNew(null, view === 'list' ? { view:'list' } : null),
      style: {
        display: 'flex', alignItems: 'center', gap: '0.4rem',
        padding: '0.65rem 1.1rem', borderRadius: '12px', border: 'none',
        background: INK, color: DARK_MODE ? '#0A0A0C' : APRICOT, fontWeight: 800, fontSize: '0.88rem', cursor: 'pointer'
      }
    }, e('span', { style:{ fontSize:'1.1rem', lineHeight:1 } }, '+'), 'New ticket')
  );

  if (settingsOpen) {
    const pane = themesOpen ? themesView : settingsView;
    const settingsBody = e('div', { key: themesOpen ? 'themes' : 'settings', style:{ animation:'fadeInUp .42s cubic-bezier(.22,.9,.3,1) both' } }, pane);
    return e('div', { className: 'desktop-shell' },
      desktopSidebar,
      e('div', { className: 'desktop-main desktop-only', style:{ flex:1, minWidth:0, display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden', background:PAGE_BG } },
        desktopTopbar,
        e('div', { className: 'desktop-content', style:{ flex:1, overflow:'auto', padding:'1.25rem 1.35rem 1.5rem' } }, settingsBody)
      ),
      e('div', { className: 'mobile-only', style:{ width:'100%', minHeight:'100vh', overflow:'auto' } },
        header, settingsBody, menu, chooserSheet, formSheet, fab)
    );
  }

  const rawBody = view === 'form' ? formView : view === 'list' ? listView : monthView;
  const body = e('div', { key:view, style:{ animation:'fadeInUp .42s cubic-bezier(.22,.9,.3,1) both' } }, rawBody);

  /* Desktop: month calendar left + selected day tickets right (no week/day modes) */
  const desktopCalSplit = view === 'month' && e('div', { className: 'desktop-split' },
    e('div', { className: 'desktop-panel' },
      e('div', { style:{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'0.85rem' } },
        e('button', { className:'d-hover-btn', onClick:()=>shift(-1), style:{ background:SURF2, border:'1px solid '+LINE, borderRadius:'10px', cursor:'pointer', padding:'6px 8px' } }, ChevronLeft(18, INK)),
        e('button', { className:'d-hover-btn', onClick:goToday, style:{ background:'none', border:'none', cursor:'pointer', flex:1, textAlign:'center' } },
          e('span', { style:{ fontSize:'1.08rem', fontWeight:900, color:INK } },
            anchorDate.toLocaleDateString('en-GB',{ month:'long' })),
          e('span', { style:{ fontSize:'1.08rem', fontWeight:400, color:GREY, marginLeft:'0.3rem' } }, String(anchorDate.getFullYear()))),
        e('button', { className:'d-hover-btn', onClick:()=>shift(1), style:{ background:SURF2, border:'1px solid '+LINE, borderRadius:'10px', cursor:'pointer', padding:'6px 8px', transform:'rotate(180deg)' } }, ChevronLeft(18, INK))),
      monthGrid
    ),
    e('div', { className: 'desktop-panel' },
      e('div', { style:{ fontSize:'1.05rem', fontWeight:900, color:INK, marginBottom:'0.3rem' } },
        anchorDate.toLocaleDateString('en-GB',{ weekday:'long', day:'numeric', month:'long' })),
      e('div', { style:{ fontSize:'0.75rem', color:GREY, fontWeight:700, marginBottom:'0.85rem' } },
        dv.list.length + (dv.list.length===1?' ticket':' tickets')),
      dv.list.length > 0 && e('div', { style:{ background:SURF2, borderRadius:'12px', padding:'0.55rem 0.7rem', marginBottom:'0.75rem' } },
        siteSeqRow(dv.siteSequence)),
      dv.list.length === 0
        ? e('div', { style:{ fontSize:'0.85rem', color:GREY, textAlign:'center', padding:'2rem 0' } }, 'Nothing logged on this day')
        : e('div', { style:{ display:'flex', flexDirection:'column', gap:'0.65rem' } },
            dv.list.map((j,i) => swipeCard(j, i, { view:'month', day:anchorDate.getDate() }, i)))
    )
  );

  const desktopBody = view === 'form' ? formView
    : view === 'list' ? listView
    : desktopCalSplit;

  return e('div', { className: 'desktop-shell' },
    desktopSidebar,
    e('div', { className: 'desktop-main desktop-only', style:{ flex:1, minWidth:0, display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden', background:PAGE_BG } },
      desktopTopbar,
      e('div', { className: 'desktop-content', style:{ flex:1, overflow:'auto', padding:'1.25rem 1.35rem 1.5rem' } },
        e('div', { key: 'd-'+view, style:{ animation:'fadeInUp .32s cubic-bezier(.22,.9,.3,1) both' } }, desktopBody)
      )
    ),
    e('div', { className: 'mobile-only', style:{ width:'100%' } },
      header, body, menu, chooserSheet, formSheet, swipeHint, fab
    ),
    /* sheets available on desktop too for export chooser etc */
    e('div', { className: 'desktop-only' }, chooserSheet, formSheet)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
