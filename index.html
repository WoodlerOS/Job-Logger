<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Logger</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function JobLogger() {
            const [jobs, setJobs] = useState([]);
            const [showNewCard, setShowNewCard] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                ticketNumber: '',
                startDateTime: '',
                finishDateTime: '',
                workDone: '',
                partsUsed: ''
            });
            const [expandedMonth, setExpandedMonth] = useState(null);
            const [touchStart, setTouchStart] = useState(0);

            // Load jobs from localStorage
            useEffect(() => {
                try {
                    const saved = localStorage.getItem('jobsData');
                    if (saved) {
                        setJobs(JSON.parse(saved));
                    }
                } catch (error) {
                    console.log('No saved jobs');
                }
            }, []);

            const initializeForm = () => {
                const now = new Date();
                const isoDateTime = now.toISOString().slice(0, 16);
                setFormData({
                    ticketNumber: '',
                    startDateTime: isoDateTime,
                    finishDateTime: isoDateTime,
                    workDone: '',
                    partsUsed: ''
                });
            };

            const handleNewJob = () => {
                initializeForm();
                setEditingId(null);
                setShowNewCard(true);
            };

            const handleEditJob = (job) => {
                setFormData(job);
                setEditingId(job.id);
                setShowNewCard(true);
            };

            const handleSave = () => {
                if (!formData.ticketNumber.trim()) {
                    alert('Please enter a ticket number');
                    return;
                }

                let updatedJobs;
                if (editingId) {
                    updatedJobs = jobs.map(job => 
                        job.id === editingId ? { ...formData, id: editingId } : job
                    );
                } else {
                    updatedJobs = [{ ...formData, id: Date.now() }, ...jobs];
                }

                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
                setShowNewCard(false);
                setFormData({
                    ticketNumber: '',
                    startDateTime: '',
                    finishDateTime: '',
                    workDone: '',
                    partsUsed: ''
                });
            };

            const handleDelete = (id) => {
                const updatedJobs = jobs.filter(job => job.id !== id);
                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
            };

            const handleTouchStart = (e) => {
                setTouchStart(e.touches[0].clientX);
            };

            const handleTouchEnd = (e) => {
                if (!touchStart) return;
                const touchEnd = e.changedTouches[0].clientX;
                if (touchStart - touchEnd > 50) {
                    handleSave();
                }
            };

            const formatDate = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                });
            };

            const formatDateTime = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                }) + ' ' + date.toLocaleTimeString('en-GB', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            };

            const groupJobsByMonth = () => {
                const grouped = {};
                jobs.forEach(job => {
                    const date = new Date(job.startDateTime);
                    const monthKey = date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                    if (!grouped[monthKey]) {
                        grouped[monthKey] = [];
                    }
                    grouped[monthKey].push(job);
                });
                return grouped;
            };

            const groupedJobs = groupJobsByMonth();
            const monthKeys = Object.keys(groupedJobs).sort((a, b) => {
                const dateA = new Date(groupedJobs[a][0].startDateTime);
                const dateB = new Date(groupedJobs[b][0].startDateTime);
                return dateB - dateA;
            });

            return (
                <div className="min-h-screen bg-gradient-to-b from-slate-50 to-slate-100">
                    {/* Header */}
                    <div className="sticky top-0 bg-white border-b border-slate-200 px-4 py-4 shadow-sm z-10">
                        <div className="flex items-center justify-between">
                            <h1 className="text-2xl font-bold text-slate-900">Job Log</h1>
                            {!showNewCard && (
                                <button
                                    onClick={handleNewJob}
                                    className="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700"
                                >
                                    + New Job
                                </button>
                            )}
                        </div>
                    </div>

                    {/* New Job Card */}
                    {showNewCard && (
                        <div 
                            onTouchStart={handleTouchStart}
                            onTouchEnd={handleTouchEnd}
                            className="mx-4 mt-6 p-6 bg-white rounded-xl shadow-lg border-2 border-blue-200"
                        >
                            <p className="text-xs text-slate-500 mb-4 text-center">Swipe left to save or use Save button</p>

                            <div className="mb-5">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Ticket Number</label>
                                <input
                                    type="text"
                                    value={formData.ticketNumber}
                                    onChange={(e) => setFormData({ ...formData, ticketNumber: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="Enter ticket number"
                                />
                            </div>

                            <div className="mb-5">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Start Date & Time</label>
                                <input
                                    type="datetime-local"
                                    value={formData.startDateTime}
                                    onChange={(e) => setFormData({ ...formData, startDateTime: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                            </div>

                            <div className="mb-5">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Finish Date & Time</label>
                                <input
                                    type="datetime-local"
                                    value={formData.finishDateTime}
                                    onChange={(e) => setFormData({ ...formData, finishDateTime: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                            </div>

                            <div className="mb-5">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Work Done</label>
                                <textarea
                                    value={formData.workDone}
                                    onChange={(e) => setFormData({ ...formData, workDone: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none min-h-32 resize-none"
                                    placeholder="Detailed notes about work completed..."
                                />
                            </div>

                            <div className="mb-6">
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Parts Used</label>
                                <textarea
                                    value={formData.partsUsed}
                                    onChange={(e) => setFormData({ ...formData, partsUsed: e.target.value })}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none min-h-24 resize-none"
                                    placeholder="List of parts used..."
                                />
                            </div>

                            <div className="flex gap-3">
                                <button
                                    onClick={handleSave}
                                    className="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700"
                                >
                                    Save Job
                                </button>
                                <button
                                    onClick={() => setShowNewCard(false)}
                                    className="flex-1 bg-slate-200 text-slate-700 py-3 rounded-lg font-semibold hover:bg-slate-300"
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Jobs List */}
                    {!showNewCard && (
                        <div className="pb-8">
                            {monthKeys.length === 0 ? (
                                <div className="text-center py-16 px-4">
                                    <p className="text-slate-500 text-lg mb-4">No jobs logged yet</p>
                                    <button
                                        onClick={handleNewJob}
                                        className="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700"
                                    >
                                        Log Your First Job
                                    </button>
                                </div>
                            ) : (
                                monthKeys.map(monthKey => (
                                    <div key={monthKey} className="mb-6">
                                        <button
                                            onClick={() => setExpandedMonth(expandedMonth === monthKey ? null : monthKey)}
                                            className="w-full mx-4 flex items-center justify-between px-4 py-3 bg-slate-200 rounded-lg font-semibold text-slate-700 hover:bg-slate-300"
                                        >
                                            <span>{monthKey}</span>
                                            <span>{expandedMonth === monthKey ? '▼' : '▶'}</span>
                                        </button>

                                        {expandedMonth === monthKey && (
                                            <div className="mt-3 mx-4 space-y-2">
                                                {groupedJobs[monthKey].map(job => (
                                                    <div
                                                        key={job.id}
                                                        onClick={() => handleEditJob(job)}
                                                        className="p-4 bg-white rounded-lg border border-slate-200 shadow-sm hover:shadow-md cursor-pointer"
                                                    >
                                                        <div className="flex justify-between items-start mb-2">
                                                            <div className="flex-1">
                                                                <p className="font-semibold text-slate-900">
                                                                    {formatDate(job.startDateTime)} - {job.ticketNumber}
                                                                </p>
                                                                <p className="text-xs text-slate-500 mt-1">
                                                                    {formatDateTime(job.startDateTime)} to {formatDateTime(job.finishDateTime)}
                                                                </p>
                                                            </div>
                                                            <button
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    if (window.confirm('Delete this job?')) {
                                                                        handleDelete(job.id);
                                                                    }
                                                                }}
                                                                className="ml-3 p-2 text-red-500 hover:bg-red-50 rounded-lg"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </div>
                                                        {job.workDone && (
                                                            <p className="text-sm text-slate-600 mb-2 line-clamp-2">{job.workDone}</p>
                                                        )}
                                                        {job.partsUsed && (
                                                            <p className="text-xs text-slate-500">Parts: {job.partsUsed.split('\n')[0]}</p>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<JobLogger />);
    </script>
</body>
</html>
