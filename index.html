<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Job Logger</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }
        body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100vh;
        }
        #root {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SITES = {
            NX: { label: 'NX', color: 'bg-blue-500', textColor: 'text-blue-600' },
            WS: { label: 'WS', color: 'bg-green-500', textColor: 'text-green-600' },
            RH: { label: 'RH', color: 'bg-red-500', textColor: 'text-red-600' },
            MMUH: { label: 'MMUH', color: 'bg-purple-500', textColor: 'text-purple-600' }
        };

        function JobLogger() {
            const [jobs, setJobs] = useState([]);
            const [showNewCard, setShowNewCard] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({
                ticketNumber: '',
                startDateTime: '',
                finishDateTime: '',
                workDone: '',
                parts: [{ partNumber: '', partDescription: '' }],
                site: ''
            });
            const [expandedMonth, setExpandedMonth] = useState(null);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('jobsData');
                    if (saved) {
                        setJobs(JSON.parse(saved));
                    }
                } catch (error) {
                    console.log('No saved jobs');
                }
            }, []);

            const initializeForm = () => {
                const now = new Date();
                const isoDateTime = now.toISOString().slice(0, 16);
                setFormData({
                    ticketNumber: '',
                    startDateTime: isoDateTime,
                    finishDateTime: isoDateTime,
                    workDone: '',
                    parts: [{ partNumber: '', partDescription: '' }],
                    site: ''
                });
            };

            const handleNewJob = () => {
                initializeForm();
                setEditingId(null);
                setShowNewCard(true);
            };

            const handleEditJob = (job) => {
                setFormData({
                    ...job,
                    parts: job.parts || [{ partNumber: '', partDescription: '' }]
                });
                setEditingId(job.id);
                setShowNewCard(true);
            };

            const handleSave = () => {
                if (!formData.ticketNumber.trim()) {
                    alert('Please enter a ticket number');
                    return;
                }

                let updatedJobs;
                if (editingId) {
                    updatedJobs = jobs.map(job => 
                        job.id === editingId ? { ...formData, id: editingId } : job
                    );
                } else {
                    updatedJobs = [{ ...formData, id: Date.now() }, ...jobs];
                }

                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
                setShowNewCard(false);
                initializeForm();
            };

            const handleDelete = (id) => {
                const updatedJobs = jobs.filter(job => job.id !== id);
                setJobs(updatedJobs);
                localStorage.setItem('jobsData', JSON.stringify(updatedJobs));
            };

            const handlePartChange = (index, field, value) => {
                const newParts = [...formData.parts];
                newParts[index][field] = value;
                
                if (field === 'partDescription' && value.trim() && index === newParts.length - 1) {
                    newParts.push({ partNumber: '', partDescription: '' });
                }
                
                setFormData({ ...formData, parts: newParts });
            };

            const handlePartKeyPress = (index, field, e) => {
                if (e.key === 'Enter' && field === 'partDescription') {
                    const newParts = [...formData.parts];
                    if (formData.parts[index].partNumber.trim() && formData.parts[index].partDescription.trim()) {
                        if (index === newParts.length - 1) {
                            newParts.push({ partNumber: '', partDescription: '' });
                            setFormData({ ...formData, parts: newParts });
                        }
                    }
                }
            };

            const handleBackupData = () => {
                const backupData = {
                    exportDate: new Date().toISOString(),
                    jobs: jobs,
                    totalJobs: jobs.length
                };
                
                const dataStr = JSON.stringify(backupData, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `job-logger-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                alert(`Backup created! ${jobs.length} jobs saved.`);
            };

            const formatDate = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                });
            };

            const formatDateOnly = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            };

            const formatDateTime = (dateTimeString) => {
                if (!dateTimeString) return '';
                const date = new Date(dateTimeString);
                return date.toLocaleDateString('en-GB', { 
                    weekday: 'short', 
                    year: '2-digit', 
                    month: '2-digit', 
                    day: '2-digit' 
                }) + ' ' + date.toLocaleTimeString('en-GB', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            };

            const groupJobsByMonth = () => {
                const grouped = {};
                jobs.forEach(job => {
                    const date = new Date(job.startDateTime);
                    const monthKey = date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
                    if (!grouped[monthKey]) {
                        grouped[monthKey] = [];
                    }
                    grouped[monthKey].push(job);
                });
                return grouped;
            };

            const groupedJobs = groupJobsByMonth();
            const monthKeys = Object.keys(groupedJobs).sort((a, b) => {
                const dateA = new Date(groupedJobs[a][0].startDateTime);
                const dateB = new Date(groupedJobs[b][0].startDateTime);
                return dateB - dateA;
            });

            return (
                <div className="w-full h-full bg-gradient-to-br from-slate-50 via-white to-slate-100 flex flex-col">
                    {/* Header */}
                    <div className="bg-white border-b border-slate-100 px-4 py-5 shadow-sm flex-shrink-0">
                        <div className="flex items-center justify-between gap-3">
                            <h1 className="text-3xl font-bold text-slate-900">Logger</h1>
                            <div className="flex gap-2">
                                {!showNewCard && (
                                    <button
                                        onClick={handleBackupData}
                                        className="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-4 py-2.5 rounded-full font-semibold text-sm hover:from-emerald-600 hover:to-teal-600 shadow-md active:shadow-lg transition-all"
                                        title="Backup all jobs"
                                    >
                                        💾
                                    </button>
                                )}
                                {!showNewCard && (
