<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const e = React.createElement;

const SEED = [

];

const SITES = {
  NX:   { label:'NX',   hex:'#C97A00', tint:'#FBF1DF' },
  WS:   { label:'WS',   hex:'#C81D6B', tint:'#FCE7F0' },
  RH:   { label:'RH',   hex:'#00857A', tint:'#DDF2F0' },
  MMUH: { label:'MMUH', hex:'#6941C6', tint:'#EDE7FB' }
};
const EQUIP = { C:'Alinity C', I:'Alinity I', SCM:'Alinity SCM', GLP:'GLP track' };

const INK='#1C1C1E', MID='#6E6E73', GREY='#8E8E93', LINE='#E5E5EA';
const TRAVEL='#3A6FD8', TRAVELBG='#EEF4FF', GREEN='#34C759', BLUE='#007AFF', RED='#FF3B30';

const LBL   = { display:'block', fontSize:'0.6rem', fontWeight:800, color:GREY, textTransform:'uppercase', letterSpacing:'0.6px' };
const FIELD = { width:'100%', minWidth:0, padding:'0.7rem 0.8rem', border:'1.5px solid '+LINE, borderRadius:'14px', outline:'none', fontSize:'0.95rem', background:'#FAFAFC', color:INK };
const TXTBTN = { background:'none', border:'none', fontSize:'0.85rem', fontWeight:700, padding:'6px 2px', cursor:'pointer', color:GREY };

const DB_NAME='ticketsDB', STORE='kv', KEY='jobs';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function dbGet(k){try{const db=await openDB();return await new Promise((res,rej)=>{
  const r=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
  r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error);});}catch(err){return null;}}
async function dbSet(k,v){try{const db=await openDB();await new Promise((res,rej)=>{
  const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(v,k);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});return true;}catch(err){return false;}}

const pad = (n) => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const addDayISO = (iso, n) => { const d=new Date(iso+'T00:00'); d.setDate(d.getDate()+(n||1));
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const roundNow = () => { const d=new Date(); d.setMinutes(Math.floor(d.getMinutes()/5)*5);
  return pad(d.getHours())+':'+pad(d.getMinutes()); };
const shiftTime = (t, h) => { if (!t) return ''; const p=t.split(':');
  return pad((Number(p[0])+h+24)%24)+':'+p[1]; };

function App() {
  const [jobs, setJobs] = useState([]);
  const [ready, setReady] = useState(false);
  const [view, setView] = useState('month');
  const [editingId, setEditingId] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [form, setForm] = useState(blank());

  const [query, setQuery] = useState('');
  const [siteFilter, setSiteFilter] = useState([]);
  const [equipFilter, setEquipFilter] = useState([]);
  const [showFilters, setShowFilters] = useState(false);

  const [statMonth, setStatMonth] = useState(() => { const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [statMode, setStatMode] = useState('calendar');
  const [dayDetail, setDayDetail] = useState(null);

  function blank(date) {
    const s = roundNow();
    return { ticketNumber:'', site:'', equipment:[], date: date || todayISO(),
      t1:'', start:s, finish:shiftTime(s,1), t2:'', extra:[], workDone:'', parts:[] };
  }

  useEffect(() => { (async () => {
    let data = await dbGet(KEY);
    if (!data) { try { const s = localStorage.getItem('jobsData'); if (s) data = JSON.parse(s); } catch (err) {} }
    if (!Array.isArray(data) || data.length === 0) {
      data = SEED.slice();
      await dbSet(KEY, data);
      try { localStorage.setItem('jobsData', JSON.stringify(data)); } catch (err) {}
    }
    setJobs(data.map(j => ({ equipment:[], parts:[], extraDays:[], ...j })));
    setReady(true);
  })(); }, []);

  const persist = async (next) => {
    setJobs(next); await dbSet(KEY, next);
    try { localStorage.setItem('jobsData', JSON.stringify(next)); } catch (err) {}
  };

  const fmtDate  = (s) => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
  const fmtDay   = (s) => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : '';
  const fmtTime  = (s) => s ? new Date(s).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  const stamp = () => { const d=new Date();
    return pad(d.getFullYear()%100)+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };

  const mins = (a,b) => { if (!a||!b) return 0; const m = Math.round((new Date(b)-new Date(a))/60000); return (isNaN(m)||m<0)?0:m; };
  const hm = (m) => m >= 60 ? Math.floor(m/60)+'h '+(m%60?pad(m%60)+'m':'') : m+'m';
  const eqOf = (j) => Array.isArray(j.equipment) ? j.equipment : [];
  const exOf = (j) => Array.isArray(j.extraDays) ? j.extraDays : [];

  const composeTimes = (date, arr) => {
    let d = date, last = null;
    return arr.map(t => {
      if (!t) return null;
      if (last && t < last) d = addDayISO(d,1);
      last = t;
      return d + 'T' + t;
    });
  };

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return jobs.filter(j => {
      if (siteFilter.length && !siteFilter.includes(j.site)) return false;
      if (equipFilter.length && !eqOf(j).some(x => equipFilter.includes(x))) return false;
      if (!q) return true;
      const hay = [ j.ticketNumber, j.workDone, SITES[j.site]?SITES[j.site].label:'',
        ...eqOf(j).map(x => EQUIP[x] ? EQUIP[x]+' '+x : x),
        ...(j.parts||[]).map(p => (p.partNumber||'')+' '+(p.partDescription||'')) ].join(' ').toLowerCase();
      return hay.includes(q);
    }).sort((a,b) => new Date(b.startDateTime) - new Date(a.startDateTime));
  }, [jobs, query, siteFilter, equipFilter]);

  const partHistory = useMemo(() => {
    const set = new Map();
    jobs.forEach(j => (j.parts||[]).forEach(p => {
      if (p.partNumber && p.partNumber.trim()) set.set(p.partNumber.trim(), p.partDescription||'');
    }));
    return [...set.entries()];
  }, [jobs]);

  const ms = useMemo(() => {
    const y = statMonth.getFullYear(), m = statMonth.getMonth();
    const src = jobs.filter(j => {
      const d = new Date(j.startDateTime);
      return d.getFullYear() === y && d.getMonth() === m;
    });
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = {}, siteDays = {}, siteTickets = {}, equipTickets = {}, equipDays = {};

    src.forEach(j => {
      const dnum = new Date(j.startDateTime).getDate();
      (days[dnum] = days[dnum] || { tickets:[] }).tickets.push(j);
      if (j.site) siteTickets[j.site] = (siteTickets[j.site]||0) + 1;
      eqOf(j).forEach(x => { equipTickets[x] = (equipTickets[x]||0) + 1; });
    });
    Object.keys(days).forEach(d => {
      const day = days[d];
      day.tickets.sort((a,b) => new Date(a.startDateTime) - new Date(b.startDateTime));
      const seq = [];
      day.tickets.forEach(j => { if (j.site && seq[seq.length-1] !== j.site) seq.push(j.site); });
      day.siteSequence = seq;
      day.sites = new Set(day.tickets.map(j=>j.site).filter(Boolean));
      day.equip = new Set(day.tickets.flatMap(eqOf));
      day.first = day.tickets[0].hasTravel && day.tickets[0].travelDateTime ? day.tickets[0].travelDateTime : day.tickets[0].startDateTime;
      const lastJob = day.tickets[day.tickets.length-1];
      day.last = lastJob.hasTravel2 && lastJob.travel2DateTime ? lastJob.travel2DateTime : lastJob.finishDateTime;
      day.sites.forEach(s => { siteDays[s] = (siteDays[s]||0) + 1; });
      day.equip.forEach(x => { equipDays[x] = (equipDays[x]||0) + 1; });
    });
    return { y, m, src, days, daysInMonth, firstDow, siteDays, siteTickets, equipTickets, equipDays };
  }, [jobs, statMonth]);

  const buildXlsxBlob = (rowsSrc) => {
    const rows = [['Ticket','Site','Machine','Date','Travel 1','Start','Finish','Travel 2','On site','Travel mins','Extra days','Work Done','Parts Used']];
    [...rowsSrc].sort((a,b)=>new Date(a.startDateTime)-new Date(b.startDateTime)).forEach(j => {
      const parts = (j.parts||[]).filter(p=>p.partNumber||p.partDescription)
        .map(p => (p.partNumber||'').trim() + (p.partDescription ? ' — '+p.partDescription.trim() : '')).join(' | ');
      let on = mins(j.startDateTime, j.finishDateTime);
      let tr = (j.hasTravel ? mins(j.travelDateTime, j.startDateTime) : 0)
             + (j.hasTravel2 ? mins(j.finishDateTime, j.travel2DateTime) : 0);
      const ex = exOf(j).map(d => {
        on += mins(d.startDateTime, d.finishDateTime);
        tr += (d.hasTravel ? mins(d.travelDateTime, d.startDateTime) : 0)
            + (d.hasTravel2 ? mins(d.finishDateTime, d.travel2DateTime) : 0);
        return fmtDay(d.startDateTime)+' '+fmtTime(d.startDateTime)+'–'+fmtTime(d.finishDateTime);
      }).join(' | ');
      rows.push([ j.ticketNumber, SITES[j.site]?SITES[j.site].label:'', eqOf(j).map(x=>EQUIP[x]||x).join(', '),
        fmtDate(j.startDateTime),
        j.hasTravel?fmtTime(j.travelDateTime):'', fmtTime(j.startDateTime), fmtTime(j.finishDateTime),
        j.hasTravel2?fmtTime(j.travel2DateTime):'', on?hm(on):'', tr||'', ex,
        (j.workDone||'').replace(/\r?\n/g,' '), parts ]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:16},{wch:8},{wch:14},{wch:12},{wch:9},{wch:8},{wch:8},{wch:9},{wch:10},{wch:11},{wch:26},{wch:60},{wch:40}];
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:rowsSrc.length,c:12} }) };
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Tickets');
    return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],
      { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  };

  const download = (blob, name) => {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  };
  const shareFiles = async (files) => {
    try { if (navigator.canShare && navigator.canShare({files})) { await navigator.share({files,title:'Tickets'}); return true; } }
    catch (err) { if (err && err.name==='AbortError') return true; }
    return false;
  };

  const doSpreadsheet = async (scope) => {
    const src = scope === 'month' ? ms.src : (scope === 'filtered' ? filtered : jobs);
    if (!src.length) { alert('Nothing to export.'); return; }
    if (typeof XLSX === 'undefined') { alert('Still loading — try again in a moment.'); return; }
    const suffix = scope === 'month' ? ' ' + statMonth.toLocaleDateString('en-GB',{month:'short',year:'numeric'})
                 : (scope === 'filtered' ? ' (filtered)' : '');
    const name = stamp()+' App tickets'+suffix+'.xlsx';
    const blob = buildXlsxBlob(src);
    if (!(await shareFiles([new File([blob],name,{type:blob.type})]))) download(blob,name);
    setMenuOpen(false);
  };

  const doBackup = async () => {
    if (!jobs.length) { alert('Nothing to back up.'); return; }
    const name = stamp()+' App tickets backup.json';
    const blob = new Blob([JSON.stringify({ app:'tickets', version:5, exported:new Date().toISOString(), jobs }, null, 2)], { type:'application/json' });
    if (!(await shareFiles([new File([blob],name,{type:'application/json'})]))) download(blob,name);
    setMenuOpen(false);
  };

  const doCopyBackup = async () => {
    if (!jobs.length) { alert('Nothing to back up.'); return; }
    const txt = JSON.stringify({ app:'tickets', version:5, exported:new Date().toISOString(), jobs });
    try { await navigator.clipboard.writeText(txt);
      alert('Backup copied ('+txt.length+' characters).\n\nPaste it into a personal note or email to yourself.'); }
    catch (err) { alert('Copy failed — clipboard access blocked.'); }
    setMenuOpen(false);
  };

  const applyRestore = async (raw) => {
    try {
      const parsed = JSON.parse(raw);
      const list = Array.isArray(parsed) ? parsed : parsed.jobs;
      if (!Array.isArray(list)) throw new Error('bad');
      const merged = list.map(j => ({ equipment:[], parts:[], extraDays:[], ...j }));
      const seen = new Set(merged.map(j=>j.id));
      jobs.forEach(j => { if (!seen.has(j.id)) merged.push(j); });
      merged.sort((a,b)=>new Date(b.startDateTime)-new Date(a.startDateTime));
      await persist(merged); setMenuOpen(false);
      alert('Restored. Total now '+merged.length+' tickets.');
    } catch (err) { alert('That was not readable backup text.'); }
  };

  const doPasteRestore = () => {
    const raw = window.prompt('Paste your backup text here:');
    if (raw && raw.trim()) applyRestore(raw.trim());
  };

  const doRestore = () => {
    const input = document.getElementById('restoreInput'); input.value='';
    input.onchange = () => {
      const file = input.files && input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => applyRestore(reader.result);
      reader.onerror = () => alert('Could not read that file.');
      reader.readAsText(file);
    };
    input.click();
  };

  const doCopyMonth = async () => {
    if (!ms.src.length) { alert('Nothing to copy.'); return; }
    const byDay = Object.keys(ms.days).map(Number).sort((a,b)=>a-b);
    const text = byDay.map(dnum => {
      const d = ms.days[dnum];
      const head = new Date(ms.y, ms.m, dnum).toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'})
        + '  ' + d.siteSequence.map(s=>SITES[s].label).join(' → ');
      const body = d.tickets.map(j => {
        const p = (j.parts||[]).filter(x=>x.partNumber||x.partDescription)
          .map(x => (x.partNumber||'')+(x.partDescription?' — '+x.partDescription:'')).join(', ');
        const ex = exOf(j).map(x => fmtDay(x.startDateTime)+' '+fmtTime(x.startDateTime)+'–'+fmtTime(x.finishDateTime)).join(', ');
        return '  • ' + j.ticketNumber + (eqOf(j).length?' ('+eqOf(j).join(', ')+')':'') + '  '
          + fmtTime(j.startDateTime)+'–'+fmtTime(j.finishDateTime)
          + (ex?'\n    Also: '+ex:'')
          + (j.workDone?'\n    '+j.workDone.replace(/\n/g,' '):'')
          + (p?'\n    Parts: '+p:'');
      }).join('\n');
      return head + '\n' + body;
    }).join('\n\n');
    try { await navigator.clipboard.writeText(text); alert('Copied '+ms.src.length+' ticket(s).'); }
    catch (err) { alert('Copy failed — clipboard access blocked.'); }
    setMenuOpen(false);
  };

  const doClear = async () => {
    if (!window.confirm('Delete ALL tickets? Make a backup first.')) return;
    if (!window.confirm('Really delete everything?')) return;
    await persist([]); setMenuOpen(false);
  };

  const openNew = (date) => { setForm(blank(date)); setEditingId(null); setDayDetail(null); setView('form'); window.scrollTo(0,0); };

  const openEdit = (j) => {
    setForm({
      ticketNumber: j.ticketNumber || '',
      site: j.site || '',
      equipment: eqOf(j),
      date: (j.startDateTime||'').slice(0,10) || todayISO(),
      t1: j.hasTravel && j.travelDateTime ? j.travelDateTime.slice(11,16) : '',
      start: (j.startDateTime||'').slice(11,16),

          return e('button', { key:k, onClick:()=>setSiteFilter(on ? siteFilter.filter(x=>x!==k) : [...siteFilter, k]),
            style:{ padding:'0.4rem 0.85rem', borderRadius:'999px', fontSize:'0.78rem', fontWeight:700, cursor:'pointer', flexShrink:0,
              border:'1.5px solid '+(on?s.hex:LINE), background: on?s.hex:'#FFF', color: on?'#FFF':'#3A3A3C' } }, s.label);
        })),
      e('div', { className:'chips', style:{ display:'flex', gap:'0.4rem', overflowX:'auto' } },
        Object.keys(EQUIP).map(k => {
          const on = equipFilter.includes(k);
          return e('button', { key:k, onClick:()=>setEquipFilter(on ? equipFilter.filter(x=>x!==k) : [...equipFilter, k]),
            style:{ padding:'0.4rem 0.85rem', borderRadius:'999px', fontSize:'0.78rem', fontWeight:700, cursor:'pointer', flexShrink:0,
              border:'1.5px solid '+(on?INK:LINE), background: on?INK:'#FFF', color: on?'#FFF':'#3A3A3C' } }, k);
        })),
      (siteFilter.length || equipFilter.length || query) && e('button', { onClick:()=>{ setQuery(''); setSiteFilter([]); setEquipFilter([]); },
        style:{ padding:'0.5rem', borderRadius:'999px', border:'none', background:'#F7F7FA', color:RED, fontWeight:800, fontSize:'0.78rem', cursor:'pointer' } }, 'Clear filters')),

    e('div', { style:{ fontSize:'0.7rem', color:GREY, fontWeight:600, paddingLeft:'0.4rem' } },
      filtered.length + ' of ' + jobs.length + ' tickets'),

    filtered.length === 0
      ? e('div', { style:{ textAlign:'center', padding:'2.5rem 1rem', color:GREY, fontSize:'0.9rem' } }, 'Nothing matches')
      : e('div', { style:{ display:'flex', flexDirection:'column', gap:'0.55rem' } }, filtered.map(ticketCard)));

  const dotEl = (colour, size) => e('span', { style:{ width:size+'px', height:size+'px', borderRadius:'999px',
    background:'#FFF', border:'3px solid '+colour, display:'block', flexShrink:0 } });

  const buildSpine = (d, update, prefix) => {
    const legMins = (a, b) => { if (!a || !b) return 0; const c = composeTimes(d.date, [a, b]); return mins(c[0], c[1]); };
    const rows = [];

    const bigRow = (key, time, field, label, colour, dateEl) =>
      e('div', { key:key, style:{ display:'flex', alignItems:'center', gap:'0.6rem' } },
        e('div', { style:{ width:'82px', flexShrink:0 } },
          e('input', { type:'time', value:time, onChange:(ev)=>update({ [field]:ev.target.value }),
            style:{ width:'100%', border:'none', background:'transparent', outline:'none', textAlign:'right',
              fontSize:'1.25rem', fontWeight:800, color:INK, fontVariantNumeric:'tabular-nums', padding:0 } })),
        e('div', { style:{ width:'14px', display:'flex', justifyContent:'center', flexShrink:0 } }, dotEl(colour, 13)),
        e('div', { style:{ flex:1, minWidth:0, display:'flex', justifyContent:'space-between', alignItems:'center', gap:'0.5rem' } },
          e('span', { style:{ fontSize:'0.82rem', color:INK, fontWeight:700 } }, label),
          dateEl || null));

    const smallRow = (key, time, field, label) =>
      e('div', { key:key, style:{ display:'flex', alignItems:'center', gap:'0.6rem' } },
        e('div', { style:{ width:'82px', flexShrink:0 } },
          e('input', { type:'time', value:time, onChange:(ev)=>update({ [field]:ev.target.value }),
            style:{ width:'100%', border:'none', background:'transparent', outline:'none', textAlign:'right',
              fontSize:'0.85rem', fontWeight:700, color:TRAVEL, fontVariantNumeric:'tabular-nums', padding:0 } })),
        e('div', { style:{ width:'14px', display:'flex', justifyContent:'center', flexShrink:0 } }, dotEl('#8FB4F0', 9)),
        e('div', { style:{ flex:1, display:'flex', justifyContent:'space-between', alignItems:'center' } },
          e('span', { style:{ fontSize:'0.7rem', color:TRAVEL, fontWeight:700 } }, label),
          e('button', { onClick:()=>update({ [field]:'' }), style:{ ...TXTBTN, fontSize:'0.65rem', color:'#C7C7CC', padding:0 } }, 'Remove')));

    const legEl = (key, text, isTravel) =>
      e('div', { key:key, style:{ display:'flex', alignItems:'center', gap:'0.6rem', margin:'1px 0' } },
        e('div', { style:{ width:'82px', flexShrink:0 } }),
        e('div', { style:{ width:'14px', display:'flex', justifyContent:'center', flexShrink:0 } },
          e('span', { style:{ width:'2px', height:'20px', background: isTravel ? '#C9D9F5' : LINE, display:'block', borderRadius:'2px' } })),
        e('span', { style:{ fontSize:'0.62rem', fontWeight:800, borderRadius:'999px', padding:'1px 8px',
          background: isTravel ? TRAVELBG : '#F0F0F4', color: isTravel ? TRAVEL : MID } }, text));

    const plusEl = (key, onClick) =>
      e('div', { key:key, style:{ display:'flex', alignItems:'center', gap:'0.6rem', margin:'1px 0' } },
        e('div', { style:{ width:'82px', flexShrink:0 } }),
        e('div', { style:{ width:'14px', display:'flex', justifyContent:'center', flexShrink:0 } },
          e('button', { onClick:onClick, title:'Add travel',
            style:{ width:'18px', height:'18px', borderRadius:'999px', border:'1.5px dashed #A8C4EE',
              background:'#FFF', color:TRAVEL, fontSize:'0.68rem', fontWeight:800, lineHeight:1,
              display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', padding:0 } }, '+')));

    const dateEl = e('input', { type:'date', value:d.date, onChange:(ev)=>update({ date:ev.target.value }),
      style:{ border:'1.5px solid '+LINE, background:'#FAFAFC', borderRadius:'9px', outline:'none',
        fontSize:'0.72rem', fontWeight:700, color:INK, padding:'0.25rem 0.4rem', maxWidth:'128px' } });

    if (d.t1) {
      rows.push(smallRow(prefix+'t1', d.t1, 't1', 'Travel 1'));
      rows.push(legEl(prefix+'l1', legMins(d.t1, d.start) ? hm(legMins(d.t1, d.start)) : 'travel', true));
    } else {
      rows.push(plusEl(prefix+'p1', ()=>update({ t1: shiftTime(d.start, -1) })));
    }
    rows.push(bigRow(prefix+'st', d.start, 'start', 'Start', GREEN, dateEl));
    rows.push(legEl(prefix+'l2', legMins(d.start, d.finish) ? hm(legMins(d.start, d.finish))+' on site' : 'on site', false));
    rows.push(bigRow(prefix+'fi', d.finish, 'finish', 'Finish', INK));
    if (d.t2) {
      rows.push(legEl(prefix+'l3', legMins(d.finish, d.t2) ? hm(legMins(d.finish, d.t2)) : 'travel', true));
      rows.push(smallRow(prefix+'t2', d.t2, 't2', 'Travel 2'));
    } else {
      rows.push(plusEl(prefix+'p2', ()=>update({ t2: shiftTime(d.finish, 1) })));
    }
    return rows;
  };

  const updateMain  = (patch) => setForm({ ...form, ...patch });
  const updateExtra = (i, patch) => setForm({ ...form, extra: form.extra.map((x,idx) => idx===i ? { ...x, ...patch } : x) });
  const addExtraDay = () => {
    const last = form.extra.length ? form.extra[form.extra.length-1] : form;
    setForm({ ...form, extra: [ ...form.extra, {
      date: addDayISO(last.date, 1), t1:'', start: form.start, finish: form.finish, t2:'' } ] });
  };

  const formView = e('div', { style:{ padding:'1rem 0.85rem 2.5rem', display:'flex', flexDirection:'column', gap:'0.85rem' } },
    e('div', { className:'card', style:{ padding:'1.1rem', display:'flex', flexDirection:'column', gap:'0.9rem' } },

      e('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' } },
        e('span', { style:LBL }, editingId ? 'Edit ticket' : 'New ticket'),
        e('div', { style:{ display:'flex', gap:'0.9rem', alignItems:'center' } },
          e('button', { onClick:()=>{ setView('month'); setEditingId(null); setForm(blank()); }, style:TXTBTN }, 'Cancel'),
          e('button', { onClick:save, style:{ ...TXTBTN, color:BLUE, fontWeight:800 } }, 'Save'))),

      e('input', { type:'text', value:form.ticketNumber, placeholder:'Ticket number',
        onChange:(ev)=>setForm({ ...form, ticketNumber:ev.target.value }), style:{ ...FIELD, fontWeight:700 } }),

      e('div', { style:{ display:'flex', gap:'0.5rem' } },
        e('div', { style:{ flex:1, minWidth:0, display:'flex', alignItems:'center', gap:'0.4rem',
          border:'1.5px solid '+LINE, background:'#FAFAFC', borderRadius:'12px', padding:'0 0.6rem' } },
          e('span', { style:{ width:'11px', height:'11px', borderRadius:'999px', flexShrink:0,
            background: SITES[form.site] ? SITES[form.site].hex : '#D8D8DE' } }),
          e('select', { value:form.site, onChange:(ev)=>setForm({ ...form, site:ev.target.value }),
            style:{ flex:1, minWidth:0, border:'none', background:'transparent', outline:'none', padding:'0.55rem 0',
              fontSize:'0.82rem', fontWeight:700, color: form.site ? INK : GREY } },
            e('option', { value:'' }, 'Site'),
            Object.keys(SITES).map(k => e('option', { key:k, value:k }, SITES[k].label)))),
        e('div', { style:{ flex:1, minWidth:0, display:'flex', alignItems:'center', gap:'0.4rem',
          border:'1.5px solid '+LINE, background:'#FAFAFC', borderRadius:'12px', padding:'0 0.6rem' } },
          e('span', { style:{ width:'6px', height:'6px', borderRadius:'999px', flexShrink:0,
            background: form.equipment.length ? INK : '#D8D8DE' } }),
          e('select', { value:form.equipment[0] || '', onChange:(ev)=>setForm({ ...form, equipment: ev.target.value ? [ev.target.value] : [] }),
            style:{ flex:1, minWidth:0, border:'none', background:'transparent', outline:'none', padding:'0.55rem 0',
              fontSize:'0.82rem', fontWeight:700, color: form.equipment.length ? INK : GREY } },
            e('option', { value:'' }, 'Machine'),
            Object.keys(EQUIP).map(k => e('option', { key:k, value:k }, EQUIP[k]))))),

      e('div', { style:{ display:'flex', flexDirection:'column' } }, buildSpine(form, updateMain, 'm')),

      form.extra.map((d,i) => e('div', { key:'ex'+i, style:{ display:'flex', flexDirection:'column',
        borderTop:'1px dashed '+LINE, paddingTop:'0.7rem', marginTop:'0.3rem' } },
        e('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'0.3rem' } },
          e('span', { style:{ ...LBL, color:TRAVEL } }, 'Day ' + (i+2)),
          e('button', { onClick:()=>setForm({ ...form, extra: form.extra.filter((_,x)=>x!==i) }),
            style:{ ...TXTBTN, fontSize:'0.68rem', color:'#C7C7CC', padding:0 } }, 'Remove day')),
        buildSpine(d, (patch)=>updateExtra(i, patch), 'e'+i))),

      e('button', { onClick:addExtraDay,
        style:{ alignSelf:'flex-start', border:'1.5px dashed '+LINE, background:'transparent', color:GREY,
          borderRadius:'999px', padding:'0.4rem 0.9rem', fontSize:'0.7rem', fontWeight:800, cursor:'pointer' } },
        '+ Another day'),

      e('div', { style:{ height:'1px', background:'#F2F2F7' } }),

      e('div', null,
        e('label', { style:{ ...LBL, marginBottom:'0.45rem' } }, 'Work done'),
        e('textarea', { value:form.workDone, placeholder:'Notes about work completed…',
          onChange:(ev)=>setForm({ ...form, workDone:ev.target.value }),
          style:{ ...FIELD, minHeight:'7rem', resize:'none' } })),

      e('datalist', { id:'partList' }, partHistory.map(([n,d]) => e('option', { key:n, value:n }, d))),

      form.parts.length > 0 && e('div', null,
        e('label', { style:{ ...LBL, marginBottom:'0.45rem' } }, 'Parts'),
        e('div', { style:{ display:'flex', flexDirection:'column', gap:'0.4rem' } },
          form.parts.map((p,i) => e('div', { key:i, style:{ display:'flex', gap:'0.4rem', alignItems:'center' } },
            e('input', { type:'text', value:p.partNumber, placeholder:'Part no.', list:'partList',
              onChange:(ev)=>setPart(i,'partNumber',ev.target.value),
              style:{ flex:'0 0 38%', minWidth:0, border:'1.5px solid '+LINE, background:'#FAFAFC', borderRadius:'11px',
                padding:'0.5rem 0.6rem', fontSize:'0.8rem', fontWeight:700, outline:'none' } }),
            e('input', { type:'text', value:p.partDescription, placeholder:'Description',
              onChange:(ev)=>setPart(i,'partDescription',ev.target.value),
              style:{ flex:1, minWidth:0, border:'1.5px solid '+LINE, background:'#FAFAFC', borderRadius:'11px',
                padding:'0.5rem 0.6rem', fontSize:'0.8rem', outline:'none' } }),
            e('button', { onClick:()=>setForm({ ...form, parts: form.parts.filter((_,x)=>x!==i) }),
              style:{ border:'none', background:'none', color:'#C7C7CC', fontSize:'0.8rem', fontWeight:700, cursor:'pointer', width:'18px', flexShrink:0 } }, '✕'))))),

      e('button', { onClick:()=>setForm({ ...form, parts:[ ...form.parts, { partNumber:'', partDescription:'' } ] }),
        style:{ width:'100%', border:'1.5px dashed '+LINE, background:'transparent', color:GREY,
          borderRadius:'12px', padding:'0.7rem', fontSize:'0.78rem', fontWeight:800, cursor:'pointer' } }, '+ Add part'),

      editingId && e('div', { style:{ display:'flex', justifyContent:'space-between', paddingTop:'0.3rem' } },
        e('button', { onClick:duplicate, style:{ ...TXTBTN, color:BLUE, fontSize:'0.78rem' } }, 'Duplicate'),
        e('button', { onClick:()=>{ if (window.confirm('Delete this ticket?')) { remove(editingId); setView('month'); setEditingId(null); setForm(blank()); } },
          style:{ ...TXTBTN, color:RED, fontSize:'0.78rem' } }, 'Delete ticket'))));

  if (!ready) return e('div', { style:{ padding:'4rem', textAlign:'center', color:GREY } }, 'Loading…');

  const body = view === 'form' ? formView : view === 'list' ? listView : monthView;
  return e('div', null, header, body, menu, daySheet);
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
