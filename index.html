<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const e = React.createElement;

const SITES = {
  NX:   { label:'NX',   hex:'#FF7A00', hex2:'#E04E00' },
  WS:   { label:'WS',   hex:'#FF1D6C', hex2:'#C1005F' },
  RH:   { label:'RH',   hex:'#00C9A7', hex2:'#00887A' },
  MMUH: { label:'MMUH', hex:'#41597E', hex2:'#232F44' }
};
const EQUIP = { C:'Alinity C', I:'Alinity I', SCM:'Alinity SCM', GLP:'GLP track' };

const INK='#EDEEF3', MID='#9CA1B4', GREY='#6E7386', LINE='rgba(255,255,255,0.10)';
const TRAVEL='#6C93F0', TRAVELBG='rgba(108,147,240,0.15)', GREEN='#22D482', BLUE='#2F8CFF', RED='#FF5A54';
const LOCKED='#2F8CFF', LOCKEDBG='rgba(47,140,255,0.16)';

const SURF='#181B26', SURF2='#20232F', SURF3='#1C1F2A';

const SHADOW    = '0 16px 34px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.32)';
const SHADOW_SM = '0 7px 18px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.25)';

const LBL   = { display:'block', fontSize:'0.6rem', fontWeight:800, color:GREY, textTransform:'uppercase', letterSpacing:'0.7px' };
const FIELD = { width:'100%', minWidth:0, padding:'0.72rem 0.85rem', border:'1.5px solid '+LINE, borderRadius:'14px', outline:'none', fontSize:'0.95rem', background:'#12141D', color:INK };
const TXTBTN = { background:'none', border:'none', fontSize:'0.85rem', fontWeight:700, padding:'6px 2px', cursor:'pointer', color:GREY };
const PANEL = { background:SURF, borderRadius:'24px', boxShadow:SHADOW, border:'1px solid rgba(255,255,255,0.05)' };

const grad = (a,b,deg) => 'linear-gradient('+(deg||155)+'deg,'+a+' 0%,'+b+' 100%)';
const siteGrad = (k) => grad(SITES[k].hex, SITES[k].hex2);
const hexToRgba = (hex, a) => { const h=hex.replace('#',''); const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16); return 'rgba('+r+','+g+','+b+','+a+')'; };

const LockIcon = (locked, size, colour) => {
  const s = size || 19;
  const col = colour || (locked ? LOCKED : '#565C74');
  return e('svg', { width:s, height:s, viewBox:'0 0 24 24', style:{ display:'block', pointerEvents:'none' } },
    e('path', { d: locked ? 'M7 10V7.5a5 5 0 0 1 10 0V10' : 'M7 10V7.5a5 5 0 0 1 9.5-2.2',
      fill:'none', stroke:col, strokeWidth:2.1, strokeLinecap:'round' }),
    e('rect', { x:3.6, y:10, width:16.8, height:11, rx:3.2,
      fill: locked ? col : 'none', stroke:col, strokeWidth:2.1 }),
    e('circle', { cx:12, cy:15.6, r:1.7, fill: locked ? '#FFF' : col }));
};
const ChevronLeft = (size, col) => e('svg', { width:size, height:size, viewBox:'0 0 24 24', style:{ display:'block', pointerEvents:'none' } },
  e('path', { d:'M15 5 L8 12 L15 19', fill:'none', stroke:col, strokeWidth:2.6, strokeLinecap:'round', strokeLinejoin:'round' }));
const DotsIcon = (size, col) => e('svg', { width:size, height:size, viewBox:'0 0 24 24', style:{ display:'block', pointerEvents:'none' } },
  [5,12,19].map(cy => e('circle', { key:cy, cx:12, cy:cy, r:2, fill:col })));
const XIcon = (size, col) => e('svg', { width:size, height:size, viewBox:'0 0 24 24', style:{ display:'block', pointerEvents:'none' } },
  e('path', { d:'M6 6 L18 18 M18 6 L6 18', stroke:col, strokeWidth:2.2, strokeLinecap:'round' }));
const PlusIcon = (size, col) => e('svg', { width:size, height:size, viewBox:'0 0 24 24', style:{ display:'block', pointerEvents:'none' } },
  e('path', { d:'M12 5 V19 M5 12 H19', stroke:col, strokeWidth:2.4, strokeLinecap:'round' }));
const PlaneIcon = (size, col) => e('svg', { width:size, height:size, viewBox:'0 0 24 24', style:{ display:'block', pointerEvents:'none' } },
  e('path', { d:'M3 13 L21 6 L14 13.5 L15.5 20 L12.5 18.5 L11 14.5 L3 13Z', fill:col, opacity:0.9 }));

const DB_NAME='ticketsDB', STORE='kv', KEY='jobs';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function dbGet(k){try{const db=await openDB();return await new Promise((res,rej)=>{
  const r=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
  r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error);});}catch(err){return null;}}
async function dbSet(k,v){try{const db=await openDB();await new Promise((res,rej)=>{
  const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(v,k);
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});return true;}catch(err){return false;}}

const pad = (n) => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const ukDate = (iso) => { const p=(iso||'').split('-'); return p.length===3 ? p[2]+'-'+p[1]+'-'+p[0] : ''; };
const addDayISO = (iso, n) => { const d=new Date(iso+'T00:00'); d.setDate(d.getDate()+(n||1));
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const roundNow = () => { const d=new Date(); d.setMinutes(Math.floor(d.getMinutes()/5)*5);
  return pad(d.getHours())+':'+pad(d.getMinutes()); };
const shiftTime = (t, h) => { if (!t) return ''; const p=t.split(':');
  return pad((Number(p[0])+h+24)%24)+':'+p[1]; };

const AUTO_BACKUP_KEY = 'autoBackupDate';
const TrashIcon = (size, col) => e('svg', { width:size, height:size, viewBox:'0 0 24 24', style:{ display:'block', pointerEvents:'none' } },
  e('path', { d:'M4 7 H20 M9 7 V5a1 1 0 0 1 1-1 h4 a1 1 0 0 1 1 1 V7 M6 7 L7 20 a1 1 0 0 0 1 1 h8 a1 1 0 0 0 1-1 L18 7',
    fill:'none', stroke:col, strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' }));

/* ---------- iOS-Mail-style swipe-to-reveal row: swipe left for Lock / Delete ---------- */
function SwipeCard({ locked, onLock, onDelete, onTap, radius, children }) {
  const [dx, setDx] = useState(0);
  const [dragging, setDragging] = useState(false);
  const touchRef = useRef({ x:0, y:0, live:false, active:false, startDx:0 });
  const ACTION_W = 132, TRIGGER = 66;

  /* Only note the touch start position — don't touch React state yet.
     A plain tap or a vertical scroll should cost nothing and never
     interrupt native scrolling; we only "claim" the gesture once real
     horizontal movement is seen. */
  const onStart = (ev) => {
    const t = ev.touches[0];
    touchRef.current = { x:t.clientX, y:t.clientY, live:true, active:false, startDx:dx };
  };
  const onMove = (ev) => {
    if (!touchRef.current.live) return;
    const t = ev.touches[0];
    const rawDx = t.clientX - touchRef.current.x;
    const dy = t.clientY - touchRef.current.y;
    if (!touchRef.current.active) {
      if (Math.abs(dy) > Math.abs(rawDx) + 6) { touchRef.current.live = false; return; }
      if (Math.abs(rawDx) < 8) return;
      touchRef.current.active = true;
      setDragging(true);
    }
    setDx(Math.max(-ACTION_W - 14, Math.min(0, touchRef.current.startDx + rawDx)));
  };
  const onEnd = () => {
    const wasActive = touchRef.current.active;
    touchRef.current.live = false;
    touchRef.current.active = false;
    if (!wasActive) return;
    setDragging(false);
    setDx(cur => (cur <= -TRIGGER ? -ACTION_W : 0));
  };
  const handleTap = () => { if (dx !== 0) { setDx(0); } else if (onTap) onTap(); };

  return e('div', { style:{ position:'relative', borderRadius:radius } },
    e('div', { style:{ position:'absolute', inset:0, display:'flex', justifyContent:'flex-end', borderRadius:radius, overflow:'hidden' } },
      e('button', { onClick:()=>{ onLock(); setDx(0); },
        style:{ width:'66px', border:'none', cursor:'pointer', background: locked ? '#3A4257' : LOCKED,
          display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'4px' } },
        LockIcon(true, 20, '#FFF'),
        e('span', { style:{ fontSize:'0.56rem', fontWeight:800, color:'#FFF' } }, locked ? 'Unlock' : 'Lock')),
      e('button', { onClick:()=>{ setDx(0); onDelete(); },
        style:{ width:'66px', border:'none', cursor:'pointer', background:RED,
          display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'4px' } },
        TrashIcon(19, '#FFF'),
        e('span', { style:{ fontSize:'0.56rem', fontWeight:800, color:'#FFF' } }, 'Delete'))),
    e('div', { onTouchStart:onStart, onTouchMove:onMove, onTouchEnd:onEnd, onTouchCancel:onEnd, onClick:handleTap,
      style:{ transform:'translateX('+dx+'px)', transition: dragging ? 'none' : 'transform .2s cubic-bezier(.22,.9,.3,1)',
        touchAction:'pan-y',
        position:'relative' } },
      children));
}

function App() {
  const [jobs, setJobs] = useState([]);
  const [ready, setReady] = useState(false);
  const [view, setView] = useState('month');
  const [editingId, setEditingId] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [formMenu, setFormMenu] = useState(false);
  const [form, setForm] = useState(blank());
  const [returnTo, setReturnTo] = useState(null);

  const [query, setQuery] = useState('');
  const [siteFilter, setSiteFilter] = useState([]);
  const [equipFilter, setEquipFilter] = useState([]);
  const [showFilters, setShowFilters] = useState(false);

  const [anchorDate, setAnchorDate] = useState(() => new Date());
  const [calMode, setCalMode] = useState('month');
  const [dayDetail, setDayDetail] = useState(null);
  const [showWeekends, setShowWeekends] = useState(false);

  const [swipeX, setSwipeX] = useState(0);
  const [swiping, setSwiping] = useState(false);
  const touch = useRef({ x:0, y:0, live:false });
  const SWIPE_TRIGGER = 95;

  const [calDX, setCalDX] = useState(0);
  const [calDragging, setCalDragging] = useState(false);
  const calTouch = useRef({ x:0, y:0, live:false });
  const CAL_TRIGGER = 26;

  const jobsRef = useRef(jobs);
  useEffect(() => { jobsRef.current = jobs; }, [jobs]);

  function blank(date) {
    const s = roundNow();
    const d = date || todayISO();
    return { ticketNumber:'', site:'', equipment:[], date:d,
      t1:'', start:s, finish:shiftTime(s,1), t2:'', extra:[],
      workDone: ukDate(d) + '\n', parts:[], locked:false };
  }

  useEffect(() => { (async () => {
    let data = await dbGet(KEY);
    if (!data) { try { const s = localStorage.getItem('jobsData'); if (s) { data = JSON.parse(s); await dbSet(KEY, data); } } catch (err) {} }
    if (Array.isArray(data)) setJobs(data.map(j => ({ equipment:[], parts:[], extraDays:[], locked:false, ...j })));
    setReady(true);
  })(); }, []);

  const persist = async (next) => {
    setJobs(next); await dbSet(KEY, next);
    try { localStorage.setItem('jobsData', JSON.stringify(next)); } catch (err) {}
  };

  const fmtDate  = (s) => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
  const fmtDay   = (s) => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : '';
  const fmtTime  = (s) => s ? new Date(s).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  const stamp = () => { const d=new Date();
    return pad(d.getFullYear()%100)+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };

  const mins = (a,b) => { if (!a||!b) return 0; const m = Math.round((new Date(b)-new Date(a))/60000); return (isNaN(m)||m<0)?0:m; };
  const hm = (m) => m >= 60 ? Math.floor(m/60)+'h '+(m%60?pad(m%60)+'m':'') : m+'m';
  const eqOf = (j) => Array.isArray(j.equipment) ? j.equipment : [];
  const exOf = (j) => Array.isArray(j.extraDays) ? j.extraDays : [];

  const composeTimes = (date, arr) => {
    let d = date, last = null;
    return arr.map(t => {
      if (!t) return null;
      if (last && t < last) d = addDayISO(d,1);
      last = t;
      return d + 'T' + t;
    });
  };

  const buildXlsxBlob = (rowsSrc) => {
    const rows = [['Ticket','Site','Machine','Date','Travel 1','Start','Finish','Travel 2','On site','Travel mins','Extra days','Signed off','Work Done','Parts Used']];
    [...rowsSrc].sort((a,b)=>new Date(a.startDateTime)-new Date(b.startDateTime)).forEach(j => {
      const parts = (j.parts||[]).filter(p=>p.partNumber||p.partDescription)
        .map(p => (p.partNumber||'').trim() + (p.partDescription ? ' — '+p.partDescription.trim() : '')).join(' | ');
      let on = mins(j.startDateTime, j.finishDateTime);
      let tr = (j.hasTravel ? mins(j.travelDateTime, j.startDateTime) : 0)
             + (j.hasTravel2 ? mins(j.finishDateTime, j.travel2DateTime) : 0);
      const ex = exOf(j).map(d => {
        on += mins(d.startDateTime, d.finishDateTime);
        tr += (d.hasTravel ? mins(d.travelDateTime, d.startDateTime) : 0)
            + (d.hasTravel2 ? mins(d.finishDateTime, d.travel2DateTime) : 0);
        return fmtDay(d.startDateTime)+' '+fmtTime(d.startDateTime)+'–'+fmtTime(d.finishDateTime);
      }).join(' | ');
      rows.push([ j.ticketNumber, SITES[j.site]?SITES[j.site].label:'', eqOf(j).map(x=>EQUIP[x]||x).join(', '),
        fmtDate(j.startDateTime),
        j.hasTravel?fmtTime(j.travelDateTime):'', fmtTime(j.startDateTime), fmtTime(j.finishDateTime),
        j.hasTravel2?fmtTime(j.travel2DateTime):'', on?hm(on):'', tr||'', ex,
        j.locked ? 'Ready' : '',
        (j.workDone||'').replace(/\r?\n/g,' '), parts ]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:16},{wch:8},{wch:14},{wch:12},{wch:9},{wch:8},{wch:8},{wch:9},{wch:10},{wch:11},{wch:26},{wch:11},{wch:60},{wch:40}];
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:rowsSrc.length,c:13} }) };
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Tickets');
    return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],
      { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  };

  const download = (blob, name) => {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  };
  const shareFiles = async (files) => {
    try { if (navigator.canShare && navigator.canShare({files})) { await navigator.share({files,title:'Tickets'}); return true; } }
    catch (err) { if (err && err.name==='AbortError') return true; }
    return false;
  };

  /* ---------- automatic daily JSON backup ----------
     There's no way for a plain home-screen web app to run at the exact
     stroke of midnight while your phone is locked — iOS won't wake it.
     Instead this checks on every app open, and every few minutes while
     the app stays open, whether the calendar date has moved on since the
     last backup; the first time that happens it silently drops a dated
     JSON backup file (same format as "Create backup file" in the menu). */
  const doAutoBackup = (label) => {
    if (!jobsRef.current.length) return;
    const blob = new Blob([JSON.stringify({ app:'tickets', version:9, exported:new Date().toISOString(), auto:true, jobs:jobsRef.current }, null, 2)], { type:'application/json' });
    download(blob, label+' Auto backup.json');
  };
  useEffect(() => {
    if (!ready) return;
    const check = () => {
      const t = todayISO();
      let last = null;
      try { last = localStorage.getItem(AUTO_BACKUP_KEY); } catch (err) {}
      if (last !== t) {
        doAutoBackup(last || t);
        try { localStorage.setItem(AUTO_BACKUP_KEY, t); } catch (err) {}
      }
    };
    check();
    const iv = setInterval(check, 5*60*1000);
    return () => clearInterval(iv);
  }, [ready]);

  const doSpreadsheet = async (scope) => {
    const src = scope === 'month' ? ms.src : (scope === 'filtered' ? filtered : jobs);
    if (!src.length) { alert('Nothing to export.'); return; }
    if (typeof XLSX === 'undefined') { alert('Still loading — try again in a moment.'); return; }
    const suffix = scope === 'month' ? ' ' + anchorDate.toLocaleDateString('en-GB',{month:'short',year:'numeric'})
                 : (scope === 'filtered' ? ' (filtered)' : '');
    const name = stamp()+' App tickets'+suffix+'.xlsx';
    const blob = buildXlsxBlob(src);
    if (!(await shareFiles([new File([blob],name,{type:blob.type})]))) download(blob,name);
    setMenuOpen(false);
  };

  const doBackup = async () => {
    if (!jobs.length) { alert('Nothing to back up.'); return; }
    const name = stamp()+' App tickets backup.json';
    const blob = new Blob([JSON.stringify({ app:'tickets', version:9, exported:new Date().toISOString(), jobs }, null, 2)], { type:'application/json' });
    if (!(await shareFiles([new File([blob],name,{type:'application/json'})]))) download(blob,name);
    setMenuOpen(false);
  };

  const doRestore = () => {
    const input = document.getElementById('restoreInput'); input.value='';
    input.onchange = () => {
      const file = input.files && input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const parsed = JSON.parse(reader.result);
          const list = Array.isArray(parsed) ? parsed : parsed.jobs;
          if (!Array.isArray(list)) throw new Error('bad');
          const merged = list.map(j => ({ equipment:[], parts:[], extraDays:[], locked:false, ...j }));
          const seen = new Set(merged.map(j=>j.id));
          jobs.forEach(j => { if (!seen.has(j.id)) merged.push(j); });
          merged.sort((a,b)=>new Date(b.startDateTime)-new Date(a.startDateTime));
          await persist(merged); setMenuOpen(false);
          alert('Restored. Total now '+merged.length+' tickets.');
        } catch (err) { alert('That file could not be read.'); }
      };
      reader.readAsText(file);
    };
    input.click();
  };

  const doCopyMonth = async () => {
    if (!ms.src.length) { alert('Nothing to copy.'); return; }
    const byDay = Object.keys(ms.days).map(Number).sort((a,b)=>a-b);
    const text = byDay.map(dnum => {
      const d = ms.days[dnum];
      const head = new Date(ms.y, ms.m, dnum).toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'})
        + '  ' + d.siteSequence.map(s=>SITES[s].label).join(' → ');
      const body = d.tickets.map(j => {
        const p = (j.parts||[]).filter(x=>x.partNumber||x.partDescription)
          .map(x => (x.partNumber||'')+(x.partDescription?' — '+x.partDescription:'')).join(', ');
        const ex = exOf(j).map(x => fmtDay(x.startDateTime)+' '+fmtTime(x.startDateTime)+'–'+fmtTime(x.finishDateTime)).join(', ');
        return '  • ' + j.ticketNumber + (eqOf(j).length?' ('+eqOf(j).join(', ')+')':'') + '  '
          + fmtTime(j.startDateTime)+'–'+fmtTime(j.finishDateTime)
          + (ex?'\n    Also: '+ex:'')
          + (j.workDone?'\n    '+j.workDone.replace(/\n/g,' '):'')
          + (p?'\n    Parts: '+p:'');
      }).join('\n');
      return head + '\n' + body;
    }).join('\n\n');
    try { await navigator.clipboard.writeText(text); alert('Copied '+ms.src.length+' ticket(s).'); }
    catch (err) { alert('Copy failed — clipboard access blocked.'); }
    setMenuOpen(false);
  };

  const doClear = async () => {
    if (!window.confirm('Delete ALL tickets? Make a backup first.')) return;
    if (!window.confirm('Really delete everything?')) return;
    await persist([]); setMenuOpen(false);
  };

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return jobs.filter(j => {
      if (siteFilter.length && !siteFilter.includes(j.site)) return false;
      if (equipFilter.length && !eqOf(j).some(x => equipFilter.includes(x))) return false;
      if (!q) return true;
      const hay = [ j.ticketNumber, j.workDone, SITES[j.site]?SITES[j.site].label:'',
        ...eqOf(j).map(x => EQUIP[x] ? EQUIP[x]+' '+x : x),
        ...(j.parts||[]).map(p => (p.partNumber||'')+' '+(p.partDescription||'')) ].join(' ').toLowerCase();
      return hay.includes(q);
    }).sort((a,b) => new Date(b.startDateTime) - new Date(a.startDateTime));
  }, [jobs, query, siteFilter, equipFilter]);

  const partHistory = useMemo(() => {
    const set = new Map();
    jobs.forEach(j => (j.parts||[]).forEach(p => {
      if (p.partNumber && p.partNumber.trim()) set.set(p.partNumber.trim(), p.partDescription||'');
    }));
    return [...set.entries()];
  }, [jobs]);

  const ms = useMemo(() => {
    const y = anchorDate.getFullYear(), m = anchorDate.getMonth();
    const src = jobs.filter(j => {
      const d = new Date(j.startDateTime);
      return d.getFullYear() === y && d.getMonth() === m;
    });
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = {};
    src.forEach(j => {
      const dnum = new Date(j.startDateTime).getDate();
      (days[dnum] = days[dnum] || { tickets:[] }).tickets.push(j);
    });
    Object.keys(days).forEach(d => {
      const day = days[d];
      day.tickets.sort((a,b) => new Date(a.startDateTime) - new Date(b.startDateTime));
      const seq = [];
      day.tickets.forEach(j => { if (j.site && seq[seq.length-1] !== j.site) seq.push(j.site); });
      day.siteSequence = seq;
      day.sites = [...new Set(day.tickets.map(j=>j.site).filter(Boolean))];
      day.equip = [...new Set(day.tickets.flatMap(eqOf))];
      day.allLocked = day.tickets.every(j => j.locked);
      day.first = day.tickets[0].hasTravel && day.tickets[0].travelDateTime ? day.tickets[0].travelDateTime : day.tickets[0].startDateTime;
      const lastJob = day.tickets[day.tickets.length-1];
      day.last = lastJob.hasTravel2 && lastJob.travel2DateTime ? lastJob.travel2DateTime : lastJob.finishDateTime;
    });
    return { y, m, src, days, daysInMonth, firstDow };
  }, [jobs, anchorDate]);

  const wk = useMemo(() => {
    const dow = (anchorDate.getDay() + 6) % 7;
    const monday = new Date(anchorDate); monday.setDate(anchorDate.getDate() - dow);
    const dates = [...Array(7)].map((_,i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });
    const byDate = {};
    jobs.forEach(j => { const k = (j.startDateTime||'').slice(0,10); (byDate[k] = byDate[k] || []).push(j); });
    Object.keys(byDate).forEach(k => byDate[k].sort((a,b)=>new Date(a.startDateTime)-new Date(b.startDateTime)));
    return { monday, dates, byDate };
  }, [jobs, anchorDate]);

  const dv = useMemo(() => {
    const iso = anchorDate.getFullYear()+'-'+pad(anchorDate.getMonth()+1)+'-'+pad(anchorDate.getDate());
    const list = jobs.filter(j => (j.startDateTime||'').slice(0,10) === iso)
      .sort((a,b)=>new Date(a.startDateTime)-new Date(b.startDateTime));
    const seq = [];
    list.forEach(j => { if (j.site && seq[seq.length-1] !== j.site) seq.push(j.site); });
    return { iso, list, siteSequence:seq };
  }, [jobs, anchorDate]);

  const goBack = () => {
    const r = returnTo;
    setSwipeX(0); setSwiping(false); setFormMenu(false);
    setEditingId(null); setForm(blank());
    if (r && r.view === 'list') { setView('list'); setDayDetail(null); }
    else { setView('month'); setDayDetail(r && r.day != null ? r.day : null); }
    setReturnTo(null);
  };

  const openNew = (date, ret) => {
    setForm(blank(date)); setEditingId(null); setReturnTo(ret || null);
    setDayDetail(null); setSwipeX(0); setView('form'); window.scrollTo(0,0);
  };

  const openEdit = (j, ret) => {
    setForm({
      ticketNumber: j.ticketNumber || '',
      site: j.site || '',
      equipment: eqOf(j),
      date: (j.startDateTime||'').slice(0,10) || todayISO(),
      t1: j.hasTravel && j.travelDateTime ? j.travelDateTime.slice(11,16) : '',
      start: (j.startDateTime||'').slice(11,16),
      finish: (j.finishDateTime||'').slice(11,16),
      t2: j.hasTravel2 && j.travel2DateTime ? j.travel2DateTime.slice(11,16) : '',
      extra: exOf(j).map(d => ({
        date: (d.startDateTime||'').slice(0,10),
        t1: d.hasTravel && d.travelDateTime ? d.travelDateTime.slice(11,16) : '',
        start: (d.startDateTime||'').slice(11,16),
        finish: (d.finishDateTime||'').slice(11,16),
        t2: d.hasTravel2 && d.travel2DateTime ? d.travel2DateTime.slice(11,16) : ''
      })),
      workDone: j.workDone || '',
      parts: (j.parts||[]).filter(p => p.partNumber || p.partDescription),
      locked: !!j.locked
    });
    setEditingId(j.id); setReturnTo(ret || null);
    setDayDetail(null); setSwipeX(0); setView('form'); window.scrollTo(0,0);
  };

  const duplicate = () => {
    setForm({ ...form, ticketNumber:'', date: todayISO(), extra:[], locked:false });
    setEditingId(null); setFormMenu(false); window.scrollTo(0,0);
  };

  const packRec = () => {
    const pack = (d) => {
      const c = composeTimes(d.date, [d.t1, d.start, d.finish || d.start, d.t2]);
      return { startDateTime:c[1], finishDateTime:c[2],
        hasTravel: !!d.t1, travelDateTime: c[0] || c[1],
        hasTravel2: !!d.t2, travel2DateTime: c[3] || c[2] };
    };
    return {
      id: editingId || Date.now(),
      ticketNumber: form.ticketNumber.trim(),
      site: form.site,
      equipment: form.equipment,
      ...pack(form),
      extraDays: (form.extra||[]).filter(d => d.date && d.start).map(pack),
      workDone: form.workDone,
      parts: form.parts.filter(p => p.partNumber || p.partDescription),
      locked: !!form.locked
    };
  };

  const commit = async () => {
    const rec = packRec();
    await persist(editingId ? jobs.map(j => j.id===editingId ? rec : j) : [rec, ...jobs]);
  };

  const saveAndClose = async () => {
    if (!form.ticketNumber.trim()) { alert('Enter a ticket number to save.'); return; }
    if (!form.start) { alert('Set a start time to save.'); return; }
    const dupe = jobs.find(j => j.id !== editingId && String(j.ticketNumber).trim().toLowerCase() === form.ticketNumber.trim().toLowerCase());
    if (dupe && !window.confirm('Ticket "'+form.ticketNumber+'" already exists ('+fmtDate(dupe.startDateTime)+'). Save anyway?')) return;
    await commit();
    goBack();
  };

  const backOut = async () => {
    if (form.ticketNumber.trim() && form.start) await commit();
    goBack();
  };

  const remove = (id) => { persist(jobs.filter(j => j.id !== id)); setDayDetail(null); };
  const toggleLock = (id) => persist(jobs.map(j => j.id === id ? { ...j, locked: !j.locked } : j));

  const setPart = (i, field, val) => {
    const parts = form.parts.map((p,idx) => idx===i ? { ...p, [field]:val } : p);
    if (field === 'partNumber') {
      const known = partHistory.find(([n]) => n.toLowerCase() === val.trim().toLowerCase());
      if (known && !parts[i].partDescription) parts[i].partDescription = known[1];
    }
    setForm({ ...form, parts });
  };

  const onTouchStart = (ev) => {
    const tag = ((ev.target && ev.target.tagName) || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { touch.current.live = false; return; }
    const t = ev.touches[0];
    touch.current = { x:t.clientX, y:t.clientY, live:true };
    setSwiping(true);
  };
  const onTouchMove = (ev) => {
    if (!touch.current.live) return;
    const t = ev.touches[0];
    const dx = t.clientX - touch.current.x;
    const dy = t.clientY - touch.current.y;
    if (Math.abs(dy) > Math.abs(dx) + 8) { touch.current.live = false; setSwiping(false); setSwipeX(0); return; }
    setSwipeX(dx > 0 ? Math.min(dx * 0.85, 170) : 0);
  };
  const onTouchEnd = () => {
    if (!touch.current.live) { setSwiping(false); setSwipeX(0); return; }
    touch.current.live = false;
    setSwiping(false);
    if (swipeX >= SWIPE_TRIGGER) backOut(); else setSwipeX(0);
  };

  const progress = Math.min(swipeX / SWIPE_TRIGGER, 1);
  const armed = swipeX >= SWIPE_TRIGGER;

      zIndex:40, width:'48px', height:'48px', borderRadius:'999px',
      background: armed ? grad(BLUE,'#0047C2',140) : SURF2, boxShadow:'0 6px 18px rgba(0,0,0,0.4)',
      display:'flex', alignItems:'center', justifyContent:'center',
      opacity: 0.3 + progress*0.7, transition:'background .12s ease' } },
    ChevronLeft(24, armed ? '#FFF' : GREY));

  /* ---------- calendar swipe: lighter drag now flips the period ---------- */
  const shift = (n) => {
    if (calMode === 'month') {
      const y = anchorDate.getFullYear(), targetM = anchorDate.getMonth() + n;
      const daysInTarget = new Date(y, targetM+1, 0).getDate();
      setAnchorDate(new Date(y, targetM, Math.min(anchorDate.getDate(), daysInTarget)));
    } else if (calMode === 'week') {
      const d = new Date(anchorDate); d.setDate(d.getDate() + n*7); setAnchorDate(d);
    } else {
      const d = new Date(anchorDate); d.setDate(d.getDate() + n); setAnchorDate(d);
    }
    setDayDetail(null);
  };
  const goToday = () => setAnchorDate(new Date());

  const onCalTouchStart = (ev) => {
    const t = ev.touches[0];
    calTouch.current = { x:t.clientX, y:t.clientY, live:true };
    setCalDragging(true);
  };
  const onCalTouchMove = (ev) => {
    if (!calTouch.current.live) return;
    const t = ev.touches[0];
    const dx = t.clientX - calTouch.current.x;
    const dy = t.clientY - calTouch.current.y;
    if (Math.abs(dy) > Math.abs(dx) + 8) { calTouch.current.live = false; setCalDragging(false); setCalDX(0); return; }
    setCalDX(Math.max(-80, Math.min(80, dx)));
  };
  const onCalTouchEnd = () => {
    if (!calTouch.current.live) { setCalDragging(false); setCalDX(0); return; }
    calTouch.current.live = false;
    setCalDragging(false);
    if (calDX <= -CAL_TRIGGER) shift(1);
    else if (calDX >= CAL_TRIGGER) shift(-1);
    setCalDX(0);
  };

  /* ---------- pull-down-to-dismiss on bottom sheets, iOS style ----------
     The whole sheet is the drag surface, not just the handle — but a
     downward drag only takes over once the content is scrolled to the
     top, exactly like a native iOS sheet, so it never fights normal
     scrolling of the ticket list underneath. */
  const [sheetDY, setSheetDY] = useState(0);
  const [sheetDragging, setSheetDragging] = useState(false);
  const sheetTouch = useRef({ x:0, y:0, live:false, active:false });
  const sheetPanelRef = useRef(null);
  const SHEET_TRIGGER = 90;

  const sheet = (children, onClose) => {
    const handleStart = (ev) => {
      const t = ev.touches[0];
      sheetTouch.current = { x:t.clientX, y:t.clientY, live:true, active:false };
    };
    const handleMove = (ev) => {
      if (!sheetTouch.current.live) return;
      const t = ev.touches[0];
      const dy = t.clientY - sheetTouch.current.y;
      const dx = t.clientX - sheetTouch.current.x;
      if (!sheetTouch.current.active) {
        const atTop = !sheetPanelRef.current || sheetPanelRef.current.scrollTop <= 0;
        if (!atTop || dy <= 8 || Math.abs(dx) > dy) return;
        sheetTouch.current.active = true;
        setSheetDragging(true);
      }
      ev.preventDefault();
      setSheetDY(Math.max(0, dy));
    };
    const handleEnd = () => {
      const wasActive = sheetTouch.current.active;
      sheetTouch.current.live = false;
      sheetTouch.current.active = false;
      if (!wasActive) return;
      setSheetDragging(false);
      if (sheetDY >= SHEET_TRIGGER) { setSheetDY(0); onClose(); } else setSheetDY(0);
    };
    return e('div', { onClick:onClose,
      style:{ position:'fixed', inset:0, background:'rgba(0,0,0,0.55)', zIndex:60, display:'flex', alignItems:'flex-end' } },
      e('div', { ref:sheetPanelRef, onClick:(ev)=>ev.stopPropagation(),
        onTouchStart:handleStart, onTouchMove:handleMove, onTouchEnd:handleEnd, onTouchCancel:handleEnd,
        style:{ width:'100%', background:SURF, borderRadius:'28px 28px 0 0', padding:'0 1rem calc(2rem + env(safe-area-inset-bottom))',
          display:'flex', flexDirection:'column', gap:'0.6rem', animation:'slideUp .22s ease', maxHeight:'88vh', overflowY:'auto',
          boxShadow:'0 -10px 40px rgba(0,0,0,0.55)', border:'1px solid rgba(255,255,255,0.06)', borderBottom:'none',
          transform:'translateY('+sheetDY+'px)', transition: sheetDragging ? 'none' : 'transform .22s cubic-bezier(.22,.9,.3,1)' } },
        e('div', { style:{ padding:'0.85rem 0 0.5rem' } },
          e('div', { style:{ width:'40px', height:'5px', borderRadius:'999px', background:'rgba(255,255,255,0.22)', margin:'0 auto' } })),
        children));
  };

  const menuRow = (label, sub, onClick, colour) =>
    e('button', { key:label, onClick, style:{ width:'100%', textAlign:'left', padding:'0.85rem 1rem', borderRadius:'16px', border:'none',
      background:SURF3, cursor:'pointer', display:'flex', flexDirection:'column', gap:'0.12rem' } },
      e('span', { style:{ fontSize:'0.93rem', fontWeight:700, color: colour || INK } }, label),
      e('span', { style:{ fontSize:'0.7rem', color:GREY } }, sub));

  const closeBtn = (onClick) => e('button', { key:'close', onClick,
    style:{ marginTop:'0.3rem', padding:'0.9rem', borderRadius:'999px', border:'none', background:SURF2,
      color:INK, fontWeight:700, fontSize:'0.95rem', cursor:'pointer' } }, 'Close');

  const monthShort = anchorDate.toLocaleDateString('en-GB',{ month:'long' });

  const menu = menuOpen && sheet([
    view === 'list'
      ? menuRow('Calendar view', 'Month, week and day planner', ()=>{ setMenuOpen(false); setView('month'); window.scrollTo(0,0); })
      : menuRow('All tickets', 'Search everything you have logged', ()=>{ setMenuOpen(false); setView('list'); window.scrollTo(0,0); }),
    (view === 'list' && (query || siteFilter.length || equipFilter.length))
      ? menuRow('Spreadsheet — current view', filtered.length+' ticket(s)', ()=>doSpreadsheet('filtered'))
      : menuRow('Spreadsheet — '+monthShort, ms.src.length+' ticket(s)', ()=>doSpreadsheet('month')),
    menuRow('Spreadsheet — everything', 'All '+jobs.length+' ticket(s)', ()=>doSpreadsheet('all')),
    menuRow('Copy '+monthShort+' as text', 'For pasting into an email', doCopyMonth),
    menuRow('Create backup file', 'Save a .json restore file', doBackup),
    menuRow('Restore from backup', 'Load an "App tickets backup" .json file', doRestore),
    menuRow('Clear all tickets', 'Deletes everything on this device', doClear, RED),
    closeBtn(()=>setMenuOpen(false))
  ], ()=>setMenuOpen(false));

  const formSheet = formMenu && sheet([
    menuRow('Save and close', 'Store this ticket and go back', ()=>{ setFormMenu(false); saveAndClose(); }),
    editingId ? menuRow('Duplicate', 'Copy the details into a new ticket', duplicate) : null,
    editingId ? menuRow('Delete ticket', 'Remove it from this device', ()=>{
      if (window.confirm('Delete this ticket?')) { setFormMenu(false); remove(editingId); goBack(); } }, RED) : null,
    editingId ? null : menuRow('Discard', 'Close without saving', ()=>{ setFormMenu(false); goBack(); }),
    closeBtn(()=>setFormMenu(false))
  ].filter(Boolean), ()=>setFormMenu(false));

  const header = view !== 'form' && e('div', { style:{ padding:'0.9rem 1rem 0.7rem', display:'flex', justifyContent:'space-between', alignItems:'center' } },
    e('button', { onClick:()=>setMenuOpen(true), style:{ ...TXTBTN, color:INK, fontWeight:800 } }, 'Menu'),
    e('span', { style:{ fontSize:'0.95rem', fontWeight:800, letterSpacing:'-0.2px' } }, view === 'list' ? 'All tickets' : 'Tickets'),
    e('button', { onClick:()=>openNew(null, view==='list'?{view:'list'}:null),
      style:{ ...TXTBTN, color:BLUE, fontWeight:800 } }, 'New'));

  const DOWF = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const siteSeqRow = (seq) => e('div', { style:{ display:'flex', alignItems:'center', gap:'0.25rem', flexWrap:'wrap' } },
    seq.length === 0
      ? e('span', { style:{ fontSize:'0.68rem', color:GREY, fontWeight:700 } }, 'No site set')
      : seq.map((s,i) => [
          e('span', { key:'s'+i, style:{ background:siteGrad(s), color:'#FFF', padding:'0.2rem 0.6rem', borderRadius:'999px', fontSize:'0.6rem', fontWeight:800 } }, SITES[s].label),
          i < seq.length-1 ? e('span', { key:'a'+i, style:{ fontSize:'0.6rem', color:GREY, fontWeight:800 } }, '→') : null
        ]));

  const isToday = (y,m,dnum) => { const t=new Date();
    return t.getFullYear()===y && t.getMonth()===m && t.getDate()===dnum; };

  /* ---------- ticket detail card — bright solid gradient; presentational only, wrapped by SwipeCard for tap/lock/delete ---------- */
  const ticketDetailCard = (j, i) => {
    const s = SITES[j.site], eq = eqOf(j), ex = exOf(j);
    const parts = (j.parts||[]).filter(p=>p.partNumber||p.partDescription);
    const on = mins(j.startDateTime, j.finishDateTime);
    const onC = s ? '#FFFFFF' : INK;
    const subC = s ? 'rgba(255,255,255,0.86)' : MID;
    const bodyC = s ? 'rgba(255,255,255,0.93)' : '#C7CAD8';
    const chipBg = s ? 'rgba(0,0,0,0.24)' : 'rgba(255,255,255,0.1)';
    return e('div', {
      style:{ background: s ? siteGrad(j.site) : SURF3,
        border: j.locked ? '3.5px solid '+LOCKED : (s ? '1.5px solid rgba(255,255,255,0.28)' : '1.5px solid '+LINE),
        boxShadow: j.locked ? '0 0 0 3px '+LOCKED+'33, '+SHADOW_SM : (s ? '0 10px 24px '+hexToRgba(s.hex,0.4) : SHADOW_SM),
        borderRadius:'18px', padding:'0.85rem 0.9rem', cursor:'pointer' } },
      e('div', { style:{ display:'flex', alignItems:'flex-start', gap:'0.5rem', marginBottom:'0.35rem' } },
        e('div', { style:{ flex:1, minWidth:0, display:'flex', alignItems:'center', gap:'0.4rem', flexWrap:'wrap' } },
          i != null ? e('span', { style:{ background:chipBg, color:onC, width:'19px', height:'19px', borderRadius:'999px', fontSize:'0.58rem', fontWeight:900, display:'flex', alignItems:'center', justifyContent:'center' } }, String(i+1)) : null,
          e('span', { style:{ fontWeight:900, fontSize:'0.94rem', letterSpacing:'-0.2px', color:onC } }, j.ticketNumber),
          s && e('span', { style:{ background:'rgba(0,0,0,0.24)', color:'#FFF', padding:'0.18rem 0.55rem', borderRadius:'999px', fontSize:'0.58rem', fontWeight:900 } }, s.label),
          eq.map(x => e('span', { key:x, style:{ background:chipBg, color:onC, padding:'0.16rem 0.42rem', borderRadius:'6px', fontSize:'0.55rem', fontWeight:900 } }, x)),
          ex.length > 0 && e('span', { style:{ background:'rgba(0,0,0,0.24)', color:'#FFF', padding:'0.16rem 0.45rem', borderRadius:'6px', fontSize:'0.55rem', fontWeight:900 } }, '+'+ex.length+' day')),
          j.locked && e('span', { key:'lk', style:{ display:'inline-flex' } }, LockIcon(true, 14, onC))),
      e('div', { style:{ fontSize:'0.68rem', color:subC, fontWeight:600 } },
        (j.hasTravel ? 'Travel 1 ' + fmtTime(j.travelDateTime) + '  ·  ' : '') +
        fmtTime(j.startDateTime) + '–' + fmtTime(j.finishDateTime) + (on ? '  ·  ' + hm(on) : '') +
        (j.hasTravel2 ? '  ·  Travel 2 ' + fmtTime(j.travel2DateTime) : '')),
      ex.length > 0 && e('div', { style:{ fontSize:'0.66rem', color:subC, fontWeight:700, marginTop:'0.25rem' } },
        'Also: ' + ex.map(x => fmtDay(x.startDateTime)+' '+fmtTime(x.startDateTime)+'–'+fmtTime(x.finishDateTime)).join(', ')),
      j.workDone && e('p', { style:{ fontSize:'0.8rem', color:bodyC, margin:'0.45rem 0 0', whiteSpace:'pre-wrap' } }, j.workDone),
      parts.length > 0 && e('div', { style:{ marginTop:'0.45rem', display:'flex', flexDirection:'column', gap:'0.15rem' } },
        parts.map((p,pi) => e('div', { key:pi, style:{ fontSize:'0.68rem', color:subC } },
          '• ' + (p.partNumber||'') + (p.partDescription ? ' — ' + p.partDescription : '')))));
  };

  const swipeCard = (j, i, ret) => e(SwipeCard, { key:j.id, locked:!!j.locked, radius:'18px',
      onLock:()=>toggleLock(j.id),
      onDelete:()=>{ if (window.confirm('Delete this ticket?')) remove(j.id); },
      onTap:()=>openEdit(j, ret) },
    ticketDetailCard(j, i));

  const dayCell = (dnum) => {
    const d = ms.days[dnum];
    const sites = d ? d.sites : [];
    const dow = (new Date(ms.y, ms.m, dnum).getDay() + 6) % 7;
    const weekend = dow >= 5;
    const today = isToday(ms.y, ms.m, dnum);
    const has = sites.length > 0;

    let bg = weekend ? SURF3 : '#14161F';
    if (sites.length === 1) bg = siteGrad(sites[0]);
    else if (sites.length > 1) bg = grad(SITES[sites[0]].hex, SITES[sites[1]].hex2);

    let border = '1px solid rgba(255,255,255,0.06)';
    if (has) border = '1px solid rgba(0,0,0,0.18)';
    if (d && d.allLocked) border = '2.5px solid '+LOCKED;

        onChange:(ev)=>setForm({ ...form, ticketNumber:ev.target.value }),
        style:{ ...FIELD, fontWeight:800, fontSize:'1.02rem' } }),

      e('div', { style:{ display:'flex', gap:'0.5rem' } },
        e('div', { style:{ flex:1, minWidth:0, display:'flex', alignItems:'center', gap:'0.45rem',
          border:'1.5px solid '+LINE, background:'#12141D', borderRadius:'13px', padding:'0 0.65rem' } },
          e('span', { style:{ width:'12px', height:'12px', borderRadius:'999px', flexShrink:0,
            background: SITES[form.site] ? siteGrad(form.site) : '#333748' } }),
          e('select', { value:form.site, onChange:(ev)=>setForm({ ...form, site:ev.target.value }),
            style:{ flex:1, minWidth:0, border:'none', background:'transparent', outline:'none', padding:'0.6rem 0',
              fontSize:'0.84rem', fontWeight:800, color: form.site ? INK : GREY } },
            e('option', { value:'' }, 'Site'),
            Object.keys(SITES).map(k => e('option', { key:k, value:k }, SITES[k].label)))),
        e('div', { style:{ flex:1, minWidth:0, display:'flex', alignItems:'center', gap:'0.45rem',
          border:'1.5px solid '+LINE, background:'#12141D', borderRadius:'13px', padding:'0 0.65rem' } },
          e('span', { style:{ width:'7px', height:'7px', borderRadius:'999px', flexShrink:0,
            background: form.equipment.length ? INK : '#333748' } }),
          e('select', { value:form.equipment[0] || '', onChange:(ev)=>setForm({ ...form, equipment: ev.target.value ? [ev.target.value] : [] }),
            style:{ flex:1, minWidth:0, border:'none', background:'transparent', outline:'none', padding:'0.6rem 0',
              fontSize:'0.84rem', fontWeight:800, color: form.equipment.length ? INK : GREY } },
            e('option', { value:'' }, 'Machine'),
            Object.keys(EQUIP).map(k => e('option', { key:k, value:k }, EQUIP[k]))))),

      dayPanel(form, updateMain, 'm', 'Day 1', null),

      form.extra.map((d,i) => dayPanel(d, (patch)=>updateExtra(i, patch), 'e'+i, 'Day ' + (i+2),
        ()=>setForm({ ...form, extra: form.extra.filter((_,x)=>x!==i) }))),

      e('button', { onClick:addExtraDay,
        style:{ width:'100%', border:'1.5px dashed '+LINE, background:'transparent', color:MID,
          borderRadius:'14px', padding:'0.72rem', fontSize:'0.76rem', fontWeight:800, cursor:'pointer' } },
        '+ Another day'),

      e('div', null,
        e('label', { style:{ ...LBL, marginBottom:'0.45rem' } }, 'Work done'),
        e('textarea', { value:form.workDone, placeholder:'Notes about work completed…',
          onChange:(ev)=>setForm({ ...form, workDone:ev.target.value }),
          style:{ ...FIELD, minHeight:'7.5rem', resize:'none', lineHeight:1.5 } })),

      e('datalist', { id:'partList' }, partHistory.map(([n,d]) => e('option', { key:n, value:n }, d))),

      form.parts.length > 0 && e('div', null,
        e('label', { style:{ ...LBL, marginBottom:'0.45rem' } }, 'Parts'),
        e('div', { style:{ display:'flex', flexDirection:'column', gap:'0.4rem' } },
          form.parts.map((p,i) => e('div', { key:i, style:{ display:'flex', gap:'0.4rem', alignItems:'center' } },
            e('input', { type:'text', value:p.partNumber, placeholder:'Part no.', list:'partList',
              onChange:(ev)=>setPart(i,'partNumber',ev.target.value),
              style:{ flex:'0 0 38%', minWidth:0, border:'1.5px solid '+LINE, background:'#12141D', borderRadius:'11px',
                padding:'0.55rem 0.65rem', fontSize:'0.8rem', fontWeight:800, outline:'none', color:INK } }),
            e('input', { type:'text', value:p.partDescription, placeholder:'Description',
              onChange:(ev)=>setPart(i,'partDescription',ev.target.value),
              style:{ flex:1, minWidth:0, border:'1.5px solid '+LINE, background:'#12141D', borderRadius:'11px',
                padding:'0.55rem 0.65rem', fontSize:'0.8rem', outline:'none', color:INK } }),
            e('button', { onClick:()=>setForm({ ...form, parts: form.parts.filter((_,x)=>x!==i) }),
              style:{ border:'none', background:'none', color:GREY, fontSize:'0.8rem', fontWeight:800, cursor:'pointer', width:'18px', flexShrink:0 } }, '✕'))))),

      e('button', { onClick:()=>setForm({ ...form, parts:[ ...form.parts, { partNumber:'', partDescription:'' } ] }),
        style:{ width:'100%', border:'1.5px dashed '+LINE, background:'transparent', color:MID,
          borderRadius:'14px', padding:'0.72rem', fontSize:'0.76rem', fontWeight:800, cursor:'pointer' } }, '+ Add part'),

      e('button', { onClick:()=>setForm({ ...form, locked: !form.locked }),
        style:{ width:'100%', display:'flex', alignItems:'center', gap:'0.65rem', cursor:'pointer',
          border: form.locked ? '2.5px solid '+LOCKED : '1.5px solid '+LINE,
          background: form.locked ? LOCKEDBG : '#12141D',
          borderRadius:'16px', padding:'0.78rem 0.85rem', textAlign:'left' } },
        LockIcon(!!form.locked, 21),
        e('div', { style:{ flex:1, minWidth:0 } },
          e('div', { style:{ fontSize:'0.84rem', fontWeight:900, color: form.locked ? LOCKED : INK } },
            form.locked ? 'Ready for sign-off' : 'Mark ready for sign-off'),
          e('div', { style:{ fontSize:'0.65rem', color:GREY, fontWeight:600, marginTop:'1px' } },
            form.locked ? 'Highlighted on the calendar' : 'All information has been added')),
        e('span', { style:{ width:'22px', height:'22px', borderRadius:'999px', flexShrink:0,
          border: form.locked ? 'none' : '2px solid #454A5E', background: form.locked ? LOCKED : 'transparent',
          display:'flex', alignItems:'center', justifyContent:'center', color:'#FFF', fontSize:'0.72rem', fontWeight:900 } },
          form.locked ? '✓' : ''))));

  if (!ready) return e('div', { style:{ padding:'4rem', textAlign:'center', color:GREY } }, 'Loading…');

  const body = view === 'form' ? formView : view === 'list' ? listView : monthView;
  return e('div', null, header, body, menu, daySheet, formSheet, swipeHint);
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
